---

- name: Create mongo db and test mongo express app
  hosts: localhost
  gather_facts: false
  # vars_files:
  #   - group_vars/all/vault.yml
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    vault_kv_path: "mongodb"
  tasks:

    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: mongodb-secret
            namespace: mongodb
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: mongodb-secret
              creationPolicy: Owner
            data:
              - secretKey: mongo-root-username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_username
              - secretKey: mongo-root-password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_password
              - secretKey: mongo_backup_username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_backup_username
              - secretKey: mongo_backup_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_backup_password

    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: mongodb-secret
            namespace: mongo-express
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: mongodb-secret
              creationPolicy: Owner
            data:
              - secretKey: mongo-root-username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_username
              - secretKey: mongo-root-password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_password

    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: mongodb-user-secret
            namespace: mongodb
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: mongodb-user-secret
              creationPolicy: Owner
              template:
                data:
                  mongo-database: Trellis
                  # Bring the vault references explicitly into the template:
                  mongo-username: "{% raw %}{{ .mongo_username }}{% endraw %}"
                  mongo-password: "{% raw %}{{ .mongo_password }}{% endraw %}"
            data:
              - secretKey: mongo_username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_username
              - secretKey: mongo_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_password

    - name: Deploy MongoDB StatefulSet, headless service, and configuration
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: apps/v1
            kind: StatefulSet
            metadata:
              name: mongodb-statefulset
              namespace: mongodb
              labels:
                app: mongo
            spec:
              serviceName: mongodb-service
              replicas: 1
              selector:
                matchLabels:
                  app: mongo
              template:
                metadata:
                  labels:
                    app: mongo
                spec:
                  containers:
                    - name: mongo
                      image: mongo:6.0
                      ports:
                        - containerPort: 27017
                      env:
                        - name: MONGO_INITDB_ROOT_USERNAME
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-username
                        - name: MONGO_INITDB_ROOT_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-password
                      volumeMounts:
                        - name: mongodb-ss-storage
                          mountPath: /data/db
                        - name: init-scripts
                          mountPath: /docker-entrypoint-initdb.d
                      livenessProbe:
                        exec:
                          command:
                            - mongosh
                            - --username
                            - "$(MONGO_INITDB_ROOT_USERNAME)"
                            - --password
                            - "$(MONGO_INITDB_ROOT_PASSWORD)"
                            - --authenticationDatabase
                            - admin
                            - --eval
                            - "db.adminCommand('ping')"
                        initialDelaySeconds: 30
                        periodSeconds: 10
                        timeoutSeconds: 5
                        failureThreshold: 3
                      readinessProbe:
                        exec:
                          command:
                            - mongosh
                            - --username
                            - "$(MONGO_INITDB_ROOT_USERNAME)"
                            - --password
                            - "$(MONGO_INITDB_ROOT_PASSWORD)"
                            - --authenticationDatabase
                            - admin
                            - --eval
                            - "db.adminCommand('ping')"
                        initialDelaySeconds: 15
                        periodSeconds: 10
                        timeoutSeconds: 5
                        failureThreshold: 3
                  volumes:
                    - name: init-scripts
                      configMap:
                        name: mongodb-init-script
              volumeClaimTemplates:
                - metadata:
                    name: mongodb-ss-storage
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 5Gi
                    storageClassName: rook-ceph-block

          - apiVersion: v1
            kind: Service
            metadata:
              name: mongodb-service
              namespace: mongodb
            spec:
              clusterIP: None
              selector:
                app: mongo
              ports:
                - protocol: TCP
                  port: 27017
                  targetPort: 27017

          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mongodb-configmap
              namespace: mongo-express
            data:
              database_url: mongodb-service.mongodb.svc.cluster.local

    - name: Wait for mongodb-statefulset to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: mongodb-statefulset
        namespace: mongodb
      register: deploy_info
      until:
        - deploy_info.resources | length > 0
        - deploy_info.resources[0].status.readyReplicas is defined
      retries: 40   # e.g. wait up to 200s total
      delay: 5

    - name: Deploy mongo-express Deployment and Service resources
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: mongo-express
              namespace: mongo-express
              labels:
                app: mongo-express
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: mongo-express
              template:
                metadata:
                  labels:
                    app: mongo-express
                spec:
                  securityContext:
                    fsGroup: 1000
                  containers:
                    - name: mongo-express
                      image: mongo-express
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                      ports:
                        - containerPort: 8081
                      readinessProbe:
                        tcpSocket:
                          port: 8081
                        initialDelaySeconds: 10
                        periodSeconds: 10
                      livenessProbe:
                        tcpSocket:
                          port: 8081
                        initialDelaySeconds: 300
                        periodSeconds: 100
                      env:
                        - name: ME_CONFIG_BASICAUTH_USERNAME
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-username
                        - name: ME_CONFIG_BASICAUTH_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-password
                        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-username
                        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: mongodb-secret
                              key: mongo-root-password
                        - name: ME_CONFIG_MONGODB_SERVER
                          value: "mongodb-service.mongodb.svc.cluster.local"

          - apiVersion: v1
            kind: Service
            metadata:
              name: mongo-express-service
              namespace: mongo-express
            spec:
              selector:
                app: mongo-express
              type: ClusterIP
              ports:
                - protocol: TCP
                  port: 8081
                  targetPort: 8081

    - name: Deploy mongo-express Ingress route
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: mongo-express-ingress
              namespace: mongo-express
              annotations:
                haproxy.org/check: "disabled"
                haproxy.org/backend-config-snippet: |
                  no option httpchk
            spec:
              ingressClassName: haproxy
              tls:
                - hosts:
                    - mongo.thekor.eu
                  secretName: wildcard-thekor
              rules:
                - host: mongo.thekor.eu
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: mongo-express-service
                            port:
                              number: 8081

    - name: Create MongoDB backup user
      ansible.builtin.shell: |
        BKP_USER=$(kubectl --kubeconfig {{ kubeconfig_path }} -n mongodb get secret mongodb-secret -o jsonpath='{.data.mongo_backup_username}' | base64 --decode)
        BKP_PASS=$(kubectl --kubeconfig {{ kubeconfig_path }} -n mongodb get secret mongodb-secret -o jsonpath='{.data.mongo_backup_password}' | base64 --decode)
        kubectl --kubeconfig {{ kubeconfig_path }} -n mongodb exec sts/mongodb-statefulset -- \
          sh -c "mongosh admin \
            -u \"\$MONGO_INITDB_ROOT_USERNAME\" \
            -p \"\$MONGO_INITDB_ROOT_PASSWORD\" \
            --authenticationDatabase admin \
            --quiet \
            --eval \"if (!db.getUser('$BKP_USER')) { db.createUser({ user: '$BKP_USER', pwd: '$BKP_PASS', roles: [ { role: 'readAnyDatabase', db: 'admin' }, { role: 'backup', db: 'admin' } ] }); }\""
            
