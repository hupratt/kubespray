---
- name: Deploy cert-manager and Hetzner webhook
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cert_manager_version: v1.18.2
    cert_manager_namespace: cert-manager
    kubeconfig_path: /home/hugo/.kube/config
    vault_kv_path: "certmanager"
    vault_init_json: "group_vars/all/vault_init.json"
    vault_addr: "https://vault.thekor.eu"
  tasks:

    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: hetzner-dns-api-token
            namespace: "{{ cert_manager_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: hetzner-dns-api-token
              creationPolicy: Owner
            data:
              - secretKey: token
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: hetzner_api

    - name: Add/update mittwald Helm repository
      kubernetes.core.helm_repository:
        name: mittwald
        repo_url: https://helm.mittwald.de

    - name: Apply cert-manager CRDs
      kubernetes.core.k8s:
        state: present
        src: "https://github.com/cert-manager/cert-manager/releases/download/v1.18.2/cert-manager.crds.yaml"

    - name: Create cert-manager-webhook-hetzner ClusterRole for ACME group
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-webhook-hetzner-acme-thekor-eu
          rules:
            - apiGroups: ["acme.hetzner.com"]
              resources: ["*"]
              verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

    - name: Bind ClusterRole to cert-manager ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-webhook-hetzner-acme-thekor-eu
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-webhook-hetzner-acme-thekor-eu
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

    - name: Create Role for reading secrets in cert-manager namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cert-manager-webhook-hetzner-secrets
            namespace: cert-manager
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]

    - name: Bind secrets Role to webhook ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cert-manager-webhook-hetzner-secrets
            namespace: cert-manager
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cert-manager-webhook-hetzner-secrets
          subjects:
            - kind: ServiceAccount
              name: cert-manager-webhook-hetzner
              namespace: cert-manager

    - name: Add Jetstack Helm repo
      community.kubernetes.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io
        force_update: true

    - name: Add Hetzner Helm repository
      community.kubernetes.helm_repository:
        name: hcloud
        repo_url: https://charts.hetzner.cloud

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      register: helm_repo_update
      changed_when: "'Update Complete.' in helm_repo_update.stdout"

    - name: Install cert-manager
      community.kubernetes.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: "{{ cert_manager_namespace }}"
        chart_version: "{{ cert_manager_version }}"
        create_namespace: false

    - name: Clone or update cert-manager-webhook-hetzner repo
      ansible.builtin.git:
        repo: "git@gitlab.thekor.eu:kube/cert-manager-webhook-hetzner.git"
        dest: /home/hugo/cert-manager-webhook-hetzner
        version: homelab
        update: no
      register: webhook_git

    - name: Install or upgrade cert-manager webhook for Hetzner from local path
      community.kubernetes.helm:
        name: cert-manager-webhook-hetzner
        chart_ref: "/home/hugo/cert-manager-webhook-hetzner/chart"
        namespace: "{{ cert_manager_namespace }}"
        create_namespace: false
        wait: true
        binary_path: "/usr/bin/helm"
      when: webhook_git is succeeded

    - name: Create ClusterIssuer for Let's Encrypt via Hetzner DNS01
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-dns-hetzner
          spec:
            acme:
              email: hprattdo@gmail.com
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-dns-hetzner-key
              solvers:
                - dns01:
                    webhook:
                      solverName: hetzner
                      groupName: acme.hetzner.com
                      config:
                        tokenSecretKeyRef:
                          name: hetzner-dns-api-token
                          key: token

    - name: Create wildcard Certificate for thekor.eu
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: wildcard-thekor
            namespace: cert-manager
          spec:
            secretName: wildcard-thekor
            issuerRef:
              name: letsencrypt-dns-hetzner
              kind: ClusterIssuer
            commonName: "*.thekor.eu"
            dnsNames:
              - "*.thekor.eu"
              - "thekor.eu"

    - name: Wait for wildcard-thekor certificate to be ready
      kubernetes.core.k8s_info:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: wildcard-thekor
        namespace: "{{ cert_manager_namespace }}"
      register: cert_info
      until: cert_info.resources | length > 0 and (
              cert_info.resources[0].status is defined and
              cert_info.resources[0].status.conditions is defined and
              (cert_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0))
      retries: 30
      delay: 30

    - name: Deploy kubernetes-replicator resources
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: replicator-kubernetes-replicator
              namespace: kube-system

          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: replicator-kubernetes-replicator
            rules:
              - apiGroups: [""]
                resources: ["namespaces"]
                verbs: ["get", "watch", "list"]
              - apiGroups: [""]
                resources: ["secrets", "configmaps", "serviceaccounts"]
                verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
              - apiGroups: ["rbac.authorization.k8s.io"]
                resources: ["roles", "rolebindings"]
                verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]

          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: replicator-kubernetes-replicator
            roleRef:
              kind: ClusterRole
              name: replicator-kubernetes-replicator
              apiGroup: rbac.authorization.k8s.io
            subjects:
              - kind: ServiceAccount
                name: replicator-kubernetes-replicator
                namespace: kube-system

          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: replicator-kubernetes-replicator
              namespace: kube-system
              labels:
                app.kubernetes.io/name: kubernetes-replicator
                app.kubernetes.io/instance: replicator
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: kubernetes-replicator
                  app.kubernetes.io/instance: replicator
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: kubernetes-replicator
                    app.kubernetes.io/instance: replicator
                spec:
                  serviceAccountName: replicator-kubernetes-replicator
                  securityContext: {}
                  containers:
                    - name: kubernetes-replicator
                      securityContext: {}
                      image: quay.io/mittwald/kubernetes-replicator:latest
                      imagePullPolicy: Always
                      args: []
                      ports:
                        - name: health
                          containerPort: 9102
                          protocol: TCP
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: health
                      readinessProbe:
                        httpGet:
                          path: /readyz
                          port: health
                      resources: {}

    - name: Annotate wildcard-thekor secret declaratively
      kubernetes.core.k8s:
        state: present
        kind: Secret
        namespace: "{{ cert_manager_namespace }}"
        name: wildcard-thekor
        definition:
          metadata:
            annotations:
              replicator.v1.mittwald.de/replicate-to: "amazon-clone,authentik,backup,booking,chirpy,donetick,frigate,haproxy,harbor,immich,linkwarden,makita,mongo-express,monitoring,netbox,open-webui,paperless,patchmon,scriberr,sftpgo,spotify,technitium,thrifty,trellis,vault,vaultwarden,www-portfolio"
