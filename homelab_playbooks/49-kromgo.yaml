---
- name: Deploy kromgo
  hosts: localhost
  gather_facts: false
  vars:
    kromgo_namespace: monitoring
    prometheus_url: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
    kromgo_hostname: kromgo.thekor.eu
    kromgo_tls_secret: wildcard-thekor
    kromgo_config: |
      defaults:
        badge:
          font: dejavu-sans
          size: 12

      badges:
        - id: kubernetes_version
          query: 'kubernetes_build_info{service="kubernetes"}'
          valueExpr: 'labels["git_version"]'

        - id: node_count
          query: "count(kube_node_info)"
          valueExpr: 'string(int(result)) + " nodes"'

        - id: cluster_cpu_usage
          query: "round(cluster:node_cpu:ratio_rate5m * 100, 0.1)"
          valueExpr: 'string(result) + "%"'
          colorExpr: 'result <= 35.0 ? "green" : result <= 75.0 ? "orange" : "red"'

        - id: cluster_memory_usage
          query: "round((1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100, 0.1)"
          valueExpr: 'string(result) + "%"'
          colorExpr: 'result <= 60.0 ? "green" : result <= 85.0 ? "orange" : "red"'

        - id: pod_count
          query: "count(kube_pod_info)"
          valueExpr: 'string(int(result)) + " pods"'

        - id: ceph_health
          query: "ceph_health_status{}"
          valueExpr: 'result == 0.0 ? "OK" : result == 1.0 ? "Warning" : "Error"'
          colorExpr: 'result == 0.0 ? "green" : result == 1.0 ? "orange" : "red"'

        - id: cluster_age
          query: "max(floor((time() - kube_node_created) / 86400))"
          valueExpr: 'string(int(result)) + "d"'

        - id: unhealthy_services
          query: "(count(monitor_status == 0) or vector(0))"
          valueExpr: 'string(int(result)) + " down"'
          colorExpr: 'result == 0.0 ? "green" : "red"'

        - id: node_uptime
          query: 'floor(max(time() - node_boot_time_seconds{namespace="monitoring"}) / 86400)'
          valueExpr: 'string(int(result)) + "d"'

        - id: fedora_version
          query: 'node_os_info{id="fedora"}'
          valueExpr: 'labels["version_id"]'

        - id: ilo_power_current_watt
          query: "sum(ilo_power_current_watt)"
          valueExpr: 'string(result) + "W"'
          colorExpr: 'result <= 300.0 ? "green" : result <= 600.0 ? "orange" : "red"'

        - id: cluster_memory_used_gb
          query: "round(sum(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / 1073741824, 0.1)"
          valueExpr: 'string(result) + "Gi"'
          colorExpr: 'result <= 150.0 ? "green" : result <= 200.0 ? "orange" : "red"'
  tasks:
  
    - name: Create Kromgo ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kromgo-config
            namespace: monitoring
          data:
            config.yaml: "{{ kromgo_config }}"

    - name: Deploy kromgo Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kromgo
            namespace: "{{ kromgo_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: kromgo
            template:
              metadata:
                labels:
                  app: kromgo
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  fsGroup: 65534
                containers:
                  - name: kromgo
                    image: ghcr.io/home-operations/kromgo:0.16.1
                    args:
                      - -config
                      - /etc/kromgo/config.yaml
                    env:
                      - name: KROMGO_PROMETHEUS_URL
                        value: "{{ prometheus_url }}"
                    volumeMounts:
                      - name: config
                        mountPath: /etc/kromgo/config.yaml
                        subPath: config.yaml
                        readOnly: true
                    ports:
                      - name: http
                        containerPort: 8080
                      - name: metrics
                        containerPort: 8081

                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3

                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                volumes:
                  - name: config
                    configMap:
                      name: kromgo-config

    - name: Deploy kromgo Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: kromgo
            namespace: "{{ kromgo_namespace }}"
          spec:
            selector:
              app: kromgo
            ports:
              - name: http
                port: 80
                targetPort: 8080
              - name: health
                port: 8888
                targetPort: 8888

    - name: Deploy kromgo Ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: kromgo
            namespace: "{{ kromgo_namespace }}"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "{{ kromgo_hostname }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kromgo
                          port:
                            number: 80
            tls:
              - hosts:
                  - "{{ kromgo_hostname }}"
                secretName: "{{ kromgo_tls_secret }}"

