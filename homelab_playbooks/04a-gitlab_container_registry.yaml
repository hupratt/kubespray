---
- name: Deploy registry key
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    vault_kv_path: "registry"

  tasks:
    - name: Deploy ExternalSecret for Docker Registry
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: docker-registry-secret
            namespace: kube-system
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: docker-registry-secret
              creationPolicy: Owner
              template:
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: |-
                    {% raw %}
                    {
                      "auths": {
                        "{{ .registry_url }}": {
                          "username": "{{ .registry_username }}",
                          "password": "{{ .registry_password }}",
                          "auth": "{{ printf "%s:%s" .registry_username .registry_password | b64enc }}"
                        }
                      }
                    }
                    {% endraw %}
            data:
              - secretKey: registry_username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: registry_username
              - secretKey: registry_url
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: registry_url
              - secretKey: registry_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: registry_password

    - name: Annotate docker-registry-secret secret declaratively
      kubernetes.core.k8s:
        state: present
        kind: Secret
        namespace: kube-system
        name: docker-registry-secret
        definition:
          metadata:
            annotations:
              replicator.v1.mittwald.de/replicate-to: "amazon-clone,authentik,backup,booking,cert-manager,chirpy,cilium-secrets,cn-postgres,etcd-backup,frigate,haproxy,harbor,immich,kubewarden,linkwarden,makita,mariadb,mongo-express,mongodb,monitoring,netbox,open-webui,paperless,rook-ceph,sftpgo,spotify,thrifty,trellis,vault,vaultwarden,www-portfolio,youtube"

