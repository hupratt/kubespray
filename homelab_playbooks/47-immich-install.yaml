---
# deploy_immich.yml
- name: Deploy Immich
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    immich_namespace: immich
    immich_chart_version: "0.12.0"
    immich_chart_repo: https://immich-app.github.io/immich-charts
    immich_release_name: immich

    immich_node_selector:
      node-role: slow-services

    immich_tolerations:
      - key: dedicated
        operator: Equal
        value: slow-services
        effect: NoSchedule

    immich_library_pv: slow-pv-02
    immich_library_storage_class: slow-local
    immich_library_storage_size: 3000Gi

    immich_db_pv: slow-pv-03
    immich_db_storage_class: slow-local
    immich_db_storage_size: 100Gi

    # TensorChord image — built on CNPG base (UID 26), includes vectorchord
    immich_db_image: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.3.0

    vault_secret_store: vault-backend
    vault_kv_mount: immich
    vault_kv_restic_mount: restic

    volsync_schedule: "0 2 * * *"
    volsync_retain_hourly: 24
    volsync_retain_daily: 7
    volsync_retain_weekly: 4
    volsync_retain_monthly: 3

  tasks:

    # ── ExternalSecrets ──────────────────────────────────────────────────────

    - name: Deploy ExternalSecret for Immich DB credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: immich-db-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: immich-db-secret
              creationPolicy: Owner
              template:
                engineVersion: v2
                data:
                  POSTGRES_USER: "{{ '{{' }} .username {{ '}}' }}"
                  POSTGRES_PASSWORD: "{{ '{{' }} .password {{ '}}' }}"
                  POSTGRES_DB: "{{ '{{' }} .name {{ '}}' }}"
                  uri: "postgresql://{{ '{{' }} .username {{ '}}' }}:{{ '{{' }} .password {{ '}}' }}@immich-cnpg-rw.{{ immich_namespace }}.svc/{{ '{{' }} .name {{ '}}' }}"
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: username
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: password
              - secretKey: name
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: name

    - name: Deploy ExternalSecret for Immich application secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: immich-app-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: immich-app-secret
              creationPolicy: Owner
              template:
                engineVersion: v2
                data:
                  DB_USERNAME: "{{ '{{' }} .username {{ '}}' }}"
                  DB_PASSWORD: "{{ '{{' }} .password {{ '}}' }}"
                  DB_DATABASE_NAME: "{{ '{{' }} .name {{ '}}' }}"
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: username
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: password
              - secretKey: name
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: name

    - name: Deploy ExternalSecret for VolSync restic repository
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: volsync-restic-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: volsync-restic-secret
              creationPolicy: Owner
            data:
              - secretKey: RESTIC_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_restic_mount }}"
                  property: RESTIC_PASSWORD
              - secretKey: RESTIC_REPOSITORY
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: RESTIC_DB_REPOSITORY
              - secretKey: AWS_ACCESS_KEY_ID
                remoteRef:
                  key: "{{ vault_kv_restic_mount }}"
                  property: AWS_ACCESS_KEY_ID
              - secretKey: AWS_SECRET_ACCESS_KEY
                remoteRef:
                  key: "{{ vault_kv_restic_mount }}"
                  property: AWS_SECRET_ACCESS_KEY

    - name: Wait for ExternalSecrets to sync
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ExternalSecret
        namespace: "{{ immich_namespace }}"
        name: "{{ item }}"
      register: es_status
      until: >-
        es_status.resources | length > 0 and
        es_status.resources[0].status is defined and
        (es_status.resources[0].status.conditions |
         selectattr('type', 'equalto', 'Ready') |
         selectattr('status', 'equalto', 'True') | list | length > 0)
      retries: 20
      delay: 10
      loop:
        - immich-db-secret
        - immich-app-secret
        - volsync-restic-secret

    - name: Create ExternalSecret for shared cluster superuser
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "superuser-vault-secret"
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: "superuser-vault-secret"
              creationPolicy: Owner
              template:
                type: kubernetes.io/basic-auth
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ immich_namespace }}"
                  property: username
              - secretKey: password
                remoteRef:
                  key: "{{ immich_namespace }}"
                  property: password
    # ── PVCs ─────────────────────────────────────────────────────────────────

    - name: Create Immich library PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-library
            namespace: "{{ immich_namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            volumeName: "{{ immich_library_pv }}"
            storageClassName: "{{ immich_library_storage_class }}"
            resources:
              requests:
                storage: "{{ immich_library_storage_size }}"

    - name: Create ExternalSecret for backup user
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: cnpg-backup-user
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: cnpg-backup-user
              creationPolicy: Owner
            data:
              - secretKey: setup.sql
                remoteRef:
                  key: cn-postgres
                  property: setup.sql

    # ── CNPG Cluster ─────────────────────────────────────────────────────────

    - name: Deploy CNPG Cluster for Immich
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: immich-cnpg
            namespace: "{{ immich_namespace }}"
          spec:
            instances: 1
            enableSuperuserAccess: true
            imageName: "{{ immich_db_image }}"
            affinity:
              nodeSelector: "{{ immich_node_selector }}"
              tolerations: "{{ immich_tolerations }}"
            postgresql:
              shared_preload_libraries:
                - vchord.so
            superuserSecret:
              name: superuser-vault-secret
            bootstrap:
              initdb:
                database: immich
                owner: immich
                secret:
                  name: immich-db-secret
                postInitSQLRefs:
                  secretRefs:
                    - name: cnpg-backup-user
                      key: setup.sql
                postInitSQL:
                  - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
                  - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
                  - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
            storage:
              pvcTemplate:
                accessModes: [ReadWriteOnce]
                volumeName: "{{ immich_db_pv }}"
                storageClassName: "{{ immich_db_storage_class }}"
                resources:
                  requests:
                    storage: "{{ immich_db_storage_size }}"

    - name: Wait for CNPG cluster to be ready
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: "{{ immich_namespace }}"
        name: immich-cnpg
      register: cnpg_status
      until: >-
        cnpg_status.resources | length > 0 and
        cnpg_status.resources[0].status is defined and
        (cnpg_status.resources[0].status.conditions |
         selectattr('type', 'equalto', 'Ready') |
         selectattr('status', 'equalto', 'True') | list | length > 0)
      retries: 30
      delay: 15

    # ── Helm release ─────────────────────────────────────────────────────────

    - name: Add Immich Helm repository
      kubernetes.core.helm_repository:
        name: immich
        repo_url: "{{ immich_chart_repo }}"

    - name: Deploy Immich via Helm
      kubernetes.core.helm:
        name: "{{ immich_release_name }}"
        chart_ref: immich/immich
        chart_version: "{{ immich_chart_version }}"
        release_namespace: "{{ immich_namespace }}"
        create_namespace: false
        wait: true
        timeout: 10m0s
        values: "{{ lookup('template', 'charts/immich/immich-values.yml.j2') | from_yaml }}"
        
    - name: Set ingressClassName on Immich ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: immich-server
            namespace: immich
          spec:
            ingressClassName: haproxy