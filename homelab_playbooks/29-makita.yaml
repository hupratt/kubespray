---
- name: Deploy makita
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    namespace: makita
    backend_image: registry.thekor.eu/docker/makita/makita-backend:latest
    backend_port: 9224
    frontend_port: 80
    vault_kv_path: "makita-booking"

  tasks:
    - name: Deploy ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: makita-backend-env
            namespace: "{{ namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: makita-backend-env
              creationPolicy: Owner
            data:
              - secretKey: DJANGO_SECRET_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_SECRET_KEY
              - secretKey: DJANGO_DEBUG
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_DEBUG
              - secretKey: DJANGO_ALLOWED_HOSTS
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_ALLOWED_HOSTS
              - secretKey: enginedb
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: enginedb
              - secretKey: hostip
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: hostip
              - secretKey: pnumber
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: pnumber
              - secretKey: dbuser
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: dbuser
              - secretKey: dbpassword
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: dbpassword
              - secretKey: DJANGO_DEVELOPMENT
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_DEVELOPMENT
              - secretKey: REACT_APP_BASE
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: REACT_APP_BASE
              - secretKey: DJANGO_SETTINGS_MODULE
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_SETTINGS_MODULE
              - secretKey: DEEPL_API_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DEEPL_API_KEY
              - secretKey: POSTHOG_DOMAIN
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: POSTHOG_DOMAIN
              - secretKey: POSTHOG_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: POSTHOG_KEY
              - secretKey: ENVIRONMENT
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: ENVIRONMENT
              - secretKey: MAPTILER_JSON
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: MAPTILER_JSON
              - secretKey: WHITENOISE
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: WHITENOISE

    - name: Create rook-cephfs StorageClass
      k8s:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: rook-cephfs-makita
        definition:
          metadata:
            name: rook-cephfs-makita
          provisioner: rook-ceph.cephfs.csi.ceph.com
          parameters:
            clusterID: rook-ceph
            fsName: myfs
            pool: myfs-data0
            subvolumeGroup: csi
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            monitors: ceph-mon.rook-ceph.svc.cluster.local
            mounter: fuse
          mountOptions:
            - debug
          reclaimPolicy: Retain
          allowVolumeExpansion: true

    # -------------------------------------------------------------------------
    # PERSISTENT VOLUME CLAIMS
    # (replaces bind-mounts: ./static, ./media, ./:/hdd/Dev/portfolio)
    # -------------------------------------------------------------------------
    - name: Create PVC for static files
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: makita-static
            namespace: "{{ namespace }}"
          spec:
            storageClassName: rook-cephfs-makita
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: "500M"

    - name: Create PVC for media files
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: makita-media
            namespace: "{{ namespace }}"
          spec:
            storageClassName: rook-cephfs-makita
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: "100M"

    # -------------------------------------------------------------------------
    # BACKEND DEPLOYMENT (Django)
    # -------------------------------------------------------------------------
    - name: Deploy backend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: makita-backend
            namespace: "{{ namespace }}"
            labels:
              app: makita-backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: makita-backend
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
            template:
              metadata:
                labels:
                  app: makita-backend
              spec:
                imagePullSecrets:
                  - name: docker-registry-secret
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                initContainers:
                  - name: migrate
                    image: "{{ backend_image }}"
                    imagePullPolicy: Always
                    command:
                      - sh
                      - -c
                      - |
                        python manage.py makemigrations &&
                        python manage.py migrate &&
                        python manage.py collectstatic --noinput
                    envFrom:
                      - secretRef:
                          name: makita-backend-env
                    volumeMounts:
                      - name: app-static
                        mountPath: /app/static
                      - name: app-media
                        mountPath: /app/media
                containers:
                  - name: backend
                    image: "{{ backend_image }}"
                    imagePullPolicy: Always
                    command:
                      - sh
                      - -c
                      - python manage.py runserver 0.0.0.0:9224
                    ports:
                      - containerPort: "{{ backend_port }}"
                    envFrom:
                      - secretRef:
                          name: makita-backend-env
                    volumeMounts:
                      - name: app-static
                        mountPath: /app/static
                      - name: app-media
                        mountPath: /app/media
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 512Mi
                    livenessProbe:
                      httpGet:
                        path: /
                        port: "{{ backend_port }}"
                      initialDelaySeconds: 30
                      periodSeconds: 15
                    readinessProbe:
                      httpGet:
                        path: /
                        port: "{{ backend_port }}"
                      initialDelaySeconds: 10
                      periodSeconds: 5
                volumes:
                  - name: app-static
                    persistentVolumeClaim:
                      claimName: makita-static
                  - name: app-media
                    persistentVolumeClaim:
                      claimName: makita-media

    # -------------------------------------------------------------------------
    # BACKEND SERVICE
    # -------------------------------------------------------------------------
    - name: Create backend service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: makita-backend
            namespace: "{{ namespace }}"
          spec:
            selector:
              app: makita-backend
            ports:
              - name: http
                port: "{{ backend_port }}"
                targetPort: "{{ backend_port }}"
            type: ClusterIP

    - name: Create ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: makita-ingress
            namespace: "{{ namespace }}"
            annotations:
              haproxy.org/check: "disabled"
              haproxy.org/backend-config-snippet: |
                no option httpchk
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - makita.thekor.eu
                secretName: wildcard-thekor
            rules:
              - host: makita.thekor.eu
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: makita-backend
                          port:
                            number: "{{ backend_port }}"


