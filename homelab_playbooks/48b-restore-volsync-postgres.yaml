---
# postgres_volsync_restore.yml
#
# Restores PostgreSQL PVCs from restic snapshots via VolSync ReplicationDestination.
# Targets CloudNativePG Cluster resources (one cluster per database).
#
# Flow per database:
#   1. Read restic + DB credentials from existing cluster Secrets
#   2. Check if the DB is empty via k8s_exec into the CNPG pod
#   3. If empty:
#      a. Suspend the CNPG Cluster via hibernation annotation
#      b. Wait for pod to terminate
#      c. Delete and recreate the PVC unbound
#      d. Create a VolSync ReplicationDestination (manual trigger)
#      e. Wait for restore to complete
#      f. Resume the CNPG Cluster
#      g. Wait for pod Ready
#      h. Verify table count
#      i. Clean up ReplicationDestination
#
# Naming conventions (one cluster per DB):
#   CNPG Cluster:   <namespace>-pg
#   Primary pod:    <namespace>-pg-1
#   PVC:            <namespace>-pg-1
#   Restic Secret:  restic-credentials  (per namespace)
#   DB Secret:      <namespace>-pg-vault-secret
#   Restic repo:    s3:<endpoint>/<bucket>/<prefix>/<db.name>
#
# Usage:
#   ansible-playbook postgres_volsync_restore.yml \
#     -i inventory/homelab \
#     --vault-password-file ~/.vault_pass \
#     [-e dry_run=true]

- name: PostgreSQL PVC restore via VolSync (CloudNativePG)
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config') }}"
    volsync_restore_timeout: 600
    dry_run: false

    restic_s3_endpoint: "https://garage.example.com"
    restic_s3_bucket: "volsync-backups"
    restic_repo_prefix: "postgres"

    restore_databases:
      - name: paperless
        namespace: paperless
        storage_class: rook-ceph-block
        storage_size: 5Gi

      # - name: authentik
      #   namespace: authentik
      #   storage_class: rook-ceph-block
      #   storage_size: 5Gi

      # - name: vaultwarden
      #   namespace: vaultwarden
      #   storage_class: rook-ceph-block
      #   storage_size: 2Gi

      # - name: netbox
      #   namespace: netbox
      #   storage_class: rook-ceph-block
      #   storage_size: 5Gi

  tasks:

    - name: Check VolSync CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: replicationdestinations.volsync.backube
      register: _volsync_crd
      failed_when: _volsync_crd.resources | length == 0

    - name: Check CloudNativePG CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusters.postgresql.cnpg.io
      register: _cnpg_crd
      failed_when: _cnpg_crd.resources | length == 0

    # loop goes on include_tasks — blocks cannot loop directly
    - name: Restore database {{ db.name }}
      ansible.builtin.include_tasks: 48c-task.yaml
      loop: "{{ restore_databases }}"
      loop_control:
        loop_var: db
        label: "{{ db.name }}"