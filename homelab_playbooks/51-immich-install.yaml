---
# deploy_immich.yml
- name: Deploy Immich
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    immich_namespace: immich
    immich_chart_version: "0.12.0"
    immich_chart_repo: https://immich-app.github.io/immich-charts
    immich_release_name: immich

    immich_node_selector:
      node-role: slow-services

    immich_library_storage_class: rook-cephfs
    immich_library_storage_size: 200Gi
    immich_db_storage_class: rook-ceph-block
    immich_db_storage_size: 2000Gi

    vault_secret_store: vault-backend
    vault_kv_mount: immich

    volsync_schedule: "0 2 * * *"
    volsync_retain_hourly: 24
    volsync_retain_daily: 7
    volsync_retain_weekly: 4
    volsync_retain_monthly: 3

  tasks:

    # ── Namespace ────────────────────────────────────────────────────────────

    - name: Ensure immich namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ immich_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible

    # ── ExternalSecrets ──────────────────────────────────────────────────────

    - name: Deploy ExternalSecret for Immich DB credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: immich-db-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: immich-db-secret
              creationPolicy: Owner
              template:
                engineVersion: v2
                data:
                  POSTGRES_USER: "{{ '{{' }} .username {{ '}}' }}"
                  POSTGRES_PASSWORD: "{{ '{{' }} .password {{ '}}' }}"
                  POSTGRES_DB: "{{ '{{' }} .name {{ '}}' }}"
                  uri: "postgresql://{{ '{{' }} .username {{ '}}' }}:{{ '{{' }} .password {{ '}}' }}@immich-cnpg-rw.{{ immich_namespace }}.svc/{{ '{{' }} .name {{ '}}' }}"
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: username
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: password
              - secretKey: name
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: name

    - name: Deploy ExternalSecret for Immich application secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: immich-app-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: immich-app-secret
              creationPolicy: Owner
              template:
                engineVersion: v2
                data:
                  DB_USERNAME: "{{ '{{' }} .username {{ '}}' }}"
                  DB_PASSWORD: "{{ '{{' }} .password {{ '}}' }}"
                  DB_DATABASE_NAME: "{{ '{{' }} .name {{ '}}' }}"
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: username
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: password
              - secretKey: name
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: name

    - name: Deploy ExternalSecret for VolSync restic repository
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: volsync-restic-secret
            namespace: "{{ immich_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: "{{ vault_secret_store }}"
              kind: ClusterSecretStore
            target:
              name: volsync-restic-secret
              creationPolicy: Owner
            data:
              - secretKey: RESTIC_REPOSITORY
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: repository
              - secretKey: RESTIC_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: password
              - secretKey: AWS_ACCESS_KEY_ID
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: aws_access_key_id
              - secretKey: AWS_SECRET_ACCESS_KEY
                remoteRef:
                  key: "{{ vault_kv_mount }}"
                  property: aws_secret_access_key

    - name: Wait for ExternalSecrets to sync
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1beta1
        kind: ExternalSecret
        namespace: "{{ immich_namespace }}"
        name: "{{ item }}"
      register: es_status
      until: >-
        es_status.resources | length > 0 and
        (es_status.resources[0].status.conditions | selectattr('type','equalto','Ready') |
         selectattr('status','equalto','True') | list | length > 0)
      retries: 20
      delay: 10
      loop:
        - immich-db-secret
        - immich-app-secret
        - volsync-restic-secret

    # ── Library PVC ──────────────────────────────────────────────────────────
    # Chart requires existingClaim — we pre-create it here.

    - name: Create Immich library PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-library
            namespace: "{{ immich_namespace }}"
          spec:
            accessModes: [ReadWriteMany]
            storageClassName: "{{ immich_library_storage_class }}"
            resources:
              requests:
                storage: "{{ immich_library_storage_size }}"

    # ── CNPG Cluster ─────────────────────────────────────────────────────────

    - name: Deploy CNPG Cluster for Immich
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: immich-cnpg
            namespace: "{{ immich_namespace }}"
          spec:
            instances: 1
            imageName: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
            affinity:
              nodeSelector: "{{ immich_node_selector }}"
            bootstrap:
              initdb:
                database: immich
                owner: immich
                secret:
                  name: immich-db-secret
            storage:
              storageClass: "{{ immich_db_storage_class }}"
              size: "{{ immich_db_storage_size }}"

    - name: Wait for CNPG cluster to be ready
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: "{{ immich_namespace }}"
        name: immich-cnpg
      register: cnpg_status
      until: >-
        cnpg_status.resources | length > 0 and
        (cnpg_status.resources[0].status.conditions | selectattr('type','equalto','Ready') |
         selectattr('status','equalto','True') | list | length > 0)
      retries: 30
      delay: 15

    # ── Helm release ─────────────────────────────────────────────────────────

    - name: Add Immich Helm repository
      kubernetes.core.helm_repository:
        name: immich
        repo_url: "{{ immich_chart_repo }}"

    - name: Deploy Immich via Helm
      kubernetes.core.helm:
        name: "{{ immich_release_name }}"
        chart_ref: immich/immich
        chart_version: "{{ immich_chart_version }}"
        release_namespace: "{{ immich_namespace }}"
        create_namespace: false
        wait: true
        timeout: 10m0s
        values: "{{ lookup('template', 'charts/immich/immich-values.yml.j2') | from_yaml }}"

    # ── VolSync ReplicationSource ────────────────────────────────────────────

    - name: Deploy VolSync ReplicationSource for Immich library
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: volsync.backube/v1alpha1
          kind: ReplicationSource
          metadata:
            name: immich-library-backup
            namespace: "{{ immich_namespace }}"
          spec:
            sourcePVC: immich-library
            trigger:
              schedule: "{{ volsync_schedule }}"
            restic:
              pruneIntervalDays: 7
              repository: volsync-restic-secret
              retain:
                hourly: "{{ volsync_retain_hourly }}"
                daily: "{{ volsync_retain_daily }}"
                weekly: "{{ volsync_retain_weekly }}"
                monthly: "{{ volsync_retain_monthly }}"
              copyMethod: Snapshot
              storageClassName: "{{ immich_library_storage_class }}"
              volumeSnapshotClassName: ceph-fs-snapclass
              moverSecurityContext:
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000

    - name: Deploy VolSync ReplicationSource for Immich DB
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: volsync.backube/v1alpha1
          kind: ReplicationSource
          metadata:
            name: immich-db-backup
            namespace: "{{ immich_namespace }}"
          spec:
            sourcePVC: immich-cnpg-1
            trigger:
              schedule: "{{ volsync_schedule }}"
            restic:
              pruneIntervalDays: 7
              repository: volsync-restic-secret
              retain:
                hourly: "{{ volsync_retain_hourly }}"
                daily: "{{ volsync_retain_daily }}"
                weekly: "{{ volsync_retain_weekly }}"
                monthly: "{{ volsync_retain_monthly }}"
              copyMethod: Snapshot
              storageClassName: "{{ immich_db_storage_class }}"
              volumeSnapshotClassName: ceph-block-snapclass
              moverSecurityContext:
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000

    # ── Verification ─────────────────────────────────────────────────────────

    - name: Show ReplicationSource status
      kubernetes.core.k8s_info:
        api_version: volsync.backube/v1alpha1
        kind: ReplicationSource
        namespace: "{{ immich_namespace }}"
      register: rs_info

    - name: Print ReplicationSource last sync times
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}:
          lastSyncTime={{ item.status.lastSyncTime | default('not yet synced') }}
          lastSyncDuration={{ item.status.lastSyncDuration | default('n/a') }}
      loop: "{{ rs_info.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"