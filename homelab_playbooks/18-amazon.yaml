---
- name: Deploy amazon
  hosts: localhost
  gather_facts: false
  # vars_files:
  #   - group_vars/all/vault.yml
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    vault_kv_path: "mongodb"
  
  tasks:
    - name: Deploy ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: amazon-database-url
            namespace: amazon-clone
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: amazon-database-url
              creationPolicy: Owner
              template:
                data:
                  amazon-database-url: |-
                    {% raw %}mongodb://{{ .mongo_testapp_username }}:{{ .mongo_testapp_password }}@mongodb-service.mongodb.svc.cluster.local:27017/Amazon?authSource=admin{% endraw %}
            data:
              - secretKey: mongo_testapp_username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_username
              - secretKey: mongo_testapp_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: mongo_testapp_password

    - name: Deploy Amazon clone stack to Kubernetes
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mongodb-configmap
              namespace: amazon-clone
            data:
              database_url: mongodb-service.mongodb.svc.cluster.local
              database_name: Amazon

          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: amazon-backend
              namespace: amazon-clone
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: amazon-backend
              template:
                metadata:
                  labels:
                    app: amazon-backend
                spec:
                  imagePullSecrets:
                    - name: docker-registry-secret
                  containers:
                    - name: amazon-backend
                      image: registry.thekor.eu/docker/amazon/back:latest
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 8966
                      env:
                        - name: PORT
                          value: "8966"
                        - name: MONGO_URL
                          valueFrom:
                            secretKeyRef:
                              name: amazon-database-url
                              key: amazon-database-url
                      securityContext:
                        runAsUser: 1001
                        runAsNonRoot: true
                        capabilities:
                          drop: ["ALL"]
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: 8966
                        initialDelaySeconds: 30
                        periodSeconds: 20
                      readinessProbe:
                        httpGet:
                          path: /health
                          port: 8966
                        initialDelaySeconds: 10
                        periodSeconds: 10

          - apiVersion: v1
            kind: Service
            metadata:
              name: amazon-backend
              namespace: amazon-clone
            spec:
              selector:
                app: amazon-backend
              ports:
                - port: 8966
                  targetPort: 8966
              type: ClusterIP

          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: amazon-frontend
              namespace: amazon-clone
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: amazon-frontend
              template:
                metadata:
                  labels:
                    app: amazon-frontend
                spec:
                  imagePullSecrets:
                    - name: docker-registry-secret
                  containers:
                    - name: amazon-frontend
                      image: registry.thekor.eu/docker/amazon/front:latest
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 8965
                      env:
                        - name: REACT_APP_BACKEND_URL
                          value: "https://retroapi.thekor.eu"
                        - name: PORT
                          value: "8965"
                      securityContext:
                        runAsUser: 1001
                        runAsNonRoot: true
                        capabilities:
                          drop: ["ALL"]
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 8965
                        initialDelaySeconds: 600
                        periodSeconds: 20
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 8965
                        initialDelaySeconds: 30
                        periodSeconds: 10

          - apiVersion: v1
            kind: Service
            metadata:
              name: amazon-frontend
              namespace: amazon-clone
            spec:
              selector:
                app: amazon-frontend
              ports:
                - port: 8965
                  targetPort: 8965
              type: ClusterIP

          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: amazon-backend-ingress
              namespace: amazon-clone
              annotations:
                haproxy.org/check: "disabled"
                haproxy.org/backend-config-snippet: |
                  no option httpchk
            spec:
              ingressClassName: haproxy
              tls:
                - hosts:
                    - retroapi.thekor.eu
                  secretName: wildcard-thekor
              rules:
                - host: retroapi.thekor.eu
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: amazon-backend
                            port:
                              number: 8966

          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: amazon-frontend-ingress
              namespace: amazon-clone
              annotations:
                haproxy.org/check: "disabled"
                haproxy.org/backend-config-snippet: |
                  no option httpchk
            spec:
              ingressClassName: haproxy
              tls:
                - hosts:
                    - retro.thekor.eu
                  secretName: wildcard-thekor
              rules:
                - host: retro.thekor.eu
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: amazon-frontend
                            port:
                              number: 8965
    - name: Wait for amazon-backend to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: amazon-backend
        namespace: amazon-clone
      register: deploy_info
      until:
        - deploy_info.resources | length > 0
        - deploy_info.resources[0].status.readyReplicas is defined
        - deploy_info.resources[0].status.readyReplicas == deploy_info.resources[0].status.replicas
      retries: 40   # e.g. wait up to 200s total
      delay: 5