---
- name: Setup VolSync ReplicationSource for postgres PVC
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - group_vars/all/vault.yml
  vars:
    vault_kv_path: "restic"
    backup_databases:
      - name: grafana
        namespace: monitoring
        pvc_name: grafana-pg-1

      - name: netbox
        namespace: netbox
        pvc_name: netbox-pg-1

      - name: harbor
        namespace: harbor
        pvc_name: harbor-pg-1     

      - name: patchmon
        namespace: patchmon
        pvc_name: patchmon-pg-1 

  tasks:

    # loop goes on include_tasks — blocks cannot loop directly
    - name: Backup database {{ db.name }}
      ansible.builtin.include_tasks: tasks/49-backup-task.yaml
      loop: "{{ backup_databases }}"
      loop_control:
        loop_var: db
        label: "{{ db.name }}"


