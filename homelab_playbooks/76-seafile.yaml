---
- name: Deploy Seafile
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seafile_namespace: "seafile"
    seafile_release_name: "seafile"
    seafile_chart_version: "12.0"

    # true on the first run, set to false after the first successful init
    seafile_first_init: true

    secretstore_name: "vault-backend"
    secretstore_kind: "ClusterSecretStore"
    refresh_interval: "1h"

    # Vault KV path "seafile" needs: db_password, db_root_password, admin_email, admin_password
    vault_kv_path: "seafile"

    seafile_admin_secret_name: "seafile-admin-credentials"

    # --- Dedicated MariaDB for Seafile (MariaDB Operator) ---
    seafile_mariadb_name: "seafile-mariadb"
    seafile_mariadb_root_secret: "seafile-db-root"
    seafile_mariadb_storage_size: "5Gi"
    seafile_mariadb_host: "{{ seafile_mariadb_name }}.{{ seafile_namespace }}.svc.cluster.local"
    seafile_db_user: "seafile"

    # --- Rook Ceph Storage wiring ---
    rook_ceph_storage_class_name: "rook-ceph-block"
    storage_size: "50Gi"

    seafile_hostname: "seafile.thekor.eu"
    ingress_class_name: "haproxy"

  tasks:

    - name: Confirm the existing vault-backend ClusterSecretStore is Ready
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: "{{ secretstore_name }}"
      register: cluster_secretstore_check
      failed_when: >
        cluster_secretstore_check.resources | length == 0 or
        (cluster_secretstore_check.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'Ready') |
         selectattr('status', 'equalto', 'True') | list | length == 0)

    # Root password of the dedicated MariaDB. The key is named DB_ROOT_PASSWD because
    # the Seafile image reads that variable, and the same key is used by the MariaDB CR.
    - name: Create ExternalSecret for the Seafile MariaDB root password
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ seafile_mariadb_root_secret }}"
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: "{{ seafile_mariadb_root_secret }}"
              creationPolicy: Owner
            data:
              - secretKey: DB_ROOT_PASSWD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: db_root_password

    - name: Wait for the MariaDB root secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ seafile_namespace }}"
        name: "{{ seafile_mariadb_root_secret }}"
      register: seafile_mariadb_root
      until: >
        seafile_mariadb_root.resources | length > 0 and
        'DB_ROOT_PASSWD' in seafile_mariadb_root.resources[0].data
      retries: 30
      delay: 10
      no_log: true

    - name: Create dedicated MariaDB instance for Seafile
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: MariaDB
          metadata:
            name: "{{ seafile_mariadb_name }}"
            namespace: "{{ seafile_namespace }}"
          spec:
            rootPasswordSecretKeyRef:
              name: "{{ seafile_mariadb_root_secret }}"
              key: DB_ROOT_PASSWD
              generate: false
            storage:
              size: "{{ seafile_mariadb_storage_size }}"
              storageClassName: "{{ rook_ceph_storage_class_name }}"

    - name: Wait for the Seafile MariaDB to be Ready
      kubernetes.core.k8s_info:
        api_version: k8s.mariadb.com/v1alpha1
        kind: MariaDB
        name: "{{ seafile_mariadb_name }}"
        namespace: "{{ seafile_namespace }}"
      register: seafile_mariadb
      until: >
        seafile_mariadb.resources | length > 0 and
        (seafile_mariadb.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'Ready') |
         selectattr('status', 'equalto', 'True') | list | length > 0)
      retries: 60
      delay: 10

    - name: Create Seafile application credentials ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: seafile-secret
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: seafile-secret
              creationPolicy: Owner
              template:
                type: Opaque
            data:
              - secretKey: SEAFILE_MYSQL_DB_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: db_password
              - secretKey: INIT_SEAFILE_ADMIN_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_password
              - secretKey: JWT_PRIVATE_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: JWT_PRIVATE_KEY

    - name: Create ExternalSecret for Seafile admin credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ seafile_admin_secret_name }}"
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: "{{ seafile_admin_secret_name }}"
              creationPolicy: Owner
              template:
                type: Opaque
                data:
                  email: "{{ '{{ .email }}' }}"
                  password: "{{ '{{ .password }}' }}"
            data:
              - secretKey: email
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_email
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_password

    - name: Wait for Seafile admin credentials from ExternalSecret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ seafile_namespace }}"
        name: "{{ seafile_admin_secret_name }}"
      register: seafile_admin_secret
      until: >
        seafile_admin_secret.resources | length > 0 and
        'email' in seafile_admin_secret.resources[0].data
      retries: 30
      delay: 10
      no_log: true

    - name: Add and update the Seafile helm repo via command
      ansible.builtin.shell: |
        helm repo add seafile https://haiwen.github.io/seafile-helm-chart/repo
        helm repo update seafile
      changed_when: true

    # The chart renders extraEnv inside envFrom, so entries are secretRef items.
    # The root secret is only needed on the first start, before seafile.conf exists.
    - name: Build extraEnv (root password for first init only)
      ansible.builtin.set_fact:
        seafile_extra_env: >-
          {{ [{'secretRef': {'name': seafile_mariadb_root_secret}}] if (seafile_first_init | bool) else [] }}

    - name: Create values file for Seafile deployment matching native chart keys
      ansible.builtin.copy:
        dest: "/tmp/seafile-values.yaml"
        mode: "0600"
        content: |
          seafile:
            initMode: {{ 'true' if (seafile_first_init | bool) else 'false' }}
            existingSecret:
              name: seafile-secret

            configs:
              seafileDataVolume:
                storage: 10Gi
                storageClassName: "{{ rook_ceph_storage_class_name }}"

            env:
              TIME_ZONE: "UTC"
              SEAFILE_LOG_TO_STDOUT: "true"
              SITE_ROOT: "/"
              SEAFILE_SERVER_HOSTNAME: "{{ seafile_hostname }}"
              SITE_BASE: "https://{{ seafile_hostname }}"
              SEAFILE_SERVER_PROTOCOL: "https"

              DB_HOST: "{{ seafile_mariadb_host }}"
              DB_PORT: "3306"
              DB_USER: "{{ seafile_db_user }}"
              SEAFILE_MYSQL_DB_CCNET_DB_NAME: "ccnet_db"
              SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: "seafile_db"
              SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: "seahub_db"

              INIT_SEAFILE_ADMIN_EMAIL: "{{ seafile_admin_secret.resources[0].data.email | b64decode }}"

            extraEnv: {{ seafile_extra_env | to_json }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"

          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          ingress:
            enabled: true
            className: "{{ ingress_class_name }}"
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
            hosts:
              - host: "{{ seafile_hostname }}"
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: seafile-tls
                hosts:
                  - "{{ seafile_hostname }}"
      no_log: true

    - name: Deploy Seafile via native Helm command
      ansible.builtin.command: >
        helm upgrade --install "{{ seafile_release_name }}" seafile/ce
        --version "{{ seafile_chart_version }}"
        --namespace "{{ seafile_namespace }}"
        --values /tmp/seafile-values.yaml
        --wait
        --timeout 10m
      changed_when: true

    - name: Show Seafile access info
      ansible.builtin.debug:
        msg: >-
          Seafile deployed at https://{{ seafile_hostname }}/ using its own MariaDB
          '{{ seafile_mariadb_name }}' in namespace '{{ seafile_namespace }}'.
          {{ 'initMode is ON: after the site is up, set seafile_first_init to false and run again.' if (seafile_first_init | bool) else 'initMode is OFF.' }}