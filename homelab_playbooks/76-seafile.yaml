---
- name: Deploy Seafile
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seafile_namespace: "seafile"
    seafile_release_name: "seafile"
    seafile_chart_version: "12.0"

    secretstore_name: "vault-backend"
    secretstore_kind: "ClusterSecretStore"
    refresh_interval: "1h"

    vault_kv_path: "seafile"

    seafile_admin_secret_name: "seafile-admin-credentials"
    mariadb_credentials_secret: "seafile-db-credentials"

    # --- MariaDB Operator wiring ---
    mariadb_instance_name: "mariadb"
    mariadb_namespace: "mariadb"
    mariadb_user: "seafile"

    # --- Rook Ceph Storage wiring ---
    rook_ceph_storage_class_name: "rook-ceph-block"
    storage_size: "50Gi"

    seafile_hostname: "seafile.thekor.eu"
    ingress_class_name: "haproxy"

  tasks:

    - name: Confirm the existing vault-backend ClusterSecretStore is Ready
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: "{{ secretstore_name }}"
      register: cluster_secretstore_check
      failed_when: >
        cluster_secretstore_check.resources | length == 0 or
        (cluster_secretstore_check.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'Ready') |
         selectattr('status', 'equalto', 'True') | list | length == 0)

    # Create database credentials in Seafile namespace
    - name: Create ExternalSecret for Seafile database credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ mariadb_credentials_secret }}"
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: "{{ mariadb_credentials_secret }}"
              creationPolicy: Owner
            data:
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: db_password

    # Replicate credentials into MariaDB namespace
    - name: Annotate Seafile database credentials for replication
      kubernetes.core.k8s:
        state: patched
        kind: Secret
        namespace: "{{ seafile_namespace }}"
        name: "{{ mariadb_credentials_secret }}"
        definition:
          metadata:
            annotations:
              replicator.v1.mittwald.de/replicate-to: "{{ mariadb_namespace }}"

    - name: Wait for replicated MariaDB credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ mariadb_namespace }}"
        name: "{{ mariadb_credentials_secret }}"
      register: mariadb_credentials
      until: >
        mariadb_credentials.resources | length > 0 and
        'password' in mariadb_credentials.resources[0].data
      retries: 30
      delay: 10
      no_log: true

    # Create the 3 required MariaDB Databases (Kubernetes-compliant metadata names, mysql database names with underscores)
    - name: Create MariaDB Databases for Seafile
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: "{{ item.k8s_name }}"
            namespace: "{{ mariadb_namespace }}"
          spec:
            name: "{{ item.db_name }}"
            mariaDbRef:
              kind: MariaDB
              name: "{{ mariadb_instance_name }}"
              namespace: "{{ mariadb_namespace }}"
              waitForIt: true
            characterSet: utf8
            collate: utf8_general_ci
      loop:
        - { k8s_name: "ccnet-db", db_name: "ccnet_db" }
        - { k8s_name: "seafile-db", db_name: "seafile_db" }
        - { k8s_name: "seahub-db", db_name: "seahub_db" }

    # Create database user
    - name: Create MariaDB User for Seafile
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: "{{ mariadb_user }}"
            namespace: "{{ mariadb_namespace }}"
          spec:
            mariaDbRef:
              name: "{{ mariadb_instance_name }}"
              namespace: "{{ mariadb_namespace }}"
            passwordSecretKeyRef:
              name: "{{ mariadb_credentials_secret }}"
              key: password
            maxUserConnections: 20

    # Create database connections for each database
    - name: Create MariaDB Connections for Seafile
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          metadata:
            name: "{{ item.k8s_name }}-connection"
            namespace: "{{ mariadb_namespace }}"
          spec:
            username: "{{ mariadb_user }}"
            database: "{{ item.db_name }}"
            mariaDbRef:
              name: "{{ mariadb_instance_name }}"
              namespace: "{{ mariadb_namespace }}"
              waitForIt: true
            passwordSecretKeyRef:
              name: "{{ mariadb_credentials_secret }}"
              key: password
      loop:
        - { k8s_name: "ccnet-db", db_name: "ccnet_db" }
        - { k8s_name: "seafile-db", db_name: "seafile_db" }
        - { k8s_name: "seahub-db", db_name: "seahub_db" }

    # Grant privileges for all three databases
    - name: Create MariaDB Grants for Seafile Databases
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: "{{ item.k8s_name }}-grant"
            namespace: "{{ mariadb_namespace }}"
          spec:
            mariaDbRef:
              name: "{{ mariadb_instance_name }}"
              namespace: "{{ mariadb_namespace }}"
            username: "{{ mariadb_user }}"
            database: "{{ item.db_name }}"
            table: "*"
            privileges:
              - ALL
            grantOption: false
      loop:
        - { k8s_name: "ccnet-db", db_name: "ccnet_db" }
        - { k8s_name: "seafile-db", db_name: "seafile_db" }
        - { k8s_name: "seahub-db", db_name: "seahub_db" }

    - name: Create Seafile application credentials ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: seafile-secret
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: seafile-secret
              creationPolicy: Owner
              template:
                type: Opaque
            data:
              - secretKey: SEAFILE_MYSQL_DB_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: db_password
              - secretKey: INIT_SEAFILE_ADMIN_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_password

    - name: Create ExternalSecret for Seafile admin credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ seafile_admin_secret_name }}"
            namespace: "{{ seafile_namespace }}"
          spec:
            refreshInterval: "{{ refresh_interval }}"
            secretStoreRef:
              name: "{{ secretstore_name }}"
              kind: "{{ secretstore_kind }}"
            target:
              name: "{{ seafile_admin_secret_name }}"
              creationPolicy: Owner
              template:
                type: Opaque
                data:
                  email: "{{ '{{ .email }}' }}"
                  password: "{{ '{{ .password }}' }}"
            data:
              - secretKey: email
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_email
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: admin_password

    - name: Wait for Seafile admin credentials from ExternalSecret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ seafile_namespace }}"
        name: "{{ seafile_admin_secret_name }}"
      register: seafile_admin_secret
      until: >
        seafile_admin_secret.resources | length > 0 and
        'email' in seafile_admin_secret.resources[0].data
      retries: 30
      delay: 10
      no_log: true

    - name: Add and update the Seafile helm repo via command
      ansible.builtin.shell: |
        helm repo add seafile https://haiwen.github.io/seafile-helm-chart/repo
        helm repo update seafile
      changed_when: true

    - name: Create values file for Seafile deployment matching native chart keys
      ansible.builtin.copy:
        dest: "/tmp/seafile-values.yaml"
        content: |
          seafile:
            initMode: true
            existingSecret:
              name: seafile-secret

            configs:
              seafileDataVolume:
                storage: 10Gi
                storageClassName: "{{ rook_ceph_storage_class_name }}"

            env:
              TIME_ZONE: "UTC"
              SEAFILE_LOG_TO_STDOUT: "true"
              SITE_ROOT: "/"
              SEAFILE_SERVER_HOSTNAME: "{{ seafile_hostname }}"
              SITE_BASE: "https://{{ seafile_hostname }}"
              SEAFILE_SERVER_PROTOCOL: "https"
              
              DB_HOST: "{{ mariadb_instance_name }}.{{ mariadb_namespace }}.svc.cluster.local"
              DB_PORT: "3306"
              DB_USER: "{{ mariadb_user }}"
              CCNET_DB: "ccnet_db"
              SEAFILE_DB: "seafile_db"
              SEAHUB_DB: "seahub_db"

              INIT_SEAFILE_ADMIN_EMAIL: "{{ seafile_admin_secret.resources[0].data.email | b64decode }}"

            # Explicitly map both password environment variables from the secret
            secretsMap:
              DB_PASSWORD:
                secret: seafile-secret
                key: SEAFILE_MYSQL_DB_PASSWORD
              SEAFILE_MYSQL_DB_PASSWORD:
                secret: seafile-secret
                key: SEAFILE_MYSQL_DB_PASSWORD
              INIT_SEAFILE_ADMIN_PASSWORD:
                secret: seafile-secret
                key: INIT_SEAFILE_ADMIN_PASSWORD

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"

          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          ingress:
            enabled: true
            className: "{{ ingress_class_name }}"
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
            hosts:
              - host: "{{ seafile_hostname }}"
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: seafile-tls
                hosts:
                  - "{{ seafile_hostname }}"

    - name: Deploy Seafile via native Helm command
      ansible.builtin.command: >
        helm upgrade --install "{{ seafile_release_name }}" seafile/ce
        --version "{{ seafile_chart_version }}"
        --namespace "{{ seafile_namespace }}"
        --values /tmp/seafile-values.yaml
        --wait
      changed_when: true

    - name: Show Seafile access info
      ansible.builtin.debug:
        msg: >-
          Seafile successfully deployed. Reach it securely at https://{{ seafile_hostname }}/.
          Databases (ccnet_db, seafile_db, seahub_db) are backed by MariaDB Operator instance '{{ mariadb_instance_name }}' 
          and block storage is provisioned via Rook Ceph storage class '{{ rook_ceph_storage_class_name }}'.
          Secrets are synchronized via Vault ClusterSecretStore '{{ secretstore_name }}'.