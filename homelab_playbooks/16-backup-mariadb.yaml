---
- name: Provision mariadb backup CronJob
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  vars:
    kubeconfig_path: ~/.kube/config

  tasks:
    - name: Create AWS credentials secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-credentials
            namespace: mariadb
          type: Opaque
          stringData:
            AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID }}"
            AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY }}"

    - name: Deploy mariadb CronJob
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: maria-sql-backup-template
            namespace: mariadb
          spec:
            schedule: "0 0 31 2 *"  # Never runs automatically
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 3
            jobTemplate:
              spec:
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    imagePullSecrets:
                    - name: docker-registry-secret
                    nodeSelector:
                      kubernetes.io/hostname: coreos-cp-1
                    containers:
                      - name: tools
                        image: registry.thekor.eu/docker/k8s-fedora-backup/mariadb-tools:latest
                        command: ["/home/appuser/sql_generated.sh", "uptimekuma", "vaultwarden", "sftp-go", "technitium"]
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: aws-credentials
                                key: AWS_ACCESS_KEY_ID
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: aws-credentials
                                key: AWS_SECRET_ACCESS_KEY
                          - name: MARIADB_HOST
                            value: mariadb.mariadb.svc.cluster.local
                          - name: MARIADB_BACKUP_USER
                            value: "{{ backup_secret.DB_USERNAME }}"
                          - name: MARIADB_BACKUP_PASS
                            value: "{{ backup_secret.DB_PASSWORD }}"
                        volumeMounts:
                          - name: backupoutput
                            mountPath: /home/appuser
                        livenessProbe:
                          exec:
                            command: ["true"]
                          initialDelaySeconds: 5
                          periodSeconds: 30
                        readinessProbe:
                          exec:
                            command: ["true"]
                          initialDelaySeconds: 5
                          periodSeconds: 30
                    volumes:
                      - name: backupoutput
                        hostPath:
                          path: /mnt/backupoutput
                          type: DirectoryOrCreate
