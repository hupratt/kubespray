    #               - port: 53
    #                 protocol: UDP
    #               - port: 53
    #                 protocol: TCP

    # ════════════════════════════════════════════════════════════════════════
    # 11. WAIT & VERIFY
    # ════════════════════════════════════════════════════════════════════════
    - name: Wait for Deployment rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ bridge_name }}"
        namespace: "{{ bridge_namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
      register: deploy_info

    - name: Show bridge pod status
      debug:
        msg: >-
          Bridge deployment is Available.
          Next step: mount the '{{ bridge_name }}-registration' ConfigMap
          into your Synapse pod as /data/appservices/whatsapp-registration.yaml
          and add it to homeserver.yaml under 'app_service_config_files'.
