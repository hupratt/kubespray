    #           haproxy.org/check: "true"
    #           haproxy.org/forwarded-for: "true"
    #           haproxy.org/backend-config-snippet: |
    #             timeout connect 5s
    #             timeout server 60s
    #       spec:
    #         ingressClassName: haproxy
    #         tls:
    #           - hosts:
    #               - "{{ ingress_host }}"
    #             secretName: "{{ ingress_tls_secret }}"
    #         rules:
    #           - host: "{{ ingress_host }}"
    #             http:
    #               paths:
    #                 - path: /
    #                   pathType: Prefix
    #                   backend:
    #                     service:
    #                       name: "{{ bridge_name }}"
    #                       port:
    #                         name: http

    # ════════════════════════════════════════════════════════════════════════
    # 10. NETWORK POLICY
    # ════════════════════════════════════════════════════════════════════════
    # - name: Create NetworkPolicy for bridge
    #   kubernetes.core.k8s:
    #     state: present
    #     definition:
    #       apiVersion: networking.k8s.io/v1
    #       kind: NetworkPolicy
    #       metadata:
    #         name: "{{ bridge_name }}"
    #         namespace: "{{ bridge_namespace }}"
    #         labels: "{{ kyverno_required_labels }}"
    #       spec:
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: "{{ bridge_name }}"
    #         policyTypes: [Ingress, Egress]
    #         ingress:
    #           # Allow traffic from HAProxy ingress controller only
    #           - from:
    #               - namespaceSelector:
    #                   matchLabels:
    #                     kubernetes.io/metadata.name: haproxy-controller   # adjust NS
    #                 podSelector:
    #                   matchLabels:
    #                     app.kubernetes.io/name: kubernetes-ingress         # adjust label
    #             ports:
    #               - port: "{{ bridge_port }}"
    #           # Allow Synapse → bridge (push transactions)
