---
- name: Provision Postgres backup CronJob
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  vars:
    kubeconfig_path: ~/.kube/config
    vault_kv_path: restic

  tasks:
    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: aws-credentials
            namespace: immich
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: aws-credentials
              creationPolicy: Owner
            data:
              - secretKey: AWS_ACCESS_KEY_ID
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: AWS_ACCESS_KEY_ID
              - secretKey: AWS_SECRET_ACCESS_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: AWS_SECRET_ACCESS_KEY

    - name: Deploy pgdump CronJob
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: pgdump-backup
            namespace: immich
          spec:
            schedule: "0 0 31 2 *"
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 3
            jobTemplate:
              spec:
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsUser: 70
                      runAsGroup: 70
                      runAsNonRoot: true
                    imagePullSecrets:
                      - name: docker-registry-secret
                    nodeSelector:
                      kubernetes.io/hostname: coreos-cp-1
                    containers:
                      - name: pgdump
                        image: registry.thekor.eu/docker/k8s-fedora-backup/postgres-backup:17-alpine-awscli
                        command:
                          - /bin/bash
                          - -c
                          - /home/postgres/backupoutput/sql_postgres.sh
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: aws-credentials
                                key: AWS_ACCESS_KEY_ID
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: aws-credentials
                                key: AWS_SECRET_ACCESS_KEY
                          - name: PGHOST
                            value: "{{ POSTGRES_IMMICH_HOST }}"
                          - name: PGUSER
                            value: "{{ POSTGRES_BACKUP_USER }}"
                          - name: PGPASSWORD
                            value: "{{ POSTGRES_BACKUP_PASSWORD }}"
                          - name: PG_TARGETS
                            value: "immich"
                        volumeMounts:
                          - name: backupoutput
                            mountPath: /home/postgres/backupoutput
                        livenessProbe:
                          exec:
                            command: ["true"]
                          initialDelaySeconds: 5
                          periodSeconds: 30
                        readinessProbe:
                          exec:
                            command: ["true"]
                          initialDelaySeconds: 5
                          periodSeconds: 30
                    volumes:
                      - name: backupoutput
                        hostPath:
                          path: /mnt/backupoutput
                          type: DirectoryOrCreate
