---
- name: Deploy www
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    namespace: www-portfolio
    backend_image: registry.thekor.eu/docker/www/portfolio-backend:latest
    frontend_image: registry.thekor.eu/docker/www/portfolio-frontend:latest
    backend_port: 9915
    frontend_port: 80
    vault_kv_path: www

  tasks:

    - name: Deploy ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: portfolio-vault-secrets
            namespace: "{{ namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: portfolio-vault-secrets
              creationPolicy: Owner
            data:
              - secretKey: DJANGO_ALLOWED_HOSTS
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_ALLOWED_HOSTS
              - secretKey: DJANGO_DEBUG
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_DEBUG
              - secretKey: DJANGO_DEVELOPMENT
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_DEVELOPMENT
              - secretKey: DJANGO_SECRET_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DJANGO_SECRET_KEY
              - secretKey: REACT_APP_BASE
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: REACT_APP_BASE
              - secretKey: SECRET_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: SECRET_KEY
              - secretKey: SENDGRID_API_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: SENDGRID_API_KEY
              - secretKey: SENTRY_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: SENTRY_KEY
              - secretKey: dbpassword
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: dbpassword
              - secretKey: dbuser
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: dbuser
              - secretKey: enginedb
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: enginedb
              - secretKey: hostip
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: hostip
              - secretKey: pnumber
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: pnumber

    - name: Create env secret from vault
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ namespace }}"
        name: portfolio-vault-secrets
      register: vault_secret

    # - name: Debug vault_secret
    #   debug:
    #     var: vault_secret

    # - name: Pause for 6 seconds
    #   ansible.builtin.pause:
    #     seconds: 6
    # -------------------------------------------------------------------------
    # BACKEND DEPLOYMENT (Django)
    # -------------------------------------------------------------------------
    - name: Deploy backend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: portfolio-backend
            namespace: "{{ namespace }}"
            labels:
              app: portfolio-backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: portfolio-backend
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
            template:
              metadata:
                labels:
                  app: portfolio-backend
              spec:
                imagePullSecrets:
                  - name: docker-registry-secret
                initContainers:
                  # Run migrations before the main container starts
                  - name: migrate
                    image: "{{ backend_image }}"
                    imagePullPolicy: Always
                    command:
                      - sh
                      - -c
                      - |
                        python manage.py makemigrations &&
                        python manage.py migrate
                    envFrom:
                      - secretRef:
                          name: portfolio-vault-secrets
                    # volumeMounts:
                    #   - name: app-static
                    #     mountPath: /app/static
                    #   - name: app-media
                    #     mountPath: /app/media
                containers:
                  - name: backend
                    image: "{{ backend_image }}"
                    imagePullPolicy: Always
                    # Switch to gunicorn for production (uncomment below and
                    # remove the runserver command):
                    # command: ["gunicorn", "Portfolio.wsgi:application",
                    #           "-w", "2", "--bind", "0.0.0.0:9915"]
                    command:
                      - sh
                      - -c
                      - python manage.py runserver 0.0.0.0:9915
                    ports:
                      - containerPort: "{{ backend_port }}"
                    envFrom:
                      - secretRef:
                          name: portfolio-vault-secrets
                    # volumeMounts:
                    #   - name: app-static
                    #     mountPath: /app/static
                    #   - name: app-media
                    #     mountPath: /app/media
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 512Mi
                    livenessProbe:
                      httpGet:
                        path: /
                        port: "{{ backend_port }}"
                      initialDelaySeconds: 30
                      periodSeconds: 15
                    readinessProbe:
                      httpGet:
                        path: /
                        port: "{{ backend_port }}"
                      initialDelaySeconds: 10
                      periodSeconds: 5
                # volumes:
                #   - name: app-static
                #     persistentVolumeClaim:
                #       claimName: portfolio-static
                #   - name: app-media
                #     persistentVolumeClaim:
                #       claimName: portfolio-media

    # -------------------------------------------------------------------------
    # BACKEND SERVICE
    # -------------------------------------------------------------------------
    - name: Create backend service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: portfolio-backend
            namespace: "{{ namespace }}"
          spec:
            selector:
              app: portfolio-backend
            ports:
              - name: http
                port: "{{ backend_port }}"
                targetPort: "{{ backend_port }}"
            type: ClusterIP

    - name: Create ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: portfolio-ingress
            namespace: "{{ namespace }}"
            annotations:
              haproxy.org/check: "disabled"
              haproxy.org/backend-config-snippet: |
                no option httpchk
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - portfolio.thekor.eu
                secretName: wildcard-thekor
            rules:
              - host: portfolio.thekor.eu
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: portfolio-backend
                          port:
                            number: "{{ backend_port }}"
              - host: www.thekor.eu
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: portfolio-backend
                          port:
                            number: "{{ backend_port }}"
