- name: Deploy CloudNativePG Operator and Clusters
  hosts: localhost
  gather_facts: false
  vars:
    cnpg_namespace: cn-postgres
    cnpg_version: "0.23.0"
    storage_class: rook-ceph-block
    pg_image: ghcr.io/cloudnative-pg/postgresql:16
    homelab_domain: "thekor.eu"
    vault_addr: "https://vault.{{ homelab_domain }}"
    vault_init_json: "group_vars/all/vault_init.json"

    shared_cluster_name: shared-pg
    shared_cluster_storage: 50Gi

    databases:
      - name: grafana
        owner: grafana
        vault_path: monitoring

      - name: linkwarden
        owner: linkwarden
        vault_path: linkwarden

      - name: netbox
        owner: netbox
        vault_path: netbox

      - name: authentik
        owner: authentik
        vault_path: authentik

      - name: makita
        owner: ubuntu
        vault_path: makita

      - name: paperless
        owner: paperless
        vault_path: paperless

      - name: booking
        owner: ubuntu
        vault_path: booking

      - name: patchmon
        owner: patchmon
        vault_path: patchmon

    # Harbor kept separate: multiple DBs, distinct ownership
    harbor_cluster_name: harbor-pg
    harbor_cluster_storage: 10Gi
    harbor_databases:
      - name: harbor_core
        owner: harbor
        vault_path: harbor
      - name: harbor_notary_server
        owner: harbor
        vault_path: harbor
      - name: harbor_notary_signer
        owner: harbor
        vault_path: harbor
      - name: harbor_trivy
        owner: harbor
        vault_path: harbor

  tasks:
    - name: Deploy CNPG operator via Helm
      kubernetes.core.helm:
        name: cloudnative-pg
        chart_ref: cloudnative-pg
        chart_repo_url: https://cloudnative-pg.github.io/charts
        chart_version: "{{ cnpg_version }}"
        release_namespace: "{{ cnpg_namespace }}"
        create_namespace: true
        wait: true
        values:
          monitoring:
            podMonitorEnabled: true

    # --- Shared cluster secrets ---

    - name: Create ExternalSecret for shared cluster superuser
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ shared_cluster_name }}-superuser-vault-secret"
            namespace: "{{ cnpg_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: "{{ shared_cluster_name }}-superuser-vault-secret"
              creationPolicy: Owner
              template:
                type: kubernetes.io/basic-auth
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ cnpg_namespace }}"
                  property: superuser_username
              - secretKey: password
                remoteRef:
                  key: "{{ cnpg_namespace }}"
                  property: superuser_password

    - name: Create ExternalSecret for backup user (shared cluster)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: cnpg-backup-user
            namespace: "{{ cnpg_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: cnpg-backup-user
              creationPolicy: Owner
            data:
              - secretKey: setup.sql
                remoteRef:
                  key: "{{ cnpg_namespace }}"
                  property: setup.sql

    # --- Per-app secrets (still in cn-postgres namespace, apps reference via cross-ns or you adjust) ---

    - name: Create ExternalSecrets for app database credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ item.name }}-pg-secret"
            namespace: "{{ cnpg_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: "{{ item.name }}-pg-secret"
              creationPolicy: Owner
              template:
                type: kubernetes.io/basic-auth
            data:
              - secretKey: username
                remoteRef:
                  key: "{{ item.vault_path }}"
                  property: pg_username
              - secretKey: password
                remoteRef:
                  key: "{{ item.vault_path }}"
                  property: pg_password
      loop: "{{ databases }}"

    - name: Wait for app ExternalSecrets to sync
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ExternalSecret
        name: "{{ item.name }}-pg-secret"
        namespace: "{{ cnpg_namespace }}"
      register: es_status

      until: >
        (
          es_status.resources | default([])
        ) | length > 0
        and
        (
          es_status.resources[0].status.conditions | default([])
          | selectattr('type', 'eq', 'Ready')
          | selectattr('status', 'eq', 'True')
          | list
          | length
        ) > 0

      retries: 12
      delay: 10
      loop: "{{ databases }}"
    # --- Shared CNPG Cluster ---

    - name: Deploy shared CNPG Cluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: "{{ shared_cluster_name }}"
            namespace: "{{ cnpg_namespace }}"
            annotations:
              helm.sh/resource-policy: keep

          spec:
            instances: 1
            imageName: "{{ pg_image }}"

            enableSuperuserAccess: true

            superuserSecret:
              name: "{{ shared_cluster_name }}-superuser-vault-secret"

            managed:
              roles: >-
                {{ databases
                  | map(attribute='owner')
                  | unique
                  | list
                  | map('community.general.dict_kv', 'name')
                  | map('combine', {
                        'ensure': 'present',
                        'login': true,
                        'passwordSecret': {'name': ''} })
                  | list
                }}

            bootstrap:
              initdb:
                database: postgres
                owner: postgres
                postInitSQLRefs:
                  secretRefs:
                    - name: cnpg-backup-user
                      key: setup.sql

            storage:
              size: "{{ shared_cluster_storage }}"
              storageClass: "{{ storage_class }}"

            monitoring:
              enablePodMonitor: true

    - name: Wait for shared cluster to be ready
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: "{{ shared_cluster_name }}"
        namespace: "{{ cnpg_namespace }}"
      register: cluster_status
      until: >
        cluster_status.resources[0].status.conditions |
        selectattr('type', 'eq', 'Ready') |
        selectattr('status', 'eq', 'True') | list | length > 0
      retries: 24
      delay: 10

    # --- Database CRDs ---

    - name: Deploy Database CRDs for shared cluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Database
          metadata:
            name: "{{ item.name }}-db"
            namespace: "{{ cnpg_namespace }}"
          spec:
            name: "{{ item.name }}"
            owner: "{{ item.owner }}"
            cluster:
              name: "{{ shared_cluster_name }}"
      loop: "{{ databases }}"

