---

- name: Create ingress controller 
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: /home/hugo/.kube/config
  tasks:
    - name: Deploy HAProxy Ingress controller with a Daemonset
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: haproxy-ingress-config
              namespace: haproxy
            data:
              syslog-server: "address:stdout, format: raw, facility: daemon"
              ssl-redirect: "false"
              max-connections: "2000"
              ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
              backend-check-status: "200,401"
              use-forwarded-for: "true"
              healthz-port: "1042"
              disable-backend-checks: "false"
              hard-stop-after: "600s"

          - apiVersion: networking.k8s.io/v1
            kind: IngressClass
            metadata:
              name: haproxy
            spec:
              controller: haproxy.org/ingress-controller

          - apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: haproxy-ingress
              namespace: haproxy
            spec:
              selector:
                matchLabels:
                  app: haproxy-ingress
              template:
                metadata:
                  labels:
                    app: haproxy-ingress
                spec:
                  hostNetwork: true
                  serviceAccountName: haproxy-ingress
                  securityContext:
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: haproxy-ingress
                      image: haproxytech/kubernetes-ingress:3.0.6
                      args:
                        - --configmap=haproxy/haproxy-ingress-config
                        - --http-port=8080
                        - --https-port=8443
                        - --default-backend-service=haproxy/nginx-service
                        - --maps-dir=/etc/haproxy/maps
                      ports:
                        - name: http
                          containerPort: 8080
                          hostPort: 8080
                        - name: https
                          containerPort: 8443
                          hostPort: 8443
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: ["ALL"]
                          add: ["NET_BIND_SERVICE"]
                        readOnlyRootFilesystem: false
                      readinessProbe:
                        tcpSocket:
                          port: 8080
                        initialDelaySeconds: 5
                        periodSeconds: 5
                        failureThreshold: 3
                      livenessProbe:
                        tcpSocket:
                          port: 8080
                        initialDelaySeconds: 10
                        periodSeconds: 10
                        failureThreshold: 3
                      volumeMounts:
                        - name: maps-dir
                          mountPath: /etc/haproxy/maps
                      env:
                        - name: POD_NAME
                          valueFrom:
                            fieldRef:
                              fieldPath: metadata.name
                        - name: POD_NAMESPACE
                          valueFrom:
                            fieldRef:
                              fieldPath: metadata.namespace
                  volumes:
                    - name: maps-dir
                      emptyDir: {}

          - apiVersion: v1
            kind: Service
            metadata:
              name: haproxy-ingress
              namespace: haproxy
            spec:
              type: LoadBalancer
              allocateLoadBalancerNodePorts: false
              selector:
                app: haproxy-ingress
              ports:
                - name: http
                  port: 8080
                  targetPort: 8080
                - name: https
                  port: 8443
                  targetPort: 8443


    - name: Deploy HAProxy RBAC and Nginx fallback page
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: haproxy-ingress
              namespace: haproxy

          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: haproxy-ingress-clusterrole
            rules:
              - apiGroups: [""]
                resources:
                  - pods
                  - services
                  - endpoints
                  - nodes
                  - secrets
                  - configmaps
                  - namespaces
                verbs: ["get", "list", "watch"]
              - apiGroups: ["discovery.k8s.io"]
                resources:
                  - endpointslices
                verbs: ["get", "list", "watch"]
              - apiGroups: ["networking.k8s.io"]
                resources:
                  - ingresses
                  - ingressclasses
                verbs: ["get", "list", "watch"]
              - apiGroups: ["apiextensions.k8s.io"]
                resources:
                  - customresourcedefinitions
                verbs: ["get", "list", "watch"]
              - apiGroups: [""]
                resources:
                  - events
                verbs: ["create", "patch", "update"]

          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: haproxy-ingress-clusterrolebinding
            subjects:
              - kind: ServiceAccount
                name: haproxy-ingress
                namespace: haproxy
            roleRef:
              kind: ClusterRole
              name: haproxy-ingress-clusterrole
              apiGroup: rbac.authorization.k8s.io

          - apiVersion: v1
            kind: Service
            metadata:
              name: nginx-service
              namespace: haproxy
            spec:
              selector:
                app: nginx
              ports:
                - name: http
                  port: 80
                  targetPort: 8080

          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nginx
              namespace: haproxy
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: nginx
              template:
                metadata:
                  labels:
                    app: nginx
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 101
                    runAsGroup: 101
                    fsGroup: 101
                  containers:
                    - name: nginx
                      image: nginxinc/nginx-unprivileged:stable
                      ports:
                        - containerPort: 8080
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            - ALL
                      volumeMounts:
                        - name: cache
                          mountPath: /var/cache/nginx
                        - name: run
                          mountPath: /var/run
                        - name: tmp
                          mountPath: /tmp
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 8080
                        initialDelaySeconds: 10
                        periodSeconds: 15
                        failureThreshold: 3
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 8080
                        initialDelaySeconds: 5
                        periodSeconds: 10
                        failureThreshold: 3
                  volumes:
                    - name: cache
                      emptyDir: {}
                    - name: run
                      emptyDir: {}
                    - name: tmp
                      emptyDir: {}