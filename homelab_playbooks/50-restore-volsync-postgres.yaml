---

- name: PostgreSQL PVC restore via VolSync (CloudNativePG)
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config') }}"
    volsync_restore_timeout: 600
    dry_run: false

    restore_pvcs:
      - name: shared
        namespace: cn-postgres
        storage_class: rook-ceph-block
        storage_size: 5Gi
        cluster: shared-pg
        secret: restic-credentials 

      # - name: immich
      #   namespace: immich
      #   storage_class: rook-ceph-block
      #   storage_size: 2000Gi
      #   secret: volsync-restic-secret
      #   cluster: shared-pg

  tasks:

    - name: Check VolSync CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: replicationdestinations.volsync.backube
      register: _volsync_crd
      failed_when: _volsync_crd.resources | length == 0

    - name: Check CloudNativePG CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusters.postgresql.cnpg.io
      register: _cnpg_crd
      failed_when: _cnpg_crd.resources | length == 0

    # loop goes on include_tasks — blocks cannot loop directly
    - name: Restore PVCs 
      ansible.builtin.include_tasks: tasks/50-restore-task.yaml
      loop: "{{ restore_pvcs }}"
      loop_control:
        loop_var: pvc
        label: "{{ pvc.name }}"