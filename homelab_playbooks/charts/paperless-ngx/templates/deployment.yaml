apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate  # Single-replica with PVCs — avoid RWO conflicts
  template:
    metadata:
      labels:
        {{- include "paperless-ngx.selectorLabels" . | nindent 8 }}
      annotations:
        # Force rollout when secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.externalPostgres.host }} {{ .Values.externalPostgres.port }}; do
                echo "Waiting for external postgres..."
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "paperless-ngx.redisHost" . }} 6379; do
                echo "Waiting for redis..."
                sleep 2
              done
      containers:
        - name: paperless
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "paperless-ngx.fullname" . }}-secret
            - configMapRef:
                name: {{ include "paperless-ngx.fullname" . }}-config
          env:
            - name: PAPERLESS_REDIS
              value: "redis://{{ include "paperless-ngx.redisHost" . }}:6379"
            - name: PAPERLESS_DBHOST
              value: {{ .Values.externalPostgres.host | quote }}
            - name: PAPERLESS_DBPORT
              value: {{ .Values.externalPostgres.port | quote }}
            - name: PAPERLESS_DBNAME
              value: {{ .Values.externalPostgres.database | quote }}
            - name: PAPERLESS_DBUSER
              value: {{ .Values.externalPostgres.user | quote }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperless-ngx.fullname" . }}-secret
                  key: PAPERLESS_DBPASS
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: export
              mountPath: /usr/src/paperless/export
            - name: consume
              mountPath: /usr/src/paperless/consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.media.existingClaim }}
        - name: export
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.export.existingClaim }}
        - name: consume
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.consume.existingClaim }}