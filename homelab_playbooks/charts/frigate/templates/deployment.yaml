apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frigate.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      securityContext:
        privileged: false

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: frigate-config-file
          configMap:
            name: frigate-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsCacheSize | quote }}

      containers:
        - name: frigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
          env:
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rtspPassword.existingSecret }}
                  key: {{ .Values.rtspPassword.key }}

          ports:
            - name: web
              containerPort: 5000
              protocol: TCP
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: webrtc-tcp
              containerPort: 8555
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              protocol: UDP

          volumeMounts:
            - name: frigate-config-file
              mountPath: /config/config.yml
              subPath: config.yml
            - name: media
              mountPath: /media/frigate
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /tmp/cache
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  curl -sf http://localhost:5000/ > /dev/null && \
                  curl -sf http://localhost:5000/api/stats | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if any(v.get('camera_fps',0)>0 for v in d.get('cameras',{}).values()) else 1)"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
