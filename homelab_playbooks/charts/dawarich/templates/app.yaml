---
## DB migration Job – runs before app starts, idempotent
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dawarich.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dawarich.name" . }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "dawarich.dbHost" . }} 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - bundle
            - exec
            - rails
            - db:migrate
          env:
            {{- include "dawarich.commonEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "dawarich.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "dawarich.volumes" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dawarich.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.appDeployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dawarich.name" . }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dawarich.name" . }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        ## Wait for PostgreSQL
        - name: wait-for-db
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "dawarich.dbHost" . }} 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
        ## Wait for Redis
        - name: wait-for-redis
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "dawarich.fullname" . }}-redis 6379; do
                echo "waiting for redis..."
                sleep 2
              done
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ## web-entrypoint.sh is the upstream entrypoint for the Puma web process
          command: ["web-entrypoint.sh", "bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "dawarich.commonEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "dawarich.volumeMounts" . | nindent 12 }}
          ## Startup probe – Rails boot can be slow on first start
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30    # allow up to 5 min total
            timeoutSeconds: 5
          ## Liveness – restart if the process hangs
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 0   # covered by startupProbe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          ## Readiness – remove from service endpoints while not ready
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.appDeployment.resources | nindent 12 }}
      volumes:
        {{- include "dawarich.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dawarich.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "dawarich.name" . }}
    app.kubernetes.io/component: app
