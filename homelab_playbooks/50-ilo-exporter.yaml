- name: Deploy iLO exporter
  hosts: localhost
  gather_facts: false

  vars_files:
     - group_vars/all/vault.yml
  vars:
    namespace: monitoring
    image: mauvesoftware/ilo_exporter:latest
    port: 9545
    ingress_host: ilo-exporter.thekor.eu
    vault_kv_path: ilo

  tasks:
    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ilo-exporter-secret
            namespace: "{{ namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: ilo-exporter-secret
              creationPolicy: Owner
            data:
              - secretKey: password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: ilo_api_password
              - secretKey: username
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: ilo_api_username

    - name: Deploy iLO exporter manifests
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ilo-exporter
            namespace: "{{ namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ilo-exporter
            template:
              metadata:
                labels:
                  app: ilo-exporter
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  runAsGroup: 65534
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: ilo-exporter
                    image: "{{ image }}"
                    ports:
                      - containerPort: "{{ port }}"
                        name: metrics
                    env:
                      - name: API_USERNAME
                        valueFrom:
                          secretKeyRef:
                            name: ilo-exporter-secret
                            key: username
                      - name: API_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ilo-exporter-secret
                            key: password
                    securityContext:
                      runAsUser: 65534
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                        drop: [ALL]
                    livenessProbe:
                      tcpSocket:
                        port: metrics
                      initialDelaySeconds: 15
                      periodSeconds: 30
                      timeoutSeconds: 10

                    readinessProbe:
                      tcpSocket:
                        port: metrics
                      initialDelaySeconds: 10
                      periodSeconds: 15
                      timeoutSeconds: 10
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi

        - apiVersion: v1
          kind: Service
          metadata:
            name: ilo-exporter
            namespace: "{{ namespace }}"
          spec:
            selector:
              app: ilo-exporter
            ports:
              - name: metrics
                port: "{{ port }}"
                targetPort: metrics

        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ilo-exporter
            namespace: "{{ namespace }}"
            annotations:
              haproxy.org/check: "false"
              haproxy.org/forwarded-for: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "{{ ingress_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ilo-exporter
                          port:
                            name: metrics
