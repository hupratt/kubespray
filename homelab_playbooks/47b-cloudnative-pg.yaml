- name: ExternalSecret — pulls Vault token + S3/restic creds from your provider
  hosts: localhost
  gather_facts: false
  vars:
    vault_kv_restic_path: "restic"
    clusters:
      - name: grafana-pg
        namespace: monitoring
        database: grafana
        owner: grafana
        vault_path: monitoring
        storage: 2Gi

      - name: linkwarden-pg
        namespace: linkwarden
        database: linkwarden
        owner: linkwarden
        vault_path: linkwarden
        storage: 5Gi

      - name: netbox-pg
        namespace: netbox
        database: netbox
        owner: netbox
        vault_path: netbox
        storage: 5Gi

      - name: authentik-pg
        namespace: authentik
        database: authentik
        owner: authentik
        vault_path: authentik
        storage: 5Gi

      - name: makita-pg
        namespace: makita
        database: makita
        owner: ubuntu
        vault_path: makita
        storage: 5Gi

      - name: paperless-pg
        namespace: paperless
        database: paperless
        owner: paperless
        vault_path: paperless
        storage: 5Gi

      - name: harbor-pg
        namespace: harbor
        database: harbor_core
        owner: harbor
        vault_path: harbor
        storage: 10Gi
        extra_databases:
          - harbor_notary_server
          - harbor_notary_signer
          - harbor_trivy

      - name: booking-pg
        namespace: booking
        database: booking
        owner: ubuntu
        vault_path: booking
        storage: 5Gi

      - name: patchmon-pg
        namespace: patchmon
        database: patchmon
        owner: patchmon
        vault_path: patchmon
        storage: 2Gi

  tasks:
    - name: ExternalSecret for backup credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: restic-credentials
            namespace: "{{ db.namespace }}"
          spec:
            refreshInterval: "1h"
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: restic-credentials
              creationPolicy: Owner
              template:
                type: Opaque
            data:

              # Restic repo password
              - secretKey: RESTIC_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_restic_path }}"
                  property: RESTIC_PASSWORD

              # S3 / Garage credentials
              - secretKey: AWS_ACCESS_KEY_ID
                remoteRef:
                  key: "{{ vault_kv_restic_path }}"
                  property: AWS_ACCESS_KEY_ID

              - secretKey: AWS_SECRET_ACCESS_KEY
                remoteRef:
                  key: "{{ vault_kv_restic_path }}"
                  property: AWS_SECRET_ACCESS_KEY

      loop: "{{ clusters }}"
      loop_control:
        loop_var: db
        label: "{{ db.namespace }}"

