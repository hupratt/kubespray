---
# Source: 46-slow-storage.yaml — "Create StorageClass (no-provisioner)".
# NOTE: the playbook also mkdir'd the backing directories on node coreos-wk-4
# (delegate_to + become). That host-side step is NOT declarative — see BLOCKERS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: slow-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Source: 46-slow-storage.yaml — "Create PersistentVolumes" (loop item slow-pv-01).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: slow-pv-01
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow-local
  local:
    path: /var/mnt/slow-storage/slow-pv-01
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role
              operator: In
              values:
                - slow-services
---
