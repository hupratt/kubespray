---
# Migrated verbatim from 03a-cert-manager.yaml, task "Deploy ExternalSecret".
# Produces the k8s Secret `hetzner-dns-api-token` in namespace cert-manager, read
# by the letsencrypt-dns-hetzner ClusterIssuer's DNS01 webhook solver.
# vault_kv_path -> certmanager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-dns-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hetzner-dns-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: certmanager
        property: hetzner_api
