---
# Migrated verbatim from 03a-cert-manager.yaml, task "Create ClusterIssuer for
# Let's Encrypt via Hetzner DNS01". Uses the cert-manager-webhook-hetzner solver
# and the hetzner-dns-api-token Secret produced by the ExternalSecret above.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-hetzner
spec:
  acme:
    email: hprattdo@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-hetzner-key
    solvers:
      - dns01:
          webhook:
            solverName: hetzner
            groupName: acme.hetzner.com
            config:
              tokenSecretKeyRef:
                name: hetzner-dns-api-token
                key: token
