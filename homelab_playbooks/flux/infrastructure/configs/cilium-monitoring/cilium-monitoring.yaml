---
# Source: 24-ciliumpatch.yaml — "Apply Cilium Service and ServiceMonitors".
# ServiceMonitor objects require the Prometheus Operator CRDs
# (monitoring.coreos.com/v1) to exist before they can apply. See BLOCKERS.
apiVersion: v1
kind: Service
metadata:
  name: cilium-operator
  namespace: kube-system
  labels:
    name: cilium-operator
spec:
  clusterIP: None
  selector:
    name: cilium-operator
  ports:
    - name: prometheus
      port: 9963
      targetPort: 9963
---
# Source: 24-ciliumpatch.yaml — Cilium Envoy ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-envoy
  namespace: kube-system
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: envoy-metrics
      interval: 30s
---
# Source: 24-ciliumpatch.yaml — Hubble Metrics ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble-metrics
  namespace: kube-system
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      k8s-app: hubble
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: hubble-metrics
      interval: 30s
---
# Source: 24-ciliumpatch.yaml — Cilium Operator ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-operator
  namespace: kube-system
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      name: cilium-operator
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: prometheus
      interval: 30s
