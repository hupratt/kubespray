---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
# Replaces the jetstack Helm tasks in 03a-cert-manager.yaml.
# NOTE: the cert-manager-webhook-hetzner chart + ClusterIssuer/wildcard-cert
# from 03a are NOT included in this pilot — they are a follow-up (see
# flux/README.md "Not yet migrated"). This installs the cert-manager controller
# only, which is the external-Helm pattern this pilot demonstrates.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.18.2        # matches cert_manager_version in 03a-cert-manager.yaml
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 1h
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
