---
# Source: 03a-cert-manager.yaml, task "Create cert-manager-webhook-hetzner
# ClusterRole for ACME group" — lets the cert-manager SA drive the webhook's
# acme.hetzner.com API group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-hetzner-acme-thekor-eu
rules:
  - apiGroups: ["acme.hetzner.com"]
    resources: ["*"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
# Source: 03a-cert-manager.yaml, task "Bind ClusterRole to cert-manager ServiceAccount".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-hetzner-acme-thekor-eu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-hetzner-acme-thekor-eu
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Source: 03a-cert-manager.yaml, task "Create Role for reading secrets in
# cert-manager namespace".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-hetzner-secrets
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
# Source: 03a-cert-manager.yaml, task "Bind secrets Role to webhook ServiceAccount".
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-hetzner-secrets
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-hetzner-secrets
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-hetzner
    namespace: cert-manager
