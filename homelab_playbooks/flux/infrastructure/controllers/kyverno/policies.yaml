# Source: 00b-kyverno.yaml — "Policy - block SYS_ADMIN capability".
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-sys-admin
  annotations:
    policies.kyverno.io/title: Block SYS_ADMIN Capability
    policies.kyverno.io/category: Pod Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-sys-admin
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - resources:
              namespaces:
                - haproxy
                - kube-system
      validate:
        message: "SYS_ADMIN capability is not allowed."
        deny:
          conditions:
            any:
              - key: "SYS_ADMIN"
                operator: AnyIn
                value: "request.object.spec.containers[].securityContext.capabilities.add[] || []"
              - key: "SYS_ADMIN"
                operator: AnyIn
                value: "request.object.spec.initContainers[].securityContext.capabilities.add[] || []"
---
# Source: 00b-kyverno.yaml — "Policy - restrict NET_ADMIN capability".
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-net-admin
  annotations:
    policies.kyverno.io/title: Restrict NET_ADMIN Capability
    policies.kyverno.io/category: Pod Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-net-admin
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - resources:
              namespaces:
                - haproxy
                - mariadb
                - kube-system
      validate:
        message: "NET_ADMIN capability is not allowed."
        deny:
          conditions:
            any:
              - key: "NET_ADMIN"
                operator: AnyIn
                value: "{{ 'request.object.spec.containers[].securityContext.capabilities.add[] || []' }}"
              - key: "NET_ADMIN"
                operator: AnyIn
                value: "request.object.spec.initContainers[].securityContext.capabilities.add[] || []"
