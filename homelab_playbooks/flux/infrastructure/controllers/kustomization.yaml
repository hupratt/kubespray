---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: rook-ceph (needs the rook operator, not yet in this tree) and
# cert-manager-webhook-hetzner (chart source is an unverified placeholder) are
# intentionally omitted — wiring them into this wait:true layer would block it.
resources:
  - cert-manager
  - cloudnative-pg
  - external-secrets
  - haproxy
  - kubernetes-replicator
  - kyverno
  - mariadb-operator
  - volsync
