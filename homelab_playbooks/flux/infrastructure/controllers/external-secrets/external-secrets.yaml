---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# Replaces the Ansible tasks in 02d-hashicorp-vault.yaml:
#   - "Add ESO Helm repo"  (kubernetes.core.helm_repository)
#   - "Install ESO"        (kubernetes.core.helm)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "*"          # pin to a specific version once validated (e.g. 0.10.x)
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      interval: 1h
  install:
    createNamespace: false  # namespace declared above
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
