---
# Source: 08b-cloudnative-pg.yaml — "ExternalSecret for backup credentials".
# restic repo creds consumed by the cn-postgres VolSync ReplicationSources
# (apps/homelab/volsync-backups). Vault KV key "restic" preserved; note
# RESTIC_REPOSITORY maps to Vault property RESTIC_DB_REPOSITORY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: cn-postgres
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: "restic"
        property: RESTIC_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "restic"
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "restic"
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: "restic"
        property: RESTIC_DB_REPOSITORY
