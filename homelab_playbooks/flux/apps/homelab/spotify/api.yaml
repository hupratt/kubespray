---
# Migrated from 05-spotify.yaml
#   task: "Deploy complete Spotify application stack to Kubernetes"
#         (spotify-api Deployment + Service + Ingress)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-api
  namespace: spotify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotify-api
  template:
    metadata:
      labels:
        app: spotify-api
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      containers:
        - name: spotify-api
          image: registry.thekor.eu/docker/spotify-stats/api:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: API_ENDPOINT
              value: "https://spotifyapi.thekor.eu"
            - name: CLIENT_ENDPOINT
              value: "https://spotify.thekor.eu"
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spotify-database-url
                  key: MONGO_ENDPOINT
            - name: SPOTIFY_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: spotify-secrets
                  key: SPOTIFY_PUBLIC
            - name: SPOTIFY_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-secrets
                  key: SPOTIFY_SECRET
            - name: CORS
              value: "http://localhost:3000,http://localhost:3001,https://spotifyapi.thekor.eu,https://spotify.thekor.eu"
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-api
  namespace: spotify
spec:
  selector:
    app: spotify-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-backend-ingress
  namespace: spotify
  annotations:
    haproxy.org/check: "disabled"
    haproxy.org/backend-config-snippet: |
      no option httpchk
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - spotifyapi.thekor.eu
      secretName: wildcard-thekor
  rules:
    - host: spotifyapi.thekor.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-api
                port:
                  number: 8080
