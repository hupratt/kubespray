---
# Migrated from 05-spotify.yaml
#   task: "Deploy ExternalSecret" (spotify-database-url, namespace spotify)
# The generated Secret assembles a full Mongo connection string from the
# Vault-sourced testapp username/password via target.template.data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spotify-database-url
  namespace: spotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spotify-database-url
    creationPolicy: Owner
    template:
      data:
        MONGO_ENDPOINT: "mongodb://{{ .mongo_testapp_username }}:{{ .mongo_testapp_password }}@mongodb-service.mongodb.svc.cluster.local:27017/your_spotify?authSource=admin"
  data:
    - secretKey: mongo_testapp_username
      remoteRef:
        key: mongodb
        property: mongo_testapp_username
    - secretKey: mongo_testapp_password
      remoteRef:
        key: mongodb
        property: mongo_testapp_password
