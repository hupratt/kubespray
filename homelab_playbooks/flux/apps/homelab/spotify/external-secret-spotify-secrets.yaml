---
# Migrated from 05-spotify.yaml
#   task: "Deploy ExternalSecret" (spotify-secrets, namespace spotify)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spotify-secrets
  namespace: spotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spotify-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPOTIFY_PUBLIC
      remoteRef:
        key: spotify
        property: spotify_public
    - secretKey: SPOTIFY_SECRET
      remoteRef:
        key: spotify
        property: spotify_secret
