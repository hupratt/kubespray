---
# Migrated verbatim from the "Deploy ExternalSecret" task in 22-netbox.yaml
# (vault_kv_path: netbox). Produces the Secret netbox-secrets in namespace netbox,
# whose keys are injected into the HelmRelease via valuesFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-secrets
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbox-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_TOKEN_PEPPERS
      remoteRef:
        key: netbox
        property: API_TOKEN_PEPPERS
    - secretKey: superuser_name
      remoteRef:
        key: netbox
        property: superuser_name
    - secretKey: superuser_email
      remoteRef:
        key: netbox
        property: superuser_email
    - secretKey: superuser_password
      remoteRef:
        key: netbox
        property: superuser_password
    - secretKey: superuser_apitoken
      remoteRef:
        key: netbox
        property: superuser_apitoken
    - secretKey: email_server
      remoteRef:
        key: netbox
        property: email_server
    - secretKey: email_port
      remoteRef:
        key: netbox
        property: email_port
    - secretKey: email_username
      remoteRef:
        key: netbox
        property: email_username
    - secretKey: email_password
      remoteRef:
        key: netbox
        property: email_password
    - secretKey: hostname
      remoteRef:
        key: netbox
        property: hostname
    - secretKey: pg_host
      remoteRef:
        key: netbox
        property: pg_host
    - secretKey: pg_port
      remoteRef:
        key: netbox
        property: pg_port
    - secretKey: pg_dbname
      remoteRef:
        key: netbox
        property: pg_dbname
    - secretKey: pg_username
      remoteRef:
        key: netbox
        property: pg_username
    - secretKey: pg_password
      remoteRef:
        key: netbox
        property: pg_password
    - secretKey: SOCIAL_AUTH_OIDC_ENDPOINT
      remoteRef:
        key: netbox
        property: SOCIAL_AUTH_OIDC_ENDPOINT
    - secretKey: SOCIAL_AUTH_OIDC_KEY
      remoteRef:
        key: netbox
        property: SOCIAL_AUTH_OIDC_KEY
    - secretKey: SOCIAL_AUTH_OIDC_SECRET
      remoteRef:
        key: netbox
        property: SOCIAL_AUTH_OIDC_SECRET
