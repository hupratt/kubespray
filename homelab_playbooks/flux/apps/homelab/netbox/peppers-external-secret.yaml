---
# Migrated from 22-netbox.yaml task "Ensure netbox-peppers ConfigMap exists".
# The original was a ConfigMap embedding the secret API_TOKEN_PEPPERS, so it is
# reproduced here as an ESO-managed Secret (never plaintext in Git). The Secret
# carries a `peppers.py` key that the netbox Deployment mounts as a file (see
# release.yaml extraVolumes -> secret: netbox-peppers).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-peppers
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbox-peppers
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        peppers.py: |
          API_TOKEN_PEPPERS = {
            0: "{{ .API_TOKEN_PEPPERS }}"
          }
  data:
    - secretKey: API_TOKEN_PEPPERS
      remoteRef:
        key: netbox
        property: API_TOKEN_PEPPERS
