---
# Replaces the "Clone netbox git repo" task in 22-netbox.yaml. The chart lives at
# charts/netbox inside the private repo, so Flux needs SSH creds. Create the
# referenced secret once (not GitOps-managed):
#
#   flux create secret git netbox-git-auth \
#     --namespace netbox \
#     --url ssh://git@gitlab.thekor.eu/kube/netbox.git \
#     --private-key-file ~/.ssh/id_ed25519
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  ref:
    branch: main
  secretRef:
    name: netbox-git-auth
  url: ssh://git@gitlab.thekor.eu/kube/netbox.git
