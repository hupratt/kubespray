---
# Migrated from 04b-chirpy.yaml
#   task: "Deploy Jekyll Chirpy application and storage resources" (Deployment)
# Pulls its image from the private registry via the replicated
# docker-registry-secret pull secret (see apps/homelab/docker-registry-secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jekyll
  namespace: chirpy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jekyll
  template:
    metadata:
      labels:
        app: jekyll
    spec:
      containers:
        - name: jekyll
          image: registry.thekor.eu/docker/chirpy:latest
          ports:
            - containerPort: 4000
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: docker-registry-secret
