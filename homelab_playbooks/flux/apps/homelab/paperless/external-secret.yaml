---
# Migrated from 32-paperless.yaml (task: "Deploy ExternalSecret").
# vault_kv_path "paperless" inlined into every remoteRef.key. Vault KV property
# names are preserved exactly.
#
# NOTE: the source playbook named this object `paperless_vault_secrets` (with
# underscores), which is NOT a valid Kubernetes object name (RFC1123). Renamed
# to `paperless-vault-secrets`; Secret *data keys* keep their underscores (those
# are valid). See BLOCKERS in the migration report.
#
# target.template adds a derived `paperless_url` key ("https://<hostname>") so the
# HelmRelease can reproduce the `PAPERLESS_URL`/`PAPERLESS_CSRF_TRUSTED_ORIGINS`
# values the playbook composed as "https://{{ paperless_hostname }}". mergePolicy
# Merge keeps all Vault-fetched keys as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-vault-secrets
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paperless-vault-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        paperless_url: "https://{{ .paperless_hostname }}"
  data:
    - secretKey: vault_paperless_secret_key
      remoteRef:
        key: paperless
        property: vault_paperless_secret_key
    - secretKey: vault_paperless_db_password
      remoteRef:
        key: paperless
        property: vault_paperless_db_password
    - secretKey: vault_paperless_admin_user
      remoteRef:
        key: paperless
        property: vault_paperless_admin_user
    - secretKey: vault_paperless_admin_password
      remoteRef:
        key: paperless
        property: vault_paperless_admin_password
    - secretKey: vault_paperless_admin_mail
      remoteRef:
        key: paperless
        property: vault_paperless_admin_mail
    - secretKey: paperless_namespace
      remoteRef:
        key: paperless
        property: paperless_namespace
    - secretKey: paperless_release_name
      remoteRef:
        key: paperless
        property: paperless_release_name
    - secretKey: paperless_kubeconfig
      remoteRef:
        key: paperless
        property: paperless_kubeconfig
    - secretKey: paperless_hostname
      remoteRef:
        key: paperless
        property: paperless_hostname
    - secretKey: paperless_tls_secret
      remoteRef:
        key: paperless
        property: paperless_tls_secret
    - secretKey: paperless_storage_class
      remoteRef:
        key: paperless
        property: paperless_storage_class
    - secretKey: paperless_secret_key
      remoteRef:
        key: paperless
        property: paperless_secret_key
    - secretKey: paperless_db_password
      remoteRef:
        key: paperless
        property: paperless_db_password
    - secretKey: paperless_admin_user
      remoteRef:
        key: paperless
        property: paperless_admin_user
    - secretKey: paperless_admin_password
      remoteRef:
        key: paperless
        property: paperless_admin_password
    - secretKey: paperless_admin_mail
      remoteRef:
        key: paperless
        property: paperless_admin_mail
    - secretKey: paperless_db_host
      remoteRef:
        key: paperless
        property: paperless_db_host
    - secretKey: paperless_db_port
      remoteRef:
        key: paperless
        property: paperless_db_port
    - secretKey: paperless_db_name
      remoteRef:
        key: paperless
        property: paperless_db_name
    - secretKey: paperless_db_user
      remoteRef:
        key: paperless
        property: paperless_db_user
