---
# Migrated verbatim from the "Deploy ExternalSecret" task in 21-linkwarden.yaml.
# Produces the k8s Secret `linkwarden-secret` in namespace linkwarden, whose
# keys are consumed by the HelmRelease's valuesFrom below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-secret
  namespace: linkwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: linkwarden-secret
    creationPolicy: Owner
  data:
    - secretKey: dbName
      remoteRef:
        key: linkwarden
        property: dbName
    - secretKey: host
      remoteRef:
        key: linkwarden
        property: host
    - secretKey: hostname
      remoteRef:
        key: linkwarden
        property: hostname
    - secretKey: pg_password
      remoteRef:
        key: linkwarden
        property: pg_password
    - secretKey: pg_username
      remoteRef:
        key: linkwarden
        property: pg_username
    - secretKey: nextAuthSecret
      remoteRef:
        key: linkwarden
        property: nextAuthSecret
    - secretKey: clientId
      remoteRef:
        key: linkwarden
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: linkwarden
        property: clientSecret
    - secretKey: pg_port
      remoteRef:
        key: linkwarden
        property: pg_port
