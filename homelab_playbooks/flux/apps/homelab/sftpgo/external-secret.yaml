---
# Migrated verbatim from the "Deploy ExternalSecret" task in 25-sftpgo.yaml
# (vault_kv_path: sftpgo). Produces the Secret sftpgo-vault-secrets in namespace
# sftpgo, whose keys are injected into the HelmRelease via valuesFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sftpgo-vault-secrets
  namespace: sftpgo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sftpgo-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: SFTPGO_COMMON_DEFENDER__BAN_TIME
      remoteRef:
        key: sftpgo
        property: SFTPGO_COMMON_DEFENDER__BAN_TIME
    - secretKey: SFTPGO_COMMON_DEFENDER__BAN_TIME_INCREMENT
      remoteRef:
        key: sftpgo
        property: SFTPGO_COMMON_DEFENDER__BAN_TIME_INCREMENT
    - secretKey: SFTPGO_COMMON_DEFENDER__ENABLED
      remoteRef:
        key: sftpgo
        property: SFTPGO_COMMON_DEFENDER__ENABLED
    - secretKey: SFTPGO_COMMON_DEFENDER__OBSERVATION_TIME
      remoteRef:
        key: sftpgo
        property: SFTPGO_COMMON_DEFENDER__OBSERVATION_TIME
    - secretKey: SFTPGO_COMMON_DEFENDER__THRESHOLD
      remoteRef:
        key: sftpgo
        property: SFTPGO_COMMON_DEFENDER__THRESHOLD
    - secretKey: SFTPGO_DATA_PROVIDER__DRIVER
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__DRIVER
    - secretKey: SFTPGO_DATA_PROVIDER__HOST
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__HOST
    - secretKey: SFTPGO_DATA_PROVIDER__NAME
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__NAME
    - secretKey: SFTPGO_DATA_PROVIDER__PASSWORD
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__PASSWORD
    - secretKey: SFTPGO_DATA_PROVIDER__PORT
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__PORT
    - secretKey: SFTPGO_DATA_PROVIDER__USERNAME
      remoteRef:
        key: sftpgo
        property: SFTPGO_DATA_PROVIDER__USERNAME
    - secretKey: SFTPGO_FTPD__BINDINGS__0__ADDRESS
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__BINDINGS__0__ADDRESS
    - secretKey: SFTPGO_FTPD__BINDINGS__0__DEBUG
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__BINDINGS__0__DEBUG
    - secretKey: SFTPGO_FTPD__BINDINGS__0__TLS_MODE
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__BINDINGS__0__TLS_MODE
    - secretKey: SFTPGO_FTPD__DISABLE_ACTIVE_MODE
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__DISABLE_ACTIVE_MODE
    - secretKey: SFTPGO_FTPD__PASSIVE_PORT_RANGE__END
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__PASSIVE_PORT_RANGE__END
    - secretKey: SFTPGO_FTPD__PASSIVE_PORT_RANGE__START
      remoteRef:
        key: sftpgo
        property: SFTPGO_FTPD__PASSIVE_PORT_RANGE__START
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__ROLE_FIELD
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__ROLE_FIELD
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__SCOPES
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__SCOPES
    - secretKey: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD
      remoteRef:
        key: sftpgo
        property: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD
    - secretKey: SFTPGO_WEBDAVD__BINDINGS__0__PORT
      remoteRef:
        key: sftpgo
        property: SFTPGO_WEBDAVD__BINDINGS__0__PORT
    - secretKey: hostname
      remoteRef:
        key: sftpgo
        property: hostname
