---
# Migrated verbatim from 10-monitoring.yaml, task "Deploy ExternalSecret".
# Produces Secret `grafana-secret` in namespace monitoring; consumed by the
# kube-prometheus-stack grafana pod via envValueFrom/secretKeyRef (see the grafana
# values on the kube-prometheus-stack HelmRelease). vault_kv_path -> monitoring
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: monitoring
        property: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: monitoring
        property: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: monitoring
        property: GF_SECURITY_ADMIN_PASSWORD
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: monitoring
        property: GF_DATABASE_PASSWORD
    - secretKey: GF_EMAIL_USER
      remoteRef:
        key: monitoring
        property: GF_EMAIL_USER
    - secretKey: GF_EMAIL_PASSWORD
      remoteRef:
        key: monitoring
        property: GF_EMAIL_PASSWORD
