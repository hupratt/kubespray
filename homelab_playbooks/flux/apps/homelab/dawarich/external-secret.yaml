---
# Migrated from "Deploy ExternalSecret for Dawarich" in 55-dawarich.yaml.
# Produces `dawarich-dawarich-secret` (the chart's existingSecret) with
# SECRET_KEY_BASE, DATABASE_PASSWORD, POSTGRES_PASSWORD, DATABASE_URL from Vault.
# In Ansible these were read with the Vault root token; here ESO reads them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-dawarich-secret
  namespace: dawarich
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dawarich-dawarich-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: dawarich
        property: secret_key_base
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: dawarich
        property: pg_password
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: dawarich
        property: pg_password
    - secretKey: DATABASE_URL
      remoteRef:
        key: dawarich
        property: database_url
