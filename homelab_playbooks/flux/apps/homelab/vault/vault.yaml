---
# Source: 02a-hashicorp-vault.yaml
#   - "Add HashiCorp Helm repo"  (kubernetes.core.helm_repository)
#   - "Deploy Vault via Helm"    (kubernetes.core.helm, chart hashicorp/vault 0.28.1)
#   - "Create Vault ServiceMonitor" / "Create Vault Active Client Service"
#     (community.kubernetes.k8s definition blocks — reproduced verbatim below)
#
# The rendered charts/vault/templates/vault-values.yml.j2 is inlined under
# `values` with homelab_domain substituted (thekor.eu). Vault init / unseal /
# raft-snapshot restore (02b/02c) are NOT GitOps-managed — see BLOCKERS.
#
# NOTE: the `vault` namespace is created centrally by infra-configs, which
# reconciles AFTER infra-controllers. Ensure the namespace exists before this
# HelmRelease is wired in (see BLOCKERS).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: vault
spec:
  interval: 1h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  releaseName: vault
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.28.1"        # vault_chart_version in 02a
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: vault
      interval: 1h
  install:
    createNamespace: false
    timeout: 10m
  # Inlined from charts/vault/templates/vault-values.yml.j2
  values:
    global:
      enabled: true
      tlsDisable: true          # TLS terminated at HAProxy
    injector:
      enabled: true
    server:
      telemetry:
        prometheusRetentionTime: "30s"
        disableHostname: true
        unauthenticatedMetricsAccess: true
      service:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: "/v1/sys/metrics"
          prometheus.io/port: "8200"
      enabled: true
      livenessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
        port: 8200
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
        port: 8200
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      image:
        tag: "1.17.2"
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: rook-ceph-block
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = true
              telemetry {
                unauthenticated_metrics_access = true
              }
            }
            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname = true
            }

            storage "raft" {
              path = "/vault/data"
              retry_join {
                leader_api_addr = "http://vault-0.vault-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://vault-1.vault-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://vault-2.vault-internal:8200"
              }
            }
            service_registration "kubernetes" {}
      ingress:
        enabled: true
        ingressClassName: haproxy
        annotations:
          haproxy.org/ssl-redirect: "true"
          haproxy.org/timeout-connect: "5s"
          haproxy.org/timeout-client: "50s"
          haproxy.org/timeout-server: "50s"
        hosts:
          - host: vault.thekor.eu
            paths:
              - /
        tls:
          - secretName: vault-tls
            hosts:
              - vault.thekor.eu
      serviceAccount:
        create: true
        name: vault
    ui:
      enabled: true
      serviceType: ClusterIP
---
# Verbatim from 02a "Create Vault ServiceMonitor"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vault-servicemonitor
  namespace: vault
  labels:
    release: prometheus
    name: vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  namespaceSelector:
    matchNames:
      - vault
  endpoints:
    - port: http
      path: /v1/sys/metrics
      params:
        format: ["prometheus"]
      interval: 30s
      scheme: http
---
# Verbatim from 02a "Create Vault Active Client Service"
apiVersion: v1
kind: Service
metadata:
  name: vault-active-client
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    vault-active: "true"
spec:
  selector:
    app.kubernetes.io/name: vault
    # vault-active is stamped by the chart only on the current Raft leader; without
    # it this Service would round-robin to sealed/standby pods and 307-redirect writes.
    vault-active: "true"
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  type: ClusterIP
