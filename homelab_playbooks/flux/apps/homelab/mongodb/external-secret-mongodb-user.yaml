---
# Migrated from 04c-mongodb_and_testapp.yaml
#   task: "Deploy ExternalSecret" (mongodb-user-secret, namespace mongodb)
# The generated Secret embeds a static mongo-database ("Trellis") alongside the
# Vault-sourced username/password, reproduced via target.template.data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-user-secret
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mongodb-user-secret
    creationPolicy: Owner
    template:
      data:
        mongo-database: Trellis
        mongo-username: "{{ .mongo_username }}"
        mongo-password: "{{ .mongo_password }}"
  data:
    - secretKey: mongo_username
      remoteRef:
        key: mongodb
        property: mongo_username
    - secretKey: mongo_password
      remoteRef:
        key: mongodb
        property: mongo_password
