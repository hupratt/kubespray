---
# Migrated from 04c-mongodb_and_testapp.yaml
#   task: "Deploy ExternalSecret" (mongodb-secret, namespace mongodb)
# Vault KV key/property names preserved exactly (vault_kv_path "mongodb").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-secret
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mongodb-secret
    creationPolicy: Owner
  data:
    - secretKey: mongo-root-username
      remoteRef:
        key: mongodb
        property: mongo_testapp_username
    - secretKey: mongo-root-password
      remoteRef:
        key: mongodb
        property: mongo_testapp_password
    - secretKey: mongo_backup_username
      remoteRef:
        key: mongodb
        property: mongo_backup_username
    - secretKey: mongo_backup_password
      remoteRef:
        key: mongodb
        property: mongo_backup_password
