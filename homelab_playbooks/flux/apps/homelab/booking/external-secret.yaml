---
# Migrated verbatim from 28-booking.yaml (task: "Deploy ExternalSecret").
# vault_kv_path "makita-booking" inlined into every remoteRef.key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-backend-env
  namespace: booking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: booking-backend-env
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_ALLOWED_HOSTS
      remoteRef:
        key: makita-booking
        property: DJANGO_ALLOWED_HOSTS
    - secretKey: DJANGO_DEBUG
      remoteRef:
        key: makita-booking
        property: DJANGO_DEBUG
    - secretKey: DJANGO_DEVELOPMENT
      remoteRef:
        key: makita-booking
        property: DJANGO_DEVELOPMENT
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: makita-booking
        property: DJANGO_SECRET_KEY
    - secretKey: dbpassword
      remoteRef:
        key: makita-booking
        property: dbpassword
    - secretKey: dbuser
      remoteRef:
        key: makita-booking
        property: dbuser
    - secretKey: enginedb
      remoteRef:
        key: makita-booking
        property: enginedb
    - secretKey: hostip
      remoteRef:
        key: makita-booking
        property: hostip
    - secretKey: pnumber
      remoteRef:
        key: makita-booking
        property: pnumber
