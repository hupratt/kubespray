---
# Source: 09-maria-operator.yaml — "Deploy ExternalSecret".
# Produces the k8s Secret `mariadb-root-secret` (key: password) consumed by the
# MariaDB instance's rootPasswordSecretKeyRef and the operator values above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-root-secret
  namespace: mariadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-root-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: mariadb
        property: superuser_password
