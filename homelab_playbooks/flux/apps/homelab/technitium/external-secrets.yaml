---
# Migrated from "Deploy ExternalSecret for Technitium admin password" in
# 45-technitium.yaml. vault_kv_path -> technitium. Produces the
# `technitium-admin-secret` Secret (admin password, SSO creds, restic creds).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-admin-secret
  namespace: technitium
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: technitium-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: technitium
        property: admin_password
    - secretKey: db_name
      remoteRef:
        key: technitium
        property: db_name
    - secretKey: user
      remoteRef:
        key: technitium
        property: user
    - secretKey: technitium_sso_client_id
      remoteRef:
        key: technitium
        property: technitium_sso_client_id
    - secretKey: technitium_sso_client_secret
      remoteRef:
        key: technitium
        property: technitium_sso_client_secret
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: restic
        property: RESTIC_REPOSITORY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic
        property: RESTIC_PASSWORD
    - secretKey: RESTIC_DB_REPOSITORY
      remoteRef:
        key: restic
        property: RESTIC_DB_REPOSITORY
---
# Migrated from "Deploy ExternalSecret for mysql connection string" in
# 45b-technitium.yaml. Renders the Technitium "Query Logs (MySQL)" app config
# (dnsApp.config) from Vault. The {{ .X }} tokens are LITERAL ESO Go-template
# refs into this ExternalSecret's own fetched data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-mysql-config
  namespace: technitium
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: technitium-mysql-config
    template:
      data:
        dnsApp.config: |
          {
            "enableLogging": true,
            "maxQueueSize": 1000000,
            "maxLogDays": 30,
            "maxLogRecords": 0,
            "databaseName": "{{ .db_name }}",
            "connectionString": "Server={{ .host }}; Port=3306; Uid={{ .user }}; Pwd={{ .password }};"
          }
  data:
    - secretKey: host
      remoteRef:
        key: technitium
        property: host
    - secretKey: user
      remoteRef:
        key: technitium
        property: user
    - secretKey: password
      remoteRef:
        key: technitium
        property: password
    - secretKey: db_name
      remoteRef:
        key: technitium
        property: db_name
