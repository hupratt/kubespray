---
# Migrated from 06-trello.yaml
#   task: "Deploy ExternalSecret" (trello-database-url, namespace trellis)
# The generated Secret assembles a full Mongo connection string for the Trellis
# database from the Vault-sourced testapp username/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trello-database-url
  namespace: trellis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: trello-database-url
    creationPolicy: Owner
    template:
      data:
        trello_mongo_endpoint: "mongodb://{{ .mongo_testapp_username }}:{{ .mongo_testapp_password }}@mongodb-service.mongodb.svc.cluster.local:27017/Trellis?authSource=admin"
  data:
    - secretKey: mongo_testapp_username
      remoteRef:
        key: mongodb
        property: mongo_testapp_username
    - secretKey: mongo_testapp_password
      remoteRef:
        key: mongodb
        property: mongo_testapp_password
