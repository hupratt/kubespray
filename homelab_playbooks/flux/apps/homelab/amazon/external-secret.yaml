---
# Migrated from 07-amazon.yaml
#   task: "Deploy ExternalSecret" (amazon-database-url, namespace amazon-clone)
# The generated Secret assembles a full Mongo connection string for the Amazon
# database from the Vault-sourced testapp username/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amazon-database-url
  namespace: amazon-clone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: amazon-database-url
    creationPolicy: Owner
    template:
      data:
        amazon-database-url: "mongodb://{{ .mongo_testapp_username }}:{{ .mongo_testapp_password }}@mongodb-service.mongodb.svc.cluster.local:27017/Amazon?authSource=admin"
  data:
    - secretKey: mongo_testapp_username
      remoteRef:
        key: mongodb
        property: mongo_testapp_username
    - secretKey: mongo_testapp_password
      remoteRef:
        key: mongodb
        property: mongo_testapp_password
