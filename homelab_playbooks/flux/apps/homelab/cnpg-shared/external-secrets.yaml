---
# Source: 08-cloudnative-pg.yaml — ExternalSecrets for the shared-pg cluster.
# ns cn-postgres. Vault KV keys/properties preserved verbatim.
#   - shared-pg superuser (basic-auth)   key: cn-postgres
#   - cnpg-backup-user  (setup.sql)      key: cn-postgres
#   - per-owner <owner>-pg-secret        key: <vault_path>  (basic-auth)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-pg-superuser-vault-secret
  namespace: cn-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shared-pg-superuser-vault-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: cn-postgres
        property: superuser_username
    - secretKey: password
      remoteRef:
        key: cn-postgres
        property: superuser_password
---
