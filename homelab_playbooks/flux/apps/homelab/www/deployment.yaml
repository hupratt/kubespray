---
# Migrated verbatim from 26-www.yaml (task: "Deploy backend").
# backend_image / backend_port vars inlined; port templated strings -> integers.
# NOTE: envFrom references Secret `portfolio-backend-env`, but the ExternalSecret
# in this dir targets `portfolio-vault-secrets`. This name mismatch is carried
# over from the source playbook — see BLOCKERS in the migration report.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: www-portfolio
  labels:
    app: portfolio-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      initContainers:
        # Run migrations before the main container starts
        - name: migrate
          image: registry.thekor.eu/docker/www/portfolio-backend:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              python manage.py makemigrations &&
              python manage.py migrate
          envFrom:
            - secretRef:
                name: portfolio-backend-env
      containers:
        - name: backend
          image: registry.thekor.eu/docker/www/portfolio-backend:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - python manage.py runserver 0.0.0.0:9915
          ports:
            - containerPort: 9915
          envFrom:
            - secretRef:
                name: portfolio-backend-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 9915
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 9915
            initialDelaySeconds: 10
            periodSeconds: 5
