---
# Migrated verbatim from 26-www.yaml (task: "Deploy ExternalSecret").
# vault_kv_path "www" is inlined into every remoteRef.key.
# Produces the k8s Secret `portfolio-backend-env` in namespace www-portfolio —
# the name the Deployment's envFrom.secretRef expects (was portfolio-vault-secrets,
# which no workload referenced).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-backend-env
  namespace: www-portfolio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: portfolio-backend-env
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_ALLOWED_HOSTS
      remoteRef:
        key: www
        property: DJANGO_ALLOWED_HOSTS
    - secretKey: DJANGO_DEBUG
      remoteRef:
        key: www
        property: DJANGO_DEBUG
    - secretKey: DJANGO_DEVELOPMENT
      remoteRef:
        key: www
        property: DJANGO_DEVELOPMENT
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: www
        property: DJANGO_SECRET_KEY
    - secretKey: REACT_APP_BASE
      remoteRef:
        key: www
        property: REACT_APP_BASE
    - secretKey: SECRET_KEY
      remoteRef:
        key: www
        property: SECRET_KEY
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: www
        property: SENDGRID_API_KEY
    - secretKey: SENTRY_KEY
      remoteRef:
        key: www
        property: SENTRY_KEY
    - secretKey: dbpassword
      remoteRef:
        key: www
        property: dbpassword
    - secretKey: dbuser
      remoteRef:
        key: www
        property: dbuser
    - secretKey: enginedb
      remoteRef:
        key: www
        property: enginedb
    - secretKey: hostip
      remoteRef:
        key: www
        property: hostip
    - secretKey: pnumber
      remoteRef:
        key: www
        property: pnumber
