---
# Migrated from 04a-gitlab_container_registry.yaml
#   task: "Deploy ExternalSecret for Docker Registry" (+ "Annotate ... declaratively")
#
# The Ansible flow created the ExternalSecret, then separately patched the
# resulting Secret with the mittwald replicator annotation so the pull secret is
# copied into every app namespace. Here both are expressed on the single
# ExternalSecret: the annotation is set via target.template.metadata.annotations
# so the generated Secret carries it (creationPolicy: Owner).
#
# Vault KV key/property names are preserved exactly (vault_kv_path "registry").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry-secret
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: docker-registry-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          replicator.v1.mittwald.de/replicate-to: "amazon-clone,authentik,backup,booking,cert-manager,chirpy,cilium-secrets,cn-postgres,etcd-backup,frigate,haproxy,harbor,immich,kubewarden,linkwarden,makita,mariadb,mongo-express,mongodb,monitoring,netbox,open-webui,paperless,rook-ceph,sftpgo,spotify,thrifty,trellis,vault,vaultwarden,www-portfolio,youtube"
      data:
        .dockerconfigjson: |-
          {
            "auths": {
              "{{ .registry_url }}": {
                "username": "{{ .registry_username }}",
                "password": "{{ .registry_password }}",
                "auth": "{{ printf "%s:%s" .registry_username .registry_password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: registry_username
      remoteRef:
        key: registry
        property: registry_username
    - secretKey: registry_url
      remoteRef:
        key: registry
        property: registry_url
    - secretKey: registry_password
      remoteRef:
        key: registry
        property: registry_password
