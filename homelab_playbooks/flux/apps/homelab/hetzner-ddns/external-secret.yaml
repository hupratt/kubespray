---
# Replaces the plaintext Secret from 51-hetzner-ddns.yaml.
#
# The Ansible playbook created `ddns-hetzner-token` from the Ansible-Vault var
# `vault_ddns_api_token` (group_vars/all/vault.yml) — that value was NEVER in a
# Vault KV path, so it cannot be committed as plaintext. This ExternalSecret is
# a SCAFFOLD: the Hetzner API token must first be written to a Vault KV path,
# then the remoteRef below updated to point at it.
#
# TODO(blocker): store the Hetzner DNS API token in Vault and fix key/property.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddns-hetzner-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ddns-hetzner-token
    creationPolicy: Owner
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: hetzner           # TODO pin to real Vault KV path
        property: ddns_api_token   # TODO pin to real property name
