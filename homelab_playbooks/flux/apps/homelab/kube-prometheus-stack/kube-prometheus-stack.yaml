---
# Migrated from 00c-prometheus.yaml (the "dummy" kube-prometheus-stack install
# that satisfies rook-ceph). grafana + alertmanager disabled, as in the original.
# The `monitoring` namespace is created by infra-configs/namespaces.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"          # original used "latest"; pin once validated
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    createNamespace: false
  values:
    grafana:
      enabled: false
    alertmanager:
      enabled: false
