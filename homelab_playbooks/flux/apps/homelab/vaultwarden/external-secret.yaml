---
# Migrated from the "Deploy ExternalSecret" + "Annotate ... replicate-to mariadb"
# tasks in 17-vaultwarden.yaml (vault_kv_path: vaultwarden). Produces the Secret
# vaultwarden-secret in namespace vaultwarden.
#
# The mittwald replicator annotation from the playbook is reproduced via
# target.template.metadata.annotations so the generated Secret carries it.
#
# The chart's values template also needs `domain: https://<hostname>`, which
# cannot be composed from a single Vault property with valuesFrom. It is derived
# here as an extra `domain` secret key via ESO templating from the `hostname`
# property, then injected into the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-secret
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secret
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          replicator.v1.mittwald.de/replicate-to: "mariadb"
      data:
        # Passthrough of all fetched properties, plus derived full domain URL.
        domain: "https://{{ .hostname }}"
        dbName: "{{ .dbName }}"
        host: "{{ .host }}"
        hostname: "{{ .hostname }}"
        password: "{{ .password }}"
        type: "{{ .type }}"
        username: "{{ .username }}"
        adminToken: "{{ .adminToken }}"
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        smtp_from: "{{ .smtp_from }}"
        smtp_host: "{{ .smtp_host }}"
        smtp_password: "{{ .smtp_password }}"
        smtp_port: "{{ .smtp_port }}"
        smtp_username: "{{ .smtp_username }}"
  data:
    - secretKey: dbName
      remoteRef:
        key: vaultwarden
        property: dbName
    - secretKey: host
      remoteRef:
        key: vaultwarden
        property: host
    - secretKey: hostname
      remoteRef:
        key: vaultwarden
        property: hostname
    - secretKey: password
      remoteRef:
        key: vaultwarden
        property: password
    - secretKey: type
      remoteRef:
        key: vaultwarden
        property: type
    - secretKey: username
      remoteRef:
        key: vaultwarden
        property: username
    - secretKey: adminToken
      remoteRef:
        key: vaultwarden
        property: adminToken
    - secretKey: clientId
      remoteRef:
        key: vaultwarden
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: vaultwarden
        property: clientSecret
    - secretKey: smtp_from
      remoteRef:
        key: vaultwarden
        property: smtp_from
    - secretKey: smtp_host
      remoteRef:
        key: vaultwarden
        property: smtp_host
    - secretKey: smtp_password
      remoteRef:
        key: vaultwarden
        property: smtp_password
    - secretKey: smtp_port
      remoteRef:
        key: vaultwarden
        property: smtp_port
    - secretKey: smtp_username
      remoteRef:
        key: vaultwarden
        property: smtp_username
