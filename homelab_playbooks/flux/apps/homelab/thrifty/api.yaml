---
# Migrated verbatim from 31-thrifty.yaml (tasks: "Deploy API", "Create API service").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: thrifty
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: tiehfood/thrifty-api:latest
          env:
            - name: SQLITE_DB_PATH
              value: /data/thrifty.sqlite
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thrifty-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: thrifty
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
