---
# Migrated verbatim from 37-ilo-exporter.yaml, task "Deploy ExternalSecret".
# Produces Secret `ilo-exporter-secret` in namespace monitoring, consumed by the
# Deployment via secretKeyRef. vault_kv_path -> ilo
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ilo-exporter-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ilo-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ilo
        property: ilo_api_password
    - secretKey: username
      remoteRef:
        key: ilo
        property: ilo_api_username
