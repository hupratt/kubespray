---
# Migrated from 11-uptimekuma.yaml, tasks "Deploy ExternalSecret" + "Annotate
# uptime-kuma-secret secret declaratively". Produces Secret `uptime-kuma-secret`
# in namespace monitoring. The replicator.v1.mittwald.de/replicate-to annotation
# (kubernetes-replicator, fans the secret out to the `mariadb` namespace so the
# MariaDB operator can read the DB password) is set on the target Secret via the
# ESO target template. vault_kv_path -> monitoring
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: uptime-kuma-secret
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          replicator.v1.mittwald.de/replicate-to: "mariadb"
  data:
    - secretKey: UPTIME_KUMA_DB_HOSTNAME
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_HOSTNAME
    - secretKey: UPTIME_KUMA_DB_NAME
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_NAME
    - secretKey: UPTIME_KUMA_DB_PASSWORD
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_PASSWORD
    - secretKey: UPTIME_KUMA_DB_PORT
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_PORT
    - secretKey: UPTIME_KUMA_DB_TYPE
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_TYPE
    - secretKey: UPTIME_KUMA_DB_USERNAME
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_DB_USERNAME
    - secretKey: UPTIME_KUMA_WEB_PASSWORD
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_WEB_PASSWORD
    - secretKey: UPTIME_KUMA_WEB_USERNAME
      remoteRef:
        key: monitoring
        property: UPTIME_KUMA_WEB_USERNAME
