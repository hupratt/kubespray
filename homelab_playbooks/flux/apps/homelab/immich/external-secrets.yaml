---
# Migrated from the ExternalSecret tasks in 47-immich-install.yaml.
# Reproduced verbatim (Ansible {{ '{{' }} .x {{ '}}' }} escaping resolved to the
# literal ESO Go-templates the tasks produced). The `{{ immich_namespace }}` var
# is inlined to `immich`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: "postgresql://{{ .username }}:{{ .password }}@immich-pg-rw.immich.svc/{{ .name }}"
  data:
    - secretKey: username
      remoteRef:
        key: immich
        property: username
    - secretKey: password
      remoteRef:
        key: immich
        property: password
    - secretKey: name
      remoteRef:
        key: immich
        property: name
---
# From "Deploy ExternalSecret for Immich application secrets" in 47-immich-install.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-app-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-app-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DB_DATABASE_NAME: "{{ .name }}"
  data:
    - secretKey: username
      remoteRef:
        key: immich
        property: username
    - secretKey: password
      remoteRef:
        key: immich
        property: password
    - secretKey: name
      remoteRef:
        key: immich
        property: name
