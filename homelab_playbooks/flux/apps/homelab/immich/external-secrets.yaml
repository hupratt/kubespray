  name: superuser-vault-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: superuser-vault-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
