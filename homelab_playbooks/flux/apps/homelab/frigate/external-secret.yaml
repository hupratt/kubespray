---
# Migrated from 33-frigate.yaml (task: "Deploy ExternalSecret" -> frigate-vault-secrets).
# vault_kv_path "frigate" inlined into every remoteRef.key.
#
# The source playbook then built a `frigate-config` ConfigMap that embedded the
# Vault MQTT creds + ffmpeg RTSP path (secret material) as the Frigate config.
# A plaintext ConfigMap cannot carry secrets, so instead this ExternalSecret
# renders the full Frigate `config.yml` from the Vault-fetched values via
# target.template (mergePolicy Merge keeps the raw keys too). The chart's
# Deployment currently mounts a *ConfigMap* named `frigate-config` at
# /config/config.yml — it must be repointed to this Secret's `config.yml` key.
# See BLOCKERS in the migration report.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-vault-secrets
  namespace: frigate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: frigate-vault-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        config.yml: |
          auth:
            enabled: false
          mqtt:
            enabled: true
            host: "{{ .frigate_mqtt_host }}"
            user: "{{ .frigate_mqtt_user }}"
            password: "{{ .frigate_mqtt_password }}"
          cameras:
            reolink:
              detect:
                enabled: true
                height: 480
                width: 704
                fps: 5
              objects:
                track:
                  - person
                  - car
              ffmpeg:
                inputs:
                  - path: "{{ .ffmpeg_path }}"
                    roles:
                      - detect
                      - record
              mqtt:
                enabled: true
                timestamp: true
                bounding_box: true
                crop: false
                height: 270
                quality: 70
          record:
            enabled: true
            continuous:
              days: 2
            motion:
              days: 2
            alerts:
              retain:
                days: 2
                mode: all
            detections:
              retain:
                days: 2
                mode: all
  data:
    - secretKey: frigate_rtsp_password
      remoteRef:
        key: frigate
        property: frigate_rtsp_password
    - secretKey: frigate_mqtt_host
      remoteRef:
        key: frigate
        property: frigate_mqtt_host
    - secretKey: frigate_mqtt_user
      remoteRef:
        key: frigate
        property: frigate_mqtt_user
    - secretKey: frigate_mqtt_password
      remoteRef:
        key: frigate
        property: frigate_mqtt_password
    - secretKey: ffmpeg_path
      remoteRef:
        key: frigate
        property: ffmpeg_path
---
# Migrated verbatim from 33-frigate.yaml (second "Deploy ExternalSecret" -> frigate-secret).
# Produces the Secret the Helm chart references via rtspPassword.existingSecret.
# This SUPERSEDES the playbook's imperative "Create Frigate RTSP secret" task
# (which wrote FRIGATE_RTSP_PASSWORD as a plaintext Secret) — not migrated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-secret
  namespace: frigate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: frigate-secret
    creationPolicy: Owner
  data:
    - secretKey: FRIGATE_RTSP_PASSWORD
      remoteRef:
        key: frigate
        property: frigate_rtsp_password
