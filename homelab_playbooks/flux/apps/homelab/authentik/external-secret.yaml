---
# Migrated from the "ExternalSecret for backup credentials" task in 23-authentik.yaml
# (vault_kv_path: authentik). Produces the Secret authentik-vault-secrets in
# namespace authentik, whose keys are injected into the HelmRelease via valuesFrom.
#
# NOTE: the original ExternalSecret did NOT include a `hostname` property, yet
# charts/authentik/values.yaml.j2 references `...data.hostname` for the server
# ingress host. The `hostname` entry below is added so the ingress host can be
# populated (Vault key `authentik` must expose a `hostname` property). See the
# migration BLOCKERS note.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-vault-secrets
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-vault-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: pg_username
      remoteRef:
        key: authentik
        property: pg_username
    - secretKey: pg_password
      remoteRef:
        key: authentik
        property: pg_password
    - secretKey: postgresql_port
      remoteRef:
        key: authentik
        property: postgresql_port
    - secretKey: postgresql_dbname
      remoteRef:
        key: authentik
        property: postgresql_dbname
    - secretKey: postgresql_host
      remoteRef:
        key: authentik
        property: postgresql_host
    - secretKey: error_reporting_enabled
      remoteRef:
        key: authentik
        property: error_reporting_enabled
    - secretKey: secret_key
      remoteRef:
        key: authentik
        property: secret_key
    - secretKey: smtp_host
      remoteRef:
        key: authentik
        property: smtp_host
    - secretKey: smtp_port
      remoteRef:
        key: authentik
        property: smtp_port
    - secretKey: smtp_username
      remoteRef:
        key: authentik
        property: smtp_username
    - secretKey: smtp_password
      remoteRef:
        key: authentik
        property: smtp_password
    - secretKey: smtp_use_tls
      remoteRef:
        key: authentik
        property: smtp_use_tls
    - secretKey: smtp_use_ssl
      remoteRef:
        key: authentik
        property: smtp_use_ssl
    - secretKey: smtp_timeout
      remoteRef:
        key: authentik
        property: smtp_timeout
    - secretKey: smtp_from
      remoteRef:
        key: authentik
        property: smtp_from
    # Added: required by the values template but absent from the original playbook.
    - secretKey: hostname
      remoteRef:
        key: authentik
        property: hostname
