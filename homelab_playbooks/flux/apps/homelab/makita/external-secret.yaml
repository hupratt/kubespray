---
# Migrated verbatim from 29-makita.yaml (task: "Deploy ExternalSecret").
# vault_kv_path "makita-booking" inlined into every remoteRef.key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: makita-backend-env
  namespace: makita
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: makita-backend-env
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: makita-booking
        property: DJANGO_SECRET_KEY
    - secretKey: DJANGO_DEBUG
      remoteRef:
        key: makita-booking
        property: DJANGO_DEBUG
    - secretKey: DJANGO_ALLOWED_HOSTS
      remoteRef:
        key: makita-booking
        property: DJANGO_ALLOWED_HOSTS
    - secretKey: enginedb
      remoteRef:
        key: makita-booking
        property: enginedb
    - secretKey: hostip
      remoteRef:
        key: makita-booking
        property: hostip
    - secretKey: pnumber
      remoteRef:
        key: makita-booking
        property: pnumber
    - secretKey: dbuser
      remoteRef:
        key: makita-booking
        property: dbuser
    - secretKey: dbpassword
      remoteRef:
        key: makita-booking
        property: dbpassword
    - secretKey: DJANGO_DEVELOPMENT
      remoteRef:
        key: makita-booking
        property: DJANGO_DEVELOPMENT
    - secretKey: REACT_APP_BASE
      remoteRef:
        key: makita-booking
        property: REACT_APP_BASE
    - secretKey: DJANGO_SETTINGS_MODULE
      remoteRef:
        key: makita-booking
        property: DJANGO_SETTINGS_MODULE
    - secretKey: DEEPL_API_KEY
      remoteRef:
        key: makita-booking
        property: DEEPL_API_KEY
    - secretKey: POSTHOG_DOMAIN
      remoteRef:
        key: makita-booking
        property: POSTHOG_DOMAIN
    - secretKey: POSTHOG_KEY
      remoteRef:
        key: makita-booking
        property: POSTHOG_KEY
    - secretKey: ENVIRONMENT
      remoteRef:
        key: makita-booking
        property: ENVIRONMENT
    - secretKey: MAPTILER_JSON
      remoteRef:
        key: makita-booking
        property: MAPTILER_JSON
    - secretKey: WHITENOISE
      remoteRef:
        key: makita-booking
        property: WHITENOISE
