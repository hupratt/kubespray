---
# Migrated verbatim from 29-makita.yaml (task: "Create rook-cephfs StorageClass").
# Cluster-scoped; apiVersion/kind supplied here (were Ansible module args).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-makita
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: myfs
  pool: myfs-data0
  subvolumeGroup: csi
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  monitors: ceph-mon.rook-ceph.svc.cluster.local
  mounter: fuse
mountOptions:
  - debug
reclaimPolicy: Retain
allowVolumeExpansion: true
