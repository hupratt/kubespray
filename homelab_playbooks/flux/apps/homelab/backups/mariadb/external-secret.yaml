---
# Migrated from 16-backup-mariadb.yaml
#   task: "Deploy ExternalSecret" (S3/restic credentials)
# Vault KV key/property names preserved exactly (vault_kv_path "restic").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: mariadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
---
# NOT in the original playbook as an ExternalSecret: the CronJob's
# MARIADB_BACKUP_USER / MARIADB_BACKUP_PASS were Ansible-templated from
# `backup_secret.DB_USERNAME` / `backup_secret.DB_PASSWORD` — i.e. the same
# Vault KV "mariadb" DB_USERNAME/DB_PASSWORD that 13-backupuser reads. Mapped
# exactly here so the creds stay out of Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-backup-credentials
  namespace: mariadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: mariadb
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: mariadb
        property: DB_PASSWORD
