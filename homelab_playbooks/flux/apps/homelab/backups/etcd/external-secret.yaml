---
# Migrated from 34-backup-etcd.yaml
#   task: "Deploy ExternalSecret"
# Vault KV key/property names preserved exactly (vault_kv_path "etcd").
# The CronJob consumes this via envFrom (AWS_* used by the aws cli; the cert
# properties are also present here as in the original, but the certs are actually
# mounted from the etcd-client-certs Secret below).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-s3-credentials
  namespace: etcd-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: etcd-backup-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: etcd
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: etcd
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: vault_etcd_ca_crt
      remoteRef:
        key: etcd
        property: vault_etcd_ca_crt
    - secretKey: vault_etcd_client_crt
      remoteRef:
        key: etcd
        property: vault_etcd_client_crt
    - secretKey: vault_etcd_client_key
      remoteRef:
        key: etcd
        property: vault_etcd_client_key
---
# Replaces the imperative "Read secret" + "Create etcd client secret (certs)"
# tasks in 34-backup-etcd.yaml, which read the ExternalSecret-produced Secret and
# hand-built a second Secret named etcd-client-certs with keys ca.crt/client.crt/
# client.key. Expressed here directly as an ExternalSecret pulling the same three
# Vault "etcd" properties and templating them into those key names. This Secret
# is mounted by the CronJob's `etcd-certs` volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-client-certs
  namespace: etcd-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: etcd-client-certs
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: etcd
        property: vault_etcd_ca_crt
    - secretKey: client.crt
      remoteRef:
        key: etcd
        property: vault_etcd_client_crt
    - secretKey: client.key
      remoteRef:
        key: etcd
        property: vault_etcd_client_key
