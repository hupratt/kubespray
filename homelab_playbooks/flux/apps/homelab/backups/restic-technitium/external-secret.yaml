---
# ExternalSecret for the restic S3/repo credentials consumed by the CronJob in
# 45c-restic-technitium.yaml. The playbook itself defined no ExternalSecret (it
# only referenced the k8s Secret `technitium-secret` via envFrom); this manifest
# reconstructs it following the same vault-backend pattern as the other restic
# playbooks (KV key `restic`). See BLOCKERS: confirm the Vault KV path/property
# names for the technitium restic repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-secret
  namespace: technitium
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: technitium-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: restic
        property: RESTIC_REPOSITORY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic
        property: RESTIC_PASSWORD
