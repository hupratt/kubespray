---
# Migrated from 13-backupuser.yaml
#   task: "Create MariaDB User for the backup user"
# Consumes the `backupsecret` Secret that the ExternalSecret in this dir
# replicates into the mariadb namespace (mittwald replicate-to: mariadb).
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: fedora-backup-user
  namespace: mariadb
spec:
  host: "%"
  mariaDbRef:
    name: mariadb
    namespace: mariadb
  passwordSecretKeyRef:
    name: backupsecret
    key: DB_PASSWORD
  maxUserConnections: 20
---
# Migrated from 13-backupuser.yaml
#   task: "Grant SELECT and LOCK TABLES to backup user"
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: backup-read-lock-perms
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  username: fedora-backup-user
  privileges:
    - SELECT
    - LOCK TABLES
    - EXECUTE
    - SHOW VIEW
  database: "*"
  table: "*"
