---
# Migrated from 13-backupuser.yaml
#   tasks: "Deploy ExternalSecret" + "Annotate backupsecret secret declaratively"
#
# The Ansible flow created the ExternalSecret then separately patched the
# generated Secret with the mittwald replicator annotation so the creds are
# copied into the mariadb namespace (where the MariaDB User below consumes
# them). Both are expressed here on the single ExternalSecret: the annotation is
# set via target.template.metadata.annotations so the produced Secret carries it.
#
# Vault KV key/property names preserved exactly (key "mariadb").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backupsecret
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backupsecret
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          replicator.v1.mittwald.de/replicate-to: "mariadb"
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: mariadb
        property: DB_PASSWORD
    - secretKey: DB_USERNAME
      remoteRef:
        key: mariadb
        property: DB_USERNAME
