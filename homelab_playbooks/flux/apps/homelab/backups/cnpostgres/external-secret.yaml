---
# Migrated from 15-backup-cnpostgres.yaml
#   task: "Deploy ExternalSecret" (S3/restic credentials)
# Vault KV key/property names preserved exactly (vault_kv_path "restic").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: cn-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
---
# NOT in the original playbook as an ExternalSecret: the pgdump CronJob's
# PGHOST / PGUSER / PGPASSWORD were injected by Ansible from the ansible-vault
# vars POSTGRES_HOST / POSTGRES_BACKUP_USER / POSTGRES_BACKUP_PASSWORD. Per the
# no-plaintext-in-Git rule these are externalised here instead of being inlined.
# BLOCKER: the Vault KV path/properties below are an ASSUMPTION (ansible-vault !=
# Hashicorp Vault KV). Adjust key/property to the real KV layout before use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-backup-credentials
  namespace: cn-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pg-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: PGHOST
      remoteRef:
        key: postgres-backup
        property: POSTGRES_HOST
    - secretKey: PGUSER
      remoteRef:
        key: postgres-backup
        property: POSTGRES_BACKUP_USER
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-backup
        property: POSTGRES_BACKUP_PASSWORD
