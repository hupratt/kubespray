---
# Source: 53-backup-matrix.yaml — task "Deploy ExternalSecret"
# Vault KV key `backup-matrix` (vault_kv_path), namespace `backup`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backupmatrix-secrets
  namespace: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backupmatrix-secrets
    creationPolicy: Owner
  data:
    - secretKey: ALLOWED_HOSTS
      remoteRef:
        key: backup-matrix
        property: ALLOWED_HOSTS
    - secretKey: DEBUG
      remoteRef:
        key: backup-matrix
        property: DEBUG
    - secretKey: POSTGRES_DB
      remoteRef:
        key: backup-matrix
        property: POSTGRES_DB
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: backup-matrix
        property: POSTGRES_HOST
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backup-matrix
        property: pg_password
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: backup-matrix
        property: POSTGRES_PORT
    - secretKey: POSTGRES_USER
      remoteRef:
        key: backup-matrix
        property: pg_username
    - secretKey: SECRET_KEY
      remoteRef:
        key: backup-matrix
        property: SECRET_KEY
