---
# Source: 53-backup-matrix.yaml — task "Create HAProxy ingress"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backupmatrix
  namespace: backup
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - backup-matrix.thekor.eu
      secretName: wildcard-thekor
  rules:
    - host: backup-matrix.thekor.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backupmatrix-web
                port:
                  number: 8000
          - path: /screenshot/
            pathType: Prefix
            backend:
              service:
                name: backupmatrix-screenshot
                port:
                  number: 3000
