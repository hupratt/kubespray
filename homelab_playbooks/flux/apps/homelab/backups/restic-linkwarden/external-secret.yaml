---
# Migrated verbatim from the "Deploy ExternalSecret for the linkwarden namespace"
# task in 41-restic-linkwarden.yaml.
# Ansible vars inlined: external_secret_name -> linkwarden-secrets,
# external_secret_namespace -> linkwarden, vault_kv_path -> restic.
# NOTE: distinct from the app's linkwarden-secret (see apps/homelab/linkwarden).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-secrets
  namespace: linkwarden
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: linkwarden-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: restic
        property: RESTIC_REPOSITORY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic
        property: RESTIC_PASSWORD
