---
# Migrated from 16-backup-ceph.yaml
#   task: "Deploy ExternalSecret" (S3/restic credentials)
# Vault KV key/property names preserved exactly (vault_kv_path "restic").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: rook-ceph
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
