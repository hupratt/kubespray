---
# Migrated from 16-backup-mongo.yaml
#   task: "Deploy ExternalSecret" (S3/restic credentials)
# Vault KV key/property names preserved exactly (vault_kv_path "restic").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
---
# NOT in the original playbook as an ExternalSecret: the CronJob's MONGO_USER /
# MONGO_PASSWORD were Ansible-templated from ansible-vault vars
# mongo_backup_user / mongo_backup_password. Externalised here to keep them out
# of Git.
# BLOCKER: Vault KV path/properties below are an ASSUMPTION. Adjust to the real
# KV layout before use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-backup-credentials
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mongo-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: mongodb-backup
        property: mongo_backup_user
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: mongodb-backup
        property: mongo_backup_password
