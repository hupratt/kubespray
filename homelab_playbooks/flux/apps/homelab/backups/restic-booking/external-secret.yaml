---
# Migrated verbatim from the "Deploy ExternalSecret for the booking namespace"
# task in 43-restic-booking.yaml.
# Ansible vars inlined: external_secret_name -> booking-secrets,
# external_secret_namespace -> booking, vault_kv_path -> restic.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-secrets
  namespace: booking
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: booking-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: restic
        property: RESTIC_REPOSITORY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic
        property: RESTIC_PASSWORD
