---
# Migrated verbatim from the two "Deploy ExternalSecret" tasks in 14-harbor.yaml
# (vault_kv_path: harbor). ESO reconciles these against the vault-backend
# ClusterSecretStore and produces the in-cluster Secrets consumed by the
# HelmRelease valuesFrom and by the chart's externalDatabase.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-vault-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: harbor
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: harbor
        property: clientSecret
    - secretKey: core_database
      remoteRef:
        key: harbor
        property: core_database
    - secretKey: host
      remoteRef:
        key: harbor
        property: host
    - secretKey: notary_server_database
      remoteRef:
        key: harbor
        property: notary_server_database
    - secretKey: notary_signer_database
      remoteRef:
        key: harbor
        property: notary_signer_database
    - secretKey: password
      remoteRef:
        key: harbor
        property: password
    - secretKey: pg_port
      remoteRef:
        key: harbor
        property: pg_port
    - secretKey: registry_htpasswd
      remoteRef:
        key: harbor
        property: registry_htpasswd
    - secretKey: registry_password
      remoteRef:
        key: harbor
        property: registry_password
    - secretKey: sslmode
      remoteRef:
        key: harbor
        property: sslmode
    - secretKey: trivy_database
      remoteRef:
        key: harbor
        property: trivy_database
    - secretKey: username
      remoteRef:
        key: harbor
        property: username
    - secretKey: admin_password
      remoteRef:
        key: harbor
        property: admin_password
---
# Second ExternalSecret from 14-harbor.yaml. The Harbor chart's
# database.external.existingSecret points at this Secret for the DB password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-secret
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: harbor
        property: password
