---
# Migrated verbatim from "Create ExternalSecret to Sync Vault Keys to K8s Secret"
# in 56-netbird.yml. Produces the `netbird` Secret consumed by the chart's
# envFromSecret mappings (e.g. netbird/postgresDSN). vault_kv_path -> netbird.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird
  namespace: netbird
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbird
    creationPolicy: Owner
  data:
    - secretKey: postgresDSN
      remoteRef:
        key: netbird
        property: postgresDSN
    - secretKey: turnServerPassword
      remoteRef:
        key: netbird
        property: turnServerPassword
    - secretKey: relayPassword
      remoteRef:
        key: netbird
        property: relayPassword
    - secretKey: datastoreEncryptionKey
      remoteRef:
        key: netbird
        property: datastoreEncryptionKey
    - secretKey: idpClientID
      remoteRef:
        key: netbird
        property: idpClientID
    - secretKey: idpServiceAccountUser
      remoteRef:
        key: netbird
        property: idpServiceAccountUser
    - secretKey: idpServiceAccountPassword
      remoteRef:
        key: netbird
        property: idpServiceAccountPassword
    - secretKey: idpClientSecret
      remoteRef:
        key: netbird
        property: idpClientSecret
    - secretKey: activityStoreEngine
      remoteRef:
        key: netbird
        property: activityStoreEngine
    - secretKey: activityPostgresDSN
      remoteRef:
        key: netbird
        property: activityPostgresDSN
