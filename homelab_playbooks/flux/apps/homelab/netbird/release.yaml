---
# Migrated from the Helm tasks in 56-netbird.yml. External Helm repo
# (netbirdio/netbird), chart version 1.9.0 pinned. The values below are the
# rendered output of charts/netbird/values.yaml.j2 with the playbook vars
# resolved (domain thekor.eu, haproxy_ingress_flavor haproxytech -> haproxy.org
# annotations, cert issuer letsencrypt-prod, postgres store engine, authentik
# IdP at auth.thekor.eu). The `{{ .VAR }}` tokens inside management.configmap are
# LITERAL placeholders that the netbird management binary substitutes at runtime
# from its env (envFromSecret -> the `netbird` Secret); they are NOT Helm/Flux
# templating.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbirdio
  namespace: netbird
spec:
  interval: 1h
  url: https://netbirdio.github.io/helms
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
  namespace: netbird
spec:
  releaseName: netbird
  interval: 30m
  chart:
    spec:
      chart: netbird
      version: "1.9.0"
      sourceRef:
        kind: HelmRepository
        name: netbirdio
        namespace: netbird
      interval: 1h
  install:
    createNamespace: false
  values:
    fullnameOverride: netbird
    management:
      configmap: |-
        {
          "Stuns": [
            {
              "Proto": "udp",
              "URI": "stun:stun.thekor.eu:3478",
              "Username": "",
              "Password": ""
            }
          ],
          "TURNConfig": {
            "TimeBasedCredentials": true,
            "CredentialsTTL": "24h0m0s",
            "Secret": "{{ .TURN_SECRET }}",
            "Turns": [
              {
                "Proto": "udp",
                "URI": "turn:stun.thekor.eu:3478",
                "Username": "",
                "Password": ""
              }
            ]
          },
          "Relay": {
            "Addresses": ["rels://netbird.thekor.eu:443/relay"],
            "CredentialsTTL": "24h",
            "Secret": "{{ .RELAY_PASSWORD }}"
          },
          "Signal": {
            "Proto": "https",
            "URI": "netbird.thekor.eu:443",
            "Username": "",
            "Password": ""
          },
          "Datadir": "/var/lib/netbird/",
          "DataStoreEncryptionKey": "{{ .DATASTORE_ENCRYPTION_KEY }}",
          "HttpConfig": {
            "LetsEncryptDomain": "",
            "CertFile": "",
            "CertKey": "",
            "AuthAudience": "{{ .IDP_CLIENT_ID }}",
            "AuthIssuer": "https://auth.thekor.eu/application/o/netbird/",
            "AuthUserIDClaim": "",
            "AuthKeysLocation": "https://auth.thekor.eu/application/o/netbird/jwks/",
            "OIDCConfigEndpoint": "https://auth.thekor.eu/application/o/netbird/.well-known/openid-configuration",
            "IdpSignKeyRefreshEnabled": false
          },
          "IdpManagerConfig": {
            "ManagerType": "authentik",
            "ClientConfig": {
              "Issuer": "https://auth.thekor.eu/application/o/netbird",
              "TokenEndpoint": "https://auth.thekor.eu/application/o/token/",
              "ClientID": "{{ .IDP_CLIENT_ID }}",
              "ClientSecret": "{{ .IDP_CLIENT_SECRET }}",
              "GrantType": "client_credentials"
            },
            "ExtraConfig": {
              "Username": "{{ .IDP_SERVICE_ACCOUNT_USER }}",
              "Password": "{{ .IDP_SERVICE_ACCOUNT_PASSWORD }}"
            },
            "Auth0ClientCredentials": null,
            "AzureClientCredentials": null,
            "KeycloakClientCredentials": null,
            "ZitadelClientCredentials": null
          },
          "DeviceAuthorizationFlow": {
            "Provider": "hosted",
            "ProviderConfig": {
              "ClientID": "{{ .IDP_CLIENT_ID }}",
              "ClientSecret": "{{ .IDP_CLIENT_SECRET }}",
              "Domain": "https://auth.thekor.eu/application/o/netbird",
              "Audience": "{{ .IDP_CLIENT_ID }}",
              "TokenEndpoint": "https://auth.thekor.eu/application/o/token/",
              "DeviceAuthEndpoint": "https://auth.thekor.eu/application/o/device/",
              "AuthorizationEndpoint": "",
              "Scope": "openid",
              "UseIDToken": false,
              "RedirectURLs": null
            }
          },
          "PKCEAuthorizationFlow": {
            "ProviderConfig": {
              "ClientID": "{{ .IDP_CLIENT_ID }}",
              "ClientSecret": "",
              "Domain": "",
              "Audience": "{{ .IDP_CLIENT_ID }}",
              "TokenEndpoint": "https://auth.thekor.eu/application/o/token/",
              "DeviceAuthEndpoint": "",
              "AuthorizationEndpoint": "https://auth.thekor.eu/application/o/authorize/",
              "Scope": "openid profile email offline_access api",
              "UseIDToken": false,
              "RedirectURLs": ["http://localhost:53000"]
            }
          },
          "StoreConfig": {
            "Engine": "postgres"
          },
          "ReverseProxy": {
            "TrustedHTTPProxies": null,
            "TrustedHTTPProxiesCount": 0,
            "TrustedPeers": null
          }
        }
      persistentVolume:
        enabled: false
      envFromSecret:
        NETBIRD_STORE_ENGINE_POSTGRES_DSN: netbird/postgresDSN
        TURN_SECRET: netbird/turnServerPassword
        RELAY_PASSWORD: netbird/relayPassword
        IDP_CLIENT_ID: netbird/idpClientID
        IDP_CLIENT_SECRET: netbird/idpClientSecret
        IDP_SERVICE_ACCOUNT_USER: netbird/idpServiceAccountUser
        IDP_SERVICE_ACCOUNT_PASSWORD: netbird/idpServiceAccountPassword
        DATASTORE_ENCRYPTION_KEY: netbird/datastoreEncryptionKey
      useBackwardsGrpcService: true
      ingress:
        enabled: true
        className: haproxy
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          haproxy.org/ssl-redirect: "true"
        hosts:
          - host: netbird.thekor.eu
            paths:
              - path: /api
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-api-tls
            hosts:
              - netbird.thekor.eu
      ingressGrpc:
        enabled: true
        className: haproxy
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          haproxy.org/server-proto: "h2"
          haproxy.org/ssl-redirect: "true"
          haproxy.org/timeout-tunnel: "3600s"
        hosts:
          - host: netbird.thekor.eu
            paths:
              - path: /management.ManagementService
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-grpc-tls
            hosts:
              - netbird.thekor.eu
    signal:
      ingress:
        enabled: true
        className: haproxy
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          haproxy.org/server-proto: "h2"
          haproxy.org/ssl-redirect: "true"
          haproxy.org/timeout-tunnel: "3600s"
        hosts:
          - host: netbird.thekor.eu
            paths:
              - path: /signalexchange.SignalExchange
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-signal-tls
            hosts:
              - netbird.thekor.eu
    relay:
      envFromSecret:
        NB_AUTH_SECRET: netbird/relayPassword
      env:
        NB_LOG_LEVEL: info
        NB_LISTEN_ADDRESS: ":33080"
        NB_EXPOSED_ADDRESS: "rels://netbird.thekor.eu:443/relay"
      ingress:
        enabled: true
        className: haproxy
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          haproxy.org/ssl-redirect: "true"
        hosts:
          - host: netbird.thekor.eu
            paths:
              - path: /relay
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-relay-tls
            hosts:
              - netbird.thekor.eu
    dashboard:
      enabled: true
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 20
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      env:
        NETBIRD_MGMT_API_ENDPOINT: "https://netbird.thekor.eu:443"
        NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird.thekor.eu:443"
        AUTH_AUTHORITY: "https://auth.thekor.eu/application/o/netbird/"
        USE_AUTH0: "false"
        AUTH_SUPPORTED_SCOPES: "openid profile email offline_access api"
        AUTH_REDIRECT_URI: "/oauth2/callback"
        AUTH_SILENT_REDIRECT_URI: ""
        NETBIRD_TOKEN_SOURCE: accessToken
        NGINX_SSL_PORT: ""
        LETSENCRYPT_DOMAIN: ""
        LETSENCRYPT_EMAIL: ""
      envFromSecret:
        AUTH_CLIENT_ID: netbird/idpClientID
        AUTH_AUDIENCE: netbird/idpClientID
        AUTH_CLIENT_SECRET: netbird/idpClientSecret
      ingress:
        enabled: true
        className: haproxy
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          haproxy.org/ssl-redirect: "true"
        hosts:
          - host: netbird.thekor.eu
            paths:
              - path: /
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-dashboard-tls
            hosts:
              - netbird.thekor.eu
