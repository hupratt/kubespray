---
# Migrated verbatim from 44-patchmon.yaml (task: "Deploy ExternalSecret for PatchMon DB").
# vault_kv_path "patchmon" inlined into remoteRef.key. Consumed by the chart via
# database.auth.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patchmon-db-secret
  namespace: patchmon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: patchmon-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: patchmon
        property: pg_password
---
# Migrated verbatim from 44-patchmon.yaml (task: "Deploy ExternalSecret for PatchMon Redis").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patchmon-redis-secret
  namespace: patchmon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: patchmon-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: patchmon
        property: redis-password
---
# Migrated from 44-patchmon.yaml (task: "Deploy ExternalSecret for PatchMon server").
# The extra `oidc-client-id` entry is added on top of the source (jwt/ai/client-secret)
# so the HelmRelease can inject server.oidc.clientId (which the values.yaml.j2 templated
# from the Vault var `vault_patchmon_oidc_client_id`) without plaintext.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patchmon-server-secret
  namespace: patchmon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: patchmon-server-secret
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: patchmon
        property: jwt-secret
    - secretKey: ai-encryption-key
      remoteRef:
        key: patchmon
        property: ai-encryption-key
    - secretKey: client-secret
      remoteRef:
        key: patchmon
        property: oidc-client-secret
    - secretKey: oidc-client-id
      remoteRef:
        key: patchmon
        property: oidc-client-id
