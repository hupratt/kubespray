---
# Migrated verbatim from "Create ExternalSecret for app .env" in 48-youtube-clone.yaml.
# Ansible {{ '{{' }} .X {{ '}}' }} escaping resolved to the literal ESO Go-template
# strings. Vault vars inlined: vault_kv_mount -> youtube, vault_kv_ubuntu_mount ->
# makita-booking.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtubeclone-env
  namespace: youtube
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: youtubeclone-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_USR: "{{ .DATABASE_USR }}"
        DATABASE_PW: "{{ .DATABASE_PW }}"
        DATABASE_HST: shared-pg-rw.cn-postgres.svc
        DATABASE_URL: "postgresql://{{ .DATABASE_USR }}:{{ .DATABASE_PW }}@shared-pg-rw.cn-postgres.svc/{{ .DATABASE_NM }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        JWT_EXPIRE: 30d
        FILE_UPLOAD_PATH: public/uploads/
        FILE_SIZE: "0"
        USER_ID_PROD: 972892ce-59ac-44b0-9922-62d2eb8ce961
        USER_ID: 5adc6932-3029-4c85-9db8-9124c89652e6
        PORT: "3000"
  data:
    - secretKey: DATABASE_USR
      remoteRef:
        key: makita-booking
        property: pg_username
    - secretKey: DATABASE_PW
      remoteRef:
        key: makita-booking
        property: pg_password
    - secretKey: DATABASE_NM
      remoteRef:
        key: youtube
        property: DATABASE_NM
    - secretKey: JWT_SECRET
      remoteRef:
        key: youtube
        property: JWT_SECRET
