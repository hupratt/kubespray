---
# Source: 54-matrix.yaml — tasks "Add ananace Helm repo" + "Deploy Synapse"
# External Helm chart (ananace-charts/matrix-synapse). Non-secret values are
# inline; secrets are consumed by name from the ESO-managed `synapse-secret`
# (chart uses existingSecret, so no valuesFrom is required).
#
# CHANGED vs the Ansible values: the mautrix-whatsapp registration is now mounted
# from a Secret (it embeds appservice tokens — see mautrix-whatsapp-secrets.yaml)
# instead of a ConfigMap. The mautrix-signal registration ConfigMap is produced
# by the signal chart itself (see BLOCKERS re: its actual object name).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  releaseName: matrix-synapse
  interval: 30m
  chart:
    spec:
      chart: matrix-synapse
      version: "3.12.28"
      sourceRef:
        kind: HelmRepository
        name: ananace-charts
        namespace: matrix
      interval: 1h
  install:
    createNamespace: false
  timeout: 10m
  values:
    serverName: matrix.thekor.eu
    publicServerName: matrix.thekor.eu
    image:
      repository: ghcr.io/element-hq/synapse
      pullPolicy: IfNotPresent
    config:
      reportStats: false
      enableRegistration: false
      allowGuestAccess: false
    extraConfig:
      experimental_features:
        msc3202_transaction_extensions: true
      max_upload_size: "50M"
      suppress_key_server_warning: true
      media_retention:
        remote_media_lifetime: 30d
      app_service_config_files:
        - /synapse/config/conf.d/mautrix-discord.yaml
        - /synapse/config/conf.d/mautrix-signal.yaml
        - /synapse/config/conf.d/mautrix-whatsapp.yaml
      # Allow Synapse to connect back to bridge pods (default blacklist blocks RFC1918)
      ip_range_whitelist:
        - "10.233.0.0/16"
        - "127.0.0.1/8"
      ip_range_blacklist: []
      federation_ip_range_blacklist: []
    synapse:
      extraVolumes:
        - name: mautrix-discord-registration
          secret:
            secretName: mautrix-discord-registration
            items:
              - key: registration.yaml
                path: mautrix-discord.yaml
        - name: mautrix-signal-registration
          secret:
            secretName: mautrix-signal-registration
            items:
              - key: appservice-registration-signal.yaml
                path: mautrix-signal.yaml
        - name: mautrix-whatsapp-registration
          secret:
            secretName: mautrix-whatsapp-registration
            items:
              - key: whatsapp-registration.yaml
                path: mautrix-whatsapp.yaml
      extraVolumeMounts:
        - name: mautrix-discord-registration
          mountPath: /synapse/config/conf.d/mautrix-discord.yaml
          subPath: mautrix-discord.yaml
          readOnly: true
        - name: mautrix-signal-registration
          mountPath: /synapse/config/conf.d/mautrix-signal.yaml
          subPath: mautrix-signal.yaml
          readOnly: true
        - name: mautrix-whatsapp-registration
          mountPath: /synapse/config/conf.d/mautrix-whatsapp.yaml
          subPath: mautrix-whatsapp.yaml
          readOnly: true
    # Disable bundled PostgreSQL — we use CNPG
    postgresql:
      enabled: false
    externalPostgresql:
      host: shared-pg-rw.cn-postgres.svc.cluster.local
      port: 5432
      username: synapse
      database: synapse
      existingSecret: synapse-secret
      existingSecretPasswordKey: db_password
    existingSecret: synapse-secret
    existingSecretKeys:
      registrationSharedSecret: registration_shared_secret
      macaroonSecretKey: macaroon_secret_key
    signingKey:
      job:
        enabled: true
    wellknown:
      enabled: true
      replicaCount: 1
    persistence:
      enabled: true
      storageClass: rook-ceph-block
      accessMode: ReadWriteOnce
      size: "20Gi"
    ingress:
      enabled: true
      className: haproxy
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        haproxy-ingress.github.io/proxy-body-size: "50M"
        haproxy-ingress.github.io/timeout-client: "300s"
        haproxy-ingress.github.io/timeout-server: "300s"
      tls:
        - secretName: synapse-tls
          hosts:
            - matrix.thekor.eu
    podSecurityContext:
      runAsUser: 991
      runAsGroup: 991
      fsGroup: 991
      runAsNonRoot: true
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
