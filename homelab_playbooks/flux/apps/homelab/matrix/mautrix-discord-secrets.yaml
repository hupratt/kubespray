---
# Source: 54-matrix.yaml — task "Create mautrix-discord appservice registration secret"
#         54b-matrix.yaml — task "Create mautrix-discord ConfigMap"
#
# Both objects embed appservice tokens (as_token/hs_token) and the Discord bot
# token, so they are produced by ESO from Vault (key `mautrixdiscord`) instead of
# living in Git. The config, originally a ConfigMap, is now a Secret so the
# secrets never touch a ConfigMap — the Deployment mounts it as a secret volume.
#
# NOTE: Vault key `mautrixdiscord` and its properties are the migrator's best
# guess (see BLOCKERS) — the source only referenced undefined Ansible vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-registration
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-discord-registration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        registration.yaml: |
          id: mautrix-discord
          url: http://mautrix-discord:29334
          as_token: {{ .as_token }}
          hs_token: {{ .hs_token }}
          sender_localpart: discordbot
          rate_limited: false
          namespaces:
            users:
              - exclusive: true
                regex: '@discord_.*:matrix.thekor.eu'
            aliases:
              - exclusive: true
                regex: '#discord_.*:matrix.thekor.eu'
  data:
    - secretKey: as_token
      remoteRef:
        key: mautrixdiscord
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: mautrixdiscord
        property: hs_token
---
# Source: 54b-matrix.yaml — task "Create mautrix-discord ConfigMap"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-config
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-discord-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          homeserver:
            address: http://matrix-synapse:8008
            domain: matrix.thekor.eu
            software: standard
            async_media: false
            # Disable websocket ping — bridge connects via HTTP, not websocket
            ping_interval_seconds: 0

          appservice:
            address: http://mautrix-discord:29334
            hostname: 0.0.0.0
            port: 29334
            id: mautrix-discord
            bot:
              username: discordbot
              displayname: Discord Bridge
            as_token: {{ .as_token }}
            hs_token: {{ .hs_token }}
            database:
              type: sqlite3-fk-wal
              uri: file:/data/mautrix-discord.db?_txlock=immediate

          bridge:
            username_template: "discord_{{ "{{  .}}" }}"
            command_prefix: "!discord"
            permissions:
              "*": relay
              "matrix.thekor.eu": user
              "@admin:matrix.thekor.eu": admin
            relay:
              enabled: false

          discord:
            bot: true
            token: {{ .bot_token }}

          logging:
            min_level: info
            writers:
              - type: stdout
                format: pretty-colored
  data:
    - secretKey: as_token
      remoteRef:
        key: mautrixdiscord
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: mautrixdiscord
        property: hs_token
    - secretKey: bot_token
      remoteRef:
        key: mautrixdiscord
        property: bot_token
