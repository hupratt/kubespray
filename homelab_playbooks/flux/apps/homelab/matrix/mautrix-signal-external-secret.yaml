---
# Source: 54c-matrix.yaml — task "Deploy ExternalSecret for bridge credentials"
# Migrated verbatim (vault_path_mautrix -> Vault KV key `mautrixsignal`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-signal-creds
  namespace: matrix
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-signal-creds
    creationPolicy: Owner
  data:
    - secretKey: asToken
      remoteRef:
        key: mautrixsignal
        property: as_token
    - secretKey: hsToken
      remoteRef:
        key: mautrixsignal
        property: hs_token
    - secretKey: db_password
      remoteRef:
        key: mautrixsignal
        property: pg_password
