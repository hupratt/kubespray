---
# Source: 54d-matrix.yaml — tasks "Create bridge data PVC", "Create bridge
# ServiceAccount", "Deploy mautrix-whatsapp Deployment", "Create bridge Service".
# The Ingress and NetworkPolicy tasks were commented out in the source and are
# omitted here (the bridge is reached in-cluster via its Service).
#
# CHANGED vs Ansible: the config volume mounts the ESO-managed Secret
# `mautrix-whatsapp-config` (was a ConfigMap); the imperative checksum/config
# annotation (lookup pipe date) is dropped.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautrix-whatsapp-data
  namespace: matrix
  labels:
    app.kubernetes.io/name: mautrix-whatsapp
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mautrix-whatsapp
  namespace: matrix
  labels:
    app.kubernetes.io/name: mautrix-whatsapp
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: matrix
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-whatsapp
  namespace: matrix
  labels:
    app.kubernetes.io/name: mautrix-whatsapp
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: matrix
spec:
  replicas: 1   # bridge must be single-replica (WhatsApp WS session)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautrix-whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautrix-whatsapp
        app.kubernetes.io/component: bridge
        app.kubernetes.io/part-of: matrix
    spec:
      serviceAccountName: mautrix-whatsapp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
        fsGroup: 1337
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-config
          image: dock.mau.dev/mautrix/whatsapp:latest
          command: ["cp", "/config-src/config.yaml", "/data/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /config-src/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      containers:
        - name: bridge
          image: dock.mau.dev/mautrix/whatsapp:latest
          imagePullPolicy: Always
          command: ["/usr/bin/mautrix-whatsapp"]
          args: ["--config", "/data/config.yaml", "--no-update"]
          ports:
            - name: http
              containerPort: 29318
              protocol: TCP
          env:
            - name: MAUTRIX_WA_NETWORK__DISPLAYNAME_TEMPLATE
              value: '{{or .BusinessName .PushName .Phone .RedactedPhone "Unknown user"}} (WA)'
            - name: MAUTRIX_WA_APPSERVICE__USERNAME_TEMPLATE
              value: 'whatsapp_{{.}}'
            # Inject secrets as env vars; the bridge reads these automatically
            - name: MAUTRIX_WA_APPSERVICE__AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mautrix-whatsapp-creds
                  key: as_token
            - name: MAUTRIX_WA_APPSERVICE__HS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mautrix-whatsapp-creds
                  key: hs_token
            - name: MAUTRIX_WA_DATABASE__URI
              valueFrom:
                secretKeyRef:
                  name: mautrix-whatsapp-creds
                  key: uri
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /_matrix/mau/live
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /_matrix/mau/ready
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: config
          secret:
            secretName: mautrix-whatsapp-config
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-whatsapp-data
---
apiVersion: v1
kind: Service
metadata:
  name: mautrix-whatsapp
  namespace: matrix
  labels:
    app.kubernetes.io/name: mautrix-whatsapp
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: matrix
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mautrix-whatsapp
  ports:
    - name: http
      port: 29318
      protocol: TCP
      targetPort: 29318
