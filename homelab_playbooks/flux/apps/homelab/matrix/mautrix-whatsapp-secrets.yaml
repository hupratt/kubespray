---
# Source: 54d-matrix.yaml — task "Deploy ExternalSecret for bridge credentials"
# Migrated verbatim (vault_path_mautrix -> Vault KV key `mautrixwhatsapp`).
# Injected as env vars in the Deployment; `uri` is assembled by the ESO template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-whatsapp-creds
  namespace: matrix
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-whatsapp-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        as_token: "{{ .as_token }}"
        hs_token: "{{ .hs_token }}"
        pg_password: "{{ .pg_password }}"
        pg_username: "{{ .pg_username }}"
        dbname: "{{ .dbname }}"
        uri: "postgresql://{{ .pg_username }}:{{ .pg_password }}@shared-pg-rw.cn-postgres.svc/{{ .dbname }}"
  data:
    - secretKey: as_token
      remoteRef:
        key: mautrixwhatsapp
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: mautrixwhatsapp
        property: hs_token
    - secretKey: pg_password
      remoteRef:
        key: mautrixwhatsapp
        property: pg_password
    - secretKey: pg_username
      remoteRef:
        key: mautrixwhatsapp
        property: pg_username
    - secretKey: dbname
      remoteRef:
        key: mautrixwhatsapp
        property: dbname
---
# Source: 54d-matrix.yaml — task "Deploy bridge config ConfigMap"
#         (renders charts/matrix/mautrix-whatsapp-config.yaml.j2)
# The template mixes non-secret settings with as_token/hs_token/pickle_key and
# the DB URI. Per the migration conventions, the whole config is produced by ESO
# as a Secret (was a ConfigMap) so no secret ever lands in a ConfigMap; the
# Deployment mounts it as a secret volume. Non-secret values are inlined; secret
# values and the assembled DB URI come from Vault (key `mautrixwhatsapp`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-whatsapp-config
  namespace: matrix
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-whatsapp-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          homeserver:
            address: http://matrix-synapse.matrix.svc.cluster.local:8008
            domain: matrix.thekor.eu
            async_media: false

          appservice:
            address: http://mautrix-whatsapp.matrix.svc.cluster.local
            hostname: 0.0.0.0
            port: 29318
            id: whatsapp
            bot:
              username: whatsappbot
              displayname: WhatsApp Bridge Bot
              avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr
            as_token: {{ .as_token }}
            hs_token: {{ .hs_token }}
            username_template: whatsapp_{{ "{{.}}" }}

          database:
            type: postgres
            uri: postgresql://{{ .pg_username }}:{{ .pg_password }}@shared-pg-rw.cn-postgres.svc/{{ .dbname }}

          bridge:
            command_prefix: "!wa"
            sync_with_custom_puppets: false
            permissions:
              "matrix.thekor.eu": user
              "@wazinsky:matrix.thekor.eu": admin

          network:
            history_sync:
              request_full_sync: false
              max_initial_conversations: -1
              media_requests:
                auto_request_media: true
                request_method: immediate

          encryption:
            allow: true
            default: true
            require: true
            pickle_key: "{{ .pickle_key }}"

          logging:
            min_level: warn
            writers:
              - type: stdout
                format: json
  data:
    - secretKey: as_token
      remoteRef:
        key: mautrixwhatsapp
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: mautrixwhatsapp
        property: hs_token
    - secretKey: pg_username
      remoteRef:
        key: mautrixwhatsapp
        property: pg_username
    - secretKey: pg_password
      remoteRef:
        key: mautrixwhatsapp
        property: pg_password
    - secretKey: dbname
      remoteRef:
        key: mautrixwhatsapp
        property: dbname
    - secretKey: pickle_key
      remoteRef:
        key: mautrixwhatsapp
        property: pickle_key
---
# Source: 54d-matrix.yaml — task "Deploy Synapse appservice registration ConfigMap"
# Embeds appservice tokens, so produced by ESO as a Secret (was a ConfigMap);
# Synapse mounts it as a secret volume (see synapse.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-whatsapp-registration
  namespace: matrix
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mautrix-whatsapp-registration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        whatsapp-registration.yaml: |
          id: whatsapp
          url: http://mautrix-whatsapp.matrix.svc.cluster.local:29318
          as_token: {{ .as_token }}
          hs_token: {{ .hs_token }}
          sender_localpart: whatsappreg
          rate_limited: false
          deactivate_login_for_users_under_this_as: false
          namespaces:
            users:
              - exclusive: true
                regex: "@whatsapp.*:matrix.thekor.eu"
            aliases: []
            rooms: []
  data:
    - secretKey: as_token
      remoteRef:
        key: mautrixwhatsapp
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: mautrixwhatsapp
        property: hs_token
