---
# Source: 54-matrix.yaml — task "Create Synapse secret"
# The original created a plaintext k8s Secret `synapse-secret` from Ansible vars
# (synapse_registration_shared_secret / synapse_macaroon_secret_key /
# synapse_db_password). Those secrets now come from Vault via ESO.
# The Synapse chart consumes this Secret by name (existingSecret: synapse-secret).
#
# NOTE: the Vault KV key `synapse` and its property names are the migrator's
# best guess (see BLOCKERS) — the source playbook only referenced undefined
# Ansible vars, so verify key/property names against Vault before applying.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-secret
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synapse-secret
    creationPolicy: Owner
  data:
    - secretKey: registration_shared_secret
      remoteRef:
        key: synapse
        property: registration_shared_secret
    - secretKey: macaroon_secret_key
      remoteRef:
        key: synapse
        property: macaroon_secret_key
    - secretKey: db_password
      remoteRef:
        key: synapse
        property: pg_password
