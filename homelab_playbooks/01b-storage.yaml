---
- name: Deploy Ceph toolbox, cephfs and the storage classes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rook_repo: "git@gitlab.thekor.eu:kube/rook.git"
    rook_dir: "/home/hugo/rook"
    kubeconfig_path: "/home/hugo/.kube/config"

  tasks:

    - name: Check if Rook repo exists
      ansible.builtin.stat:
        path: "{{ rook_dir }}"
      register: repo_dir

    - name: Clone Rook repository if not present
      ansible.builtin.git:
        repo: "{{ rook_repo }}"
        dest: "{{ rook_dir }}"
        version: homelab
        update: true
        accept_hostkey: true
      when: not repo_dir.stat.exists

    - name: Apply RBD StorageClass
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ rook_dir }}/deploy/examples/csi/rbd/storageclass.yaml"

    - name: Apply the cephfs storage class
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ rook_dir }}/deploy/examples/csi/cephfs/storageclass.yaml"

    - name: Apply CephFilesystem (myfs)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: ceph.rook.io/v1
          kind: CephFilesystem
          metadata:
            name: myfs
            namespace: rook-ceph
          spec:
            metadataPool:
              replicated:
                size: 3
            dataPools:
              - name: data0
                replicated:
                  size: 3
            metadataServer:
              activeCount: 1
              activeStandby: true

    - name: Apply the toolbox
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ rook_dir }}/deploy/examples/toolbox.yaml"


