apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-role
rules:
  - apiGroups: ["", "apps", "extensions"]
    resources:
      - pods
      - services
      - deployments
      - replicasets
      - configmaps
      - events
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-role-binding
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: backup
roleRef:
  kind: ClusterRole
  name: backup-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delete-pushgateway-pods
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delete-pushgateway-pods-binding
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: backup
roleRef:
  kind: Role
  name: delete-pushgateway-pods
  apiGroup: rbac.authorization.k8s.io