---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haproxy-ingress
  namespace: haproxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haproxy-ingress-clusterrole
rules:
  # Core resources (non-namespaced or needed cluster-wide)
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - nodes
      - secrets
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]

  # EndpointSlices for modern service discovery
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # Networking resources (Ingresses and IngressClasses)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
    verbs: ["get", "list", "watch"]

  # CRDs (for custom extensions like cert-manager or custom Ingress types)
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]

  # Optional: access to Events for better logging/diagnostics
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haproxy-ingress-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: haproxy-ingress
    namespace: haproxy
roleRef:
  kind: ClusterRole
  name: haproxy-ingress-clusterrole
  apiGroup: rbac.authorization.k8s.io
