apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: haproxy-ingress
  namespace: haproxy
spec:
  selector:
    matchLabels:
      app: haproxy-ingress
  template:
    metadata:
      labels:
        app: haproxy-ingress
    spec:
      hostNetwork: true
      serviceAccountName: haproxy-ingress
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "slow-services"
          effect: "NoSchedule"
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: haproxy-ingress
          image: haproxytech/kubernetes-ingress:3.0.6

          args:
            - --configmap=default/haproxy-ingress-config
            - --http-port=8080
            - --https-port=8443
            - --default-backend-service=haproxy/nginx-service
            - --maps-dir=/etc/haproxy/maps

          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080
            - name: https
              containerPort: 8443
              hostPort: 8443

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: false
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: maps-dir
              mountPath: /etc/haproxy/maps

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

      volumes:
        - name: maps-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-ingress
  namespace: haproxy
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: haproxy-ingress
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-ingress-config
  namespace: haproxy
data:
  # optional tweaks, leave minimal for now
  syslog-endpoint: "stdout"
  ssl-redirect: "false"
  max-connections: "2000"
  ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
  backend-check-status: "200,401"
  use-forwarded-for: "true"
  healthz-port: "1042"   # or any port you want for the stats/health endpoint
  disable-backend-checks: "false"
  hard-stop-after: "600s"   # or higher, depending on your longest-lived connection type

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: haproxy
spec:
  controller: haproxy.org/ingress-controller
