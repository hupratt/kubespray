- name: provision sftpgo
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all/vault.yml
  vars:
    kubeconfig_path: ~/.kube/config
    sftpgo_repo: "git@gitlab.thekor.eu:kube/sftpgo.git"
    sftpgo_dir: "~/sftpgo"
  tasks:


    - name: Check if repo already exists
      ansible.builtin.stat:
        path: "{{ sftpgo_dir }}"
      register: repo_dir

    - name: Clone netbox git repo
      ansible.builtin.git:
        repo: "{{ sftpgo_repo }}"
        dest: "{{ sftpgo_dir }}"
        version: main
        force: yes
        accept_hostkey: yes
      when: not repo_dir.stat.exists

    - name: Create PersistentVolumes for sftpgo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: sftpgo-data
          spec:
            capacity:
              storage: 10Gi
            accessModes:
              - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            storageClassName: slow-local
            local:
              path: "/opt/sftpgo/sftpgo-data"
            nodeAffinity:
              required:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role
                        operator: In
                        values:
                          - slow-services

    - name: Create PVC for sftpgo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: sftpgo-data
            namespace: sftpgo
          spec:
            accessModes: [ReadWriteOnce]
            volumeName: sftpgo-data
            storageClassName: slow-local
            resources:
              requests:
                storage: 10Gi

    - name: Load SFTPGo chart values from file
      ansible.builtin.set_fact:
        sftpgo_values: "{{ lookup('file', 'group_vars/all/sftp-vault.yml') | from_yaml }}"

    - name: Create secret for the sftpgo database
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sftpgo-secret
          type: Opaque
          stringData: 
            sftpgo_secret_values: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__PASSWORD }}"
      no_log: true

    - name: Annotate sftpgo-secret secret declaratively
      kubernetes.core.k8s:
        state: present
        kind: Secret
        namespace: "monitoring"
        name: sftpgo-secret
        definition:
          metadata:
            annotations:
              replicator.v1.mittwald.de/replicate-to: "mariadb"

    - name: Create MariaDB Database for sftpgo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__NAME }}"
            namespace: mariadb
          spec:
            mariaDbRef:
              kind: MariaDB
              name: mariadb
              namespace: mariadb
              waitForIt: true
            characterSet: utf8
            collate: utf8_general_ci

    - name: Create MariaDB User for sftpgo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__USERNAME }}"
            namespace: mariadb
          spec:
            mariaDbRef:
              name: mariadb
              namespace: mariadb
            passwordSecretKeyRef:
              name: sftpgo-secret
              key: sftpgo_secret_values
            maxUserConnections: 20

    - name: Create MariaDB Connection for the user
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Connection
          metadata:
            name: sftpgo-connection
            namespace: mariadb
          spec:
            username: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__USERNAME }}"
            database: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__NAME }}"
            mariaDbRef:
              name: mariadb
              namespace: mariadb
              waitForIt: true
            passwordSecretKeyRef:
              name: sftpgo-secret
              key: sftpgo_secret_values

    - name: Create MariaDB Grant for the user
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: sftpgo-grant
            namespace: mariadb
          spec:
            mariaDbRef:
              name: mariadb
              namespace: mariadb
            username: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__USERNAME }}"
            database: "{{ sftpgo_values.env.SFTPGO_DATA_PROVIDER__NAME }}"
            table: "*"
            privileges:
              - ALL
            grantOption: false

    - name: Deploy SFTPGo Helm chart
      community.kubernetes.helm:
        name: my-sftpgo
        chart_ref: "{{ sftpgo_dir }}/sftpgo"
        release_namespace: sftpgo
        dependency_update: yes
        values: "{{ sftpgo_values }}"
        state: present
        force: no
        create_namespace: no

    - name: Patch SFTPGo service to add externalIPs
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: my-sftpgo
            namespace: sftpgo
          spec:
            externalIPs:
              - "10.10.85.24"
            ports:
              - name: sftp
                port: 2222
                targetPort: 2022

