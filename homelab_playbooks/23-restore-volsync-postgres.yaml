---

- name: PostgreSQL PVC restore via VolSync (CloudNativePG) apps should be installed before running these restore tasks, volsync as well
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config') }}"
    volsync_restore_timeout: 600
    dry_run: false

    immich_node_selector:
      node-role: slow-services

    immich_tolerations:
      - key: dedicated
        operator: Equal
        value: slow-services
        effect: NoSchedule

    db_owners:
      - owner: grafana
        vault_path: monitoring
      - owner: netbox
        vault_path: netbox
      - owner: authentik
        vault_path: authentik
      - owner: patchmon
        vault_path: patchmon
      - owner: harbor
        vault_path: harbor
      - owner: paperless
        vault_path: paperless
      - owner: ubuntu
        vault_path: makita-booking
      - owner: linkwarden
        vault_path: linkwarden 

    databases:
      - name: grafana
        owner: grafana
      - name: netbox
        owner: netbox
      - name: authentik
        owner: authentik
      - name: patchmon
        owner: patchmon
      - name: harbor-core
        owner: harbor
      - name: harbor-notary-server
        owner: harbor
      - name: harbor-notary-signer
        owner: harbor
      - name: harbor-trivy
        owner: harbor
      - name: booking
        owner: ubuntu
      - name: paperless
        owner: paperless
      - name: makita
        owner: ubuntu
      - name: linkwarden
        owner: linkwarden
      - name: craftstudios
        owner: ubuntu
        
    restore_pvcs:
      - name: shared
        namespace: cn-postgres
        pvc_name: shared
        storage_class: rook-ceph-block
        storage_size: 5Gi
        cluster: shared-pg
        secret: restic-credentials
        snaphost_class: ceph-rbd-snapclass
        pg_image: ghcr.io/cloudnative-pg/postgresql:16

      # - name: immich
      #   namespace: immich
      #   pvc_name: immich
      #   # storage_class: rook-ceph-block
      #   storage_class: slow-local
      #   storage_size: 100Gi
      #   cluster: immich-pg
      #   secret: volsync-restic-secret-db
      #   snaphost_class: ceph-rbd-snapclass
      #   pg_image: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.3.0

      # - name: immich-library
      #   namespace: immich
      #   secret: volsync-restic-secret-library
      #   pvc_name: immich-library
      #   # storage_class: rook-ceph-block
      #   storage_class: slow-local
      #   storage_size: 3000Gi

  tasks:

    - name: Check VolSync CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: replicationdestinations.volsync.backube
      register: _volsync_crd
      failed_when: _volsync_crd.resources | length == 0

    - name: Check CloudNativePG CRD exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusters.postgresql.cnpg.io
      register: _cnpg_crd
      failed_when: _cnpg_crd.resources | length == 0

    # loop goes on include_tasks — blocks cannot loop directly
    - name: Restore PVCs 
      ansible.builtin.include_tasks: tasks/23-restore-task.yaml
      loop: "{{ restore_pvcs }}"
      loop_control:
        loop_var: pvc
        label: "{{ pvc.name }}"
      when: pvc.name != "immich-library"

    - name: Restore lib PVC 
      ansible.builtin.include_tasks: tasks/23-restore-lib-task.yaml
      loop: "{{ restore_pvcs }}"
      loop_control:
        loop_var: pvc
        label: "{{ pvc.name }}"
      when: pvc.name == "immich-library"      