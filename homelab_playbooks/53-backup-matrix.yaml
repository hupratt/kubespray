---
- name: Deploy BackupMatrix
  hosts: localhost
  gather_facts: false
  vars:
    vault_kv_path: "backup-matrix"           # path within the mount
    external_secret_namespace: "backup"
    external_secret_name: "backupmatrix-secrets"
  tasks:
    # -------------------------------------------------------------------------
    # Deploy ExternalSecret
    # -------------------------------------------------------------------------
    - name: Deploy ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "{{ external_secret_name }}"
            namespace: "{{ external_secret_namespace }}"
          spec:
            refreshInterval: "1h"
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: "{{ external_secret_name }}"
              creationPolicy: Owner
            data:
              - secretKey: ALLOWED_HOSTS
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: ALLOWED_HOSTS
              - secretKey: DEBUG
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: DEBUG
              - secretKey: POSTGRES_DB
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: POSTGRES_DB
              - secretKey: POSTGRES_HOST
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: POSTGRES_HOST
              - secretKey: POSTGRES_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: pg_password
              - secretKey: POSTGRES_PORT
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: POSTGRES_PORT
              - secretKey: POSTGRES_USER
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: pg_username
              - secretKey: SECRET_KEY
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: SECRET_KEY

    # -------------------------------------------------------------------------
    # Web Deployment
    # -------------------------------------------------------------------------
    - name: Deploy web application
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backupmatrix-web
            namespace: "{{ external_secret_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backupmatrix-web
            template:
              metadata:
                labels:
                  app: backupmatrix-web
              spec:
                imagePullSecrets:
                  - name: docker-registry-secret
                securityContext:
                  # runAsNonRoot: true
                  # runAsUser: 10001
                  # fsGroup: 10001
                  seccompProfile:
                    type: Unconfined
                volumes:
                  - name: staticfiles
                    emptyDir: {}
                  - name: tmp
                    emptyDir: {}
                  - name: screenshot-tmp
                    emptyDir: {}
                  - name: screenshot-cache
                    emptyDir: {}
                containers:
                  # -----------------------------------------------------------
                  # Django / Gunicorn
                  # -----------------------------------------------------------
                  - name: web
                    image: registry.thekor.eu/docker/backup-matrix/backup-matrix:latest
                    ports:
                      - containerPort: 8000
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - name: staticfiles
                        mountPath: /app/staticfiles
                      - name: tmp
                        mountPath: /tmp
                    env:
                      - name: POSTGRES_DB
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: POSTGRES_DB
                      - name: POSTGRES_USER
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: POSTGRES_USER
                      - name: POSTGRES_HOST
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: POSTGRES_HOST
                      - name: POSTGRES_PORT
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: POSTGRES_PORT
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: POSTGRES_PASSWORD
                      - name: SECRET_KEY
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: SECRET_KEY
                      - name: DEBUG
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: DEBUG
                      - name: ALLOWED_HOSTS
                        valueFrom:
                          secretKeyRef:
                            name: backupmatrix-secrets
                            key: ALLOWED_HOSTS
                    readinessProbe:
                      tcpSocket:
                        port: 8000
                      initialDelaySeconds: 20
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 6
                    livenessProbe:
                      tcpSocket:
                        port: 8000
                      initialDelaySeconds: 60
                      periodSeconds: 20
                      timeoutSeconds: 2
                      failureThreshold: 6

                  # -----------------------------------------------------------
                  # Puppeteer screenshot sidecar
                  # Shares the pod network — reaches Django on localhost:8000.
                  # ALLOWED_HOST must be present in Django's ALLOWED_HOSTS
                  # (set in Vault under backup-matrix/ALLOWED_HOSTS).
                  # -----------------------------------------------------------
                  - name: screenshot
                    image: registry.thekor.eu/docker/backup-matrix/backup-matrix-screenshot:latest
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 3000
                    env:
                      - name: TARGET_URL
                        value: "https://backup-matrix.thekor.eu"
                      - name: ALLOWED_HOST
                        value: "localhost"
                      - name: PORT
                        value: "3000"
                    securityContext:
                      runAsUser: 0
                      runAsNonRoot: false
                      seccompProfile:
                        type: Unconfined
                      # allowPrivilegeEscalation: false
                      # readOnlyRootFilesystem: true
                      # capabilities:
                      #   drop:
                      #     - ALL
                    volumeMounts:
                      - name: screenshot-tmp
                        mountPath: /tmp
                      - name: screenshot-cache
                        mountPath: /root/.cache
                    readinessProbe:
                      tcpSocket:
                        port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 6
                    livenessProbe:
                      tcpSocket:
                        port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 20
                      timeoutSeconds: 2
                      failureThreshold: 6

    # -------------------------------------------------------------------------
    # Service
    # -------------------------------------------------------------------------
    - name: Expose web service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: backupmatrix-web
            namespace: "{{ external_secret_namespace }}"
          spec:
            selector:
              app: backupmatrix-web
            ports:
              - port: 8000
                targetPort: 8000

    - name: Expose screenshot service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: backupmatrix-screenshot
            namespace: "{{ external_secret_namespace }}"
          spec:
            selector:
              app: backupmatrix-web
            ports:
              - port: 3000
                targetPort: 3000
    # -------------------------------------------------------------------------
    # HAProxy Ingress
    # -------------------------------------------------------------------------
    - name: Create HAProxy ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: backupmatrix
            namespace: "{{ external_secret_namespace }}"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - backup-matrix.thekor.eu
                secretName: wildcard-thekor
            rules:
              - host: backup-matrix.thekor.eu
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: backupmatrix-web
                          port:
                            number: 8000
                    - path: /screenshot/
                      pathType: Prefix
                      backend:
                        service:
                          name: backupmatrix-screenshot
                          port:
                            number: 3000