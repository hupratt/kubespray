- name: "[{{ db.name }}] Delete temporary restore PVC"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ _temp_pvc }}"
    namespace: "{{ db.namespace }}"
  # when:
