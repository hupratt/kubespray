- name: "[{{ db.name }}] Done — {{ _post_count.stdout.strip() }} tables restored"
  ansible.builtin.debug:
    msg: "{{ db.name }} restored successfully via VolSync."
  # when:
  #   - _restore_needed
  #   - not dry_run | bool

