---
- name: "[{{ pvc.name }}] Set derived vars"
  ansible.builtin.set_fact:
    _cluster: "{{ pvc.cluster }}"
    _pod: "{{ pvc.name }}-pg-1"
    _pvc: "{{ pvc.name }}-pg-1"
    _rd: "restore-{{ pvc.name }}"
    _temp_pvc: "{{ pvc.name }}-restore-temp"

# --- credentials -------------------------------------------------------------

- name: "[{{ pvc.name }}] Read restic Secret"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ pvc.namespace }}"
    name: "{{ pvc.secret }}"
  register: _restic_raw
  failed_when: _restic_raw.resources | length == 0

- name: "[{{ pvc.name }}] Read DB app Secret"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ pvc.namespace }}"
    name: "{{ pvc.name }}-pg-vault-secret"
    # name: "{{ pvc.name }}-app-secret"
  register: _db_raw
  failed_when: _db_raw.resources | length == 0

- name: "[{{ pvc.name }}] Decode credentials"
  ansible.builtin.set_fact:
    _rc:
      key: "{{ _restic_raw.resources[0].data.AWS_ACCESS_KEY_ID | b64decode }}"
      secret: "{{ _restic_raw.resources[0].data.AWS_SECRET_ACCESS_KEY | b64decode }}"
      password: "{{ _restic_raw.resources[0].data.RESTIC_PASSWORD | b64decode }}"
      repo: "{{ _restic_raw.resources[0].data.RESTIC_REPOSITORY | b64decode }}/{{ pvc.name }}"
    _dc:
      # username: "{{ _db_raw.resources[0].data.DB_USERNAME | b64decode }}"
      # password: "{{ _db_raw.resources[0].data.DB_PASSWORD | b64decode }}"
      username: "{{ _db_raw.resources[0].data.username | b64decode }}"
      password: "{{ _db_raw.resources[0].data.password | b64decode }}"

# --- Restore to temporary PVC (DON'T touch CNPG PVC) -------------------------

- name: "[{{ pvc.name }}] Create temporary restore PVC"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ _temp_pvc }}"
        namespace: "{{ pvc.namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ pvc.storage_class }}"
        resources:
          requests:
            storage: "{{ pvc.storage_size }}"


- name: "[{{ pvc.name }}] Create ReplicationDestination to temp PVC"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      metadata:
        name: "{{ _rd }}"
        namespace: "{{ pvc.namespace }}"
      spec:
        trigger:
          manual: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
        restic:
          repository: "{{ pvc.secret }}"
          destinationPVC: "{{ _temp_pvc }}"
          copyMethod: Direct
          storageClassName: "{{ pvc.storage_class }}"
          accessModes:
            - ReadWriteOnce
          moverSecurityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999


- name: "[{{ pvc.name }}] Wait for ReplicationDestination to complete"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: volsync.backube/v1alpha1
    kind: ReplicationDestination
    name: "{{ _rd }}"
    namespace: "{{ pvc.namespace }}"
  register: _rd_status
  until: 
    - _rd_status.resources | length > 0
    - _rd_status.resources[0].status.lastManualSync is defined
  retries: "{{ (volsync_restore_timeout | default(300) / 10) | int }}"
  delay: 10
        
- name: "[{{ pvc.name }}] Hibernate CNPG Cluster"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ _cluster }}"
    namespace: "{{ pvc.namespace }}"
    state: patched
    definition:
      metadata:
        annotations:
          cnpg.io/hibernation: "on"


- name: "[{{ pvc.name }}] Wait for pod to terminate"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ pvc.namespace }}"
    name: "{{ _pod }}"
  register: _pod_gone
  until: _pod_gone.resources | length == 0
  retries: 24
  delay: 5

# Delete the cluster but keep the original PVC for backup
- name: "[{{ pvc.name }}] Delete CNPG Cluster (preserving original PVC)"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ _cluster }}"
    namespace: "{{ pvc.namespace }}"
    wait: true

# Remove finalizer if cluster is stuck
- name: "[{{ pvc.name }}] Remove cluster finalizer if needed"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: patched
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ _cluster }}"
    namespace: "{{ pvc.namespace }}"
    definition:
      metadata:
        finalizers: []
  ignore_errors: true

# Recreate cluster using the restored data
- name: "[{{ pvc.name }}] Recreate CNPG Cluster from restored data"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: "{{ _cluster }}"
        namespace: "{{ pvc.namespace }}"
      spec:
        instances: 1
        storage:
          size: "{{ pvc.storage_size }}"
          storageClass: "{{ pvc.storage_class }}"
        # Don't use bootstrap.recovery - instead use bootstrap.initdb and copy data
        bootstrap:
          initdb:
            database: "{{ pvc.name }}"
            owner: "{{ _dc.username }}"
            dataChecksums: true
        # Add affinity and resources as needed
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: cnpg.io/cluster
                    operator: In
                    values:
                    - "{{ _cluster }}"
                topologyKey: kubernetes.io/hostname

- name: "[{{ pvc.name }}] Wait for new pod Ready"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ pvc.namespace }}"
    name: "{{ _pod }}"
  register: _pod_ready
  until: 
    - _pod_ready.resources | length > 0
    - _pod_ready.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 36
  delay: 10

# --- verify ------------------------------------------------------------------

- name: "[{{ pvc.name }}] Wait for PostgreSQL to be ready"
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig }}"
    namespace: "{{ pvc.namespace }}"
    pod: "{{ _pod }}"
    command: "pg_isready"
  register: _pg_ready
  until: _pg_ready is success
  retries: 30
  delay: 5


- name: "[{{ pvc.name }}] Done — {{ _post_count.stdout.strip() }} tables restored"
  ansible.builtin.debug:
    msg: "{{ pvc.name }} restored successfully via VolSync."

# --- cleanup -----------------------------------------------------------------

- name: "[{{ pvc.name }}] Delete temporary restore PVC"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ _temp_pvc }}"
    namespace: "{{ pvc.namespace }}"
