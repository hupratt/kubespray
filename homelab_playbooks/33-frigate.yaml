---
- name: Deploy Frigate to Kubernetes via Helm
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: /home/hugo/.kube/config
    default_storage_class: rook-ceph-block
    frigate_namespace: frigate
    frigate_chart_path: "{{ playbook_dir }}/charts/frigate"
  
  tasks:
    - name: Deploy ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: frigate-vault-secrets
            namespace: "{{ frigate_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: frigate-vault-secrets
              creationPolicy: Owner
            data:
              - secretKey: frigate_rtsp_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: frigate_rtsp_password
              - secretKey: frigate_mqtt_host
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: frigate_mqtt_host
              - secretKey: frigate_mqtt_user
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: frigate_mqtt_user
              - secretKey: frigate_mqtt_password
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: frigate_mqtt_password
              - secretKey: ffmpeg_path
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: ffmpeg_path

    - name: Deploy ExternalSecret 
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: frigate-secret
            namespace: "{{ frigate_namespace }}"
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: frigate-secret
              creationPolicy: Owner
            data:
              - secretKey: FRIGATE_RTSP_PASSWORD
                remoteRef:
                  key: "{{ vault_kv_path }}"
                  property: frigate_rtsp_password

    - name: Read secret
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ frigate_namespace }}"
        name: frigate-vault-secrets
      register: vault_secret

    - name: Set default StorageClass
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        kind: StorageClass
        name: "{{ default_storage_class }}"
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"

    - name: Create Frigate RTSP secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: frigate-secret
            namespace: "{{ frigate_namespace }}"
          type: Opaque
          stringData:
            FRIGATE_RTSP_PASSWORD: "{{ frigate_rtsp_password }}"

    - name: Create Frigate config ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: frigate-config
            namespace: "{{ frigate_namespace }}"
          data:
            auth:
              enabled: False
            mqtt:
              enabled: True
              host: "{{ vault_secret.resources[0].data.frigate_mqtt_host | b64decode }}"
              user: "{{ vault_secret.resources[0].data.frigate_mqtt_user | b64decode }}"
              password: "{{ vault_secret.resources[0].data.frigate_mqtt_password | b64decode }}"
            cameras:
              reolink:
                detect:
                  enabled: True
                  height: 480
                  width: 704
                  fps: 5
                objects:
                  track:
                    - person
                    - car
                ffmpeg:
                  inputs:
                    - path: "{{ vault_secret.resources[0].data.ffmpeg_path | b64decode }}"
                      roles:
                        - detect
                        - record
                mqtt:
                  enabled: True
                  timestamp: True
                  bounding_box: True
                  crop: False
                  height: 270
                  quality: 70
            record:
              enabled: True
              continuous:
                days: 2
              motion:
                days: 2
              alerts:
                retain:
                  days: 2
                  mode: all
              detections:
                retain:
                  days: 2
                  mode: all

    - name: Deploy Frigate Helm chart
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: frigate
        chart_ref: "{{ frigate_chart_path }}"
        release_namespace: "{{ frigate_namespace }}"
        create_namespace: true
        values:
          storage:
            config:
              storageClassName: "{{ default_storage_class }}"
            media:
              storageClassName: "{{ default_storage_class }}"
          image:
            tag: stable
          rtspPassword:
            existingSecret: frigate-secret
            key: FRIGATE_RTSP_PASSWORD
          ingress:
            enabled: true
            ingressClassName: haproxy
            host: frigate.thekor.eu
            annotations:
              haproxy.org/timeout-tunnel: "3600s"
              haproxy.org/timeout-server: "30s"
            tls:
              enabled: true
              secretName: wildcard-thekor