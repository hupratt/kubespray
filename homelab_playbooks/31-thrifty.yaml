---
- name: Deploy Thrifty stack to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    namespace: thrifty
    storage_size: 10Mi
    currency_iso: EUR
    ingress_host: budget.thekor.eu
    ingress_class: haproxy

  tasks:

    # ── Persistence ──────────────────────────────────────────────────────────

    - name: Create rook-cephfs StorageClass
      k8s:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: rook-cephfs-thrifty
        definition:
          metadata:
            name: rook-cephfs-thrifty
          provisioner: rook-ceph.cephfs.csi.ceph.com
          parameters:
            clusterID: rook-ceph
            fsName: myfs
            pool: myfs-data0
            subvolumeGroup: csi
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            monitors: ceph-mon.rook-ceph.svc.cluster.local
            mounter: fuse
          mountOptions:
            - debug
          reclaimPolicy: Retain
          allowVolumeExpansion: true

    - name: Create PVC for static files
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: thrifty-api-data
            namespace: "{{ namespace }}"
          spec:
            storageClassName: rook-cephfs-thrifty
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: "{{ storage_size }}"

    # ── UI ───────────────────────────────────────────────────────────────────

    - name: Deploy UI
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ui
            namespace: "{{ namespace }}"
            labels:
              app: ui
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ui
            template:
              metadata:
                labels:
                  app: ui
              spec:
                containers:
                  - name: ui
                    image: tiehfood/thrifty-ui:latest
                    env:
                      - name: CURRENCY_ISO
                        value: "{{ currency_iso }}"
                    ports:
                      - containerPort: 8080
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        memory: 128Mi

    - name: Create UI service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: ui
            namespace: "{{ namespace }}"
          spec:
            selector:
              app: ui
            ports:
              - port: 8080
                targetPort: 8080

    # ── API ──────────────────────────────────────────────────────────────────

    - name: Deploy API
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api
            namespace: "{{ namespace }}"
            labels:
              app: api
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: api
            template:
              metadata:
                labels:
                  app: api
              spec:
                containers:
                  - name: api
                    image: tiehfood/thrifty-api:latest
                    env:
                      - name: SQLITE_DB_PATH
                        value: /data/thrifty.sqlite
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: data
                        mountPath: /data
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: thrifty-api-data

    - name: Create API service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: api
            namespace: "{{ namespace }}"
          spec:
            selector:
              app: api
            ports:
              - port: 8080
                targetPort: 8080

    # ── Ingress ──────────────────────────────────────────────────────────────

    - name: Create Ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: thrifty
            namespace: "{{ namespace }}"
          spec:
            ingressClassName: "{{ ingress_class }}"
            rules:
              - host: "{{ ingress_host }}"
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: api
                          port:
                            number: 8080
                    - path: /swagger
                      pathType: Prefix
                      backend:
                        service:
                          name: api
                          port:
                            number: 8080
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ui
                          port:
                            number: 8080

    # ── Verify ───────────────────────────────────────────────────────────────

    - name: Wait for UI rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/ui -n {{ namespace }} --timeout=120s
      changed_when: false
 
    - name: Wait for API rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/api -n {{ namespace }} --timeout=120s
      changed_when: false

    - name: Show deployed resources
      kubernetes.core.k8s_info:
        namespace: "{{ namespace }}"
        kind: Pod
      register: pods

    - name: Print pod status
      ansible.builtin.debug:
        msg: "{{ item.metadata.name }} → {{ item.status.phase }}"
      loop: "{{ pods.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"


